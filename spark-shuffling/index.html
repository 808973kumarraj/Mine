:root{--bg:#1b1a17;--fg:#e9e5d8;--muted:#9c978a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.3 "Plex Mono",monospace}

#stage{display:block;aspect-ratio:1080/1920;height:calc(100% - 46px);max-width:100%;width:auto;background:#ece9de;box-shadow:0 10px 40px rgba(0,0,0,.45)}

<div id="wrap">
<canvas id="stage" width="1080" height="1920" aria-label="Spark Performance episode 3 animation"></canvas>

<script>
'use strict';
// Spark Performance · Episode 3 (Shuffling) — coded reconstruction of the reference.
// Logical stage 1080x1920, 30 fps CFR, 2414 frames (0 … 80.433 s). Presenter footage is not reconstructed.
const W = 1080, H = 1920, FPS = 30, NFRAMES = 2414;

/* ---------- palette (sampled from reference frames) ---------- */
const C = {
  ink: '#1e1b0e', ink2: '#2a2820', gray: '#8a8676', gray2: '#68655a', faint: '#c9c5b6',
  paperTop: '#f2efe5', paperFront: '#ebe7da', paperSide: '#dcd8ca', panel: '#efece2',
  blue: '#2c4b8e', blueLine: '#3a4a6c', blueSoft: '#c8d5ec', green: '#3d7a62', greenSoft: '#9fc2ae',
  red: '#a63a2a', redSoft: '#c96e60', orange: '#c68a46', dark: '#1d1a13', code: '#e7e3d5', lav: '#a4a8e0',
  hdr: '#4b4f5a'
};

/* ---------- math / easing ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo3 = k => 1 - Math.pow(1 - k, 3);
const ei3 = k => k * k * k;
const eio3 = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eoBack = k => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const P = (x, y) => ({ x, y });
const add = (a, b) => P(a.x + b.x, a.y + b.y);
const sub = (a, b) => P(a.x - b.x, a.y - b.y);
const mul = (a, k) => P(a.x * k, a.y * k);

  for (let i = 1; i < frames.length; i++) {

  }
  return frames[frames.length - 1][1];
}

/* ---------- canvas ---------- */
const cv = document.getElementById('stage');

const ctx = cv.getContext('2d');

const F = {

  sm: s => `700 ${s}px "Space Mono", monospace`,
  sm4: s => `400 ${s}px "Space Mono", monospace`,
  px: s => `400 ${s}px "Silkscreen", monospace`,
  sg: s => `700 ${s}px "Space Grotesk", sans-serif`,
  sans: s => `300 ${s}px "Plex Sans", sans-serif`

function txt(s, x, y, o = {}) {

  ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';

function rich(parts, x, y, o = {}) {

}

  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function poly(pts, fill, stroke, lw = 2, dash) {
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.save(); ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; if (dash) ctx.setLineDash(dash); ctx.stroke(); ctx.restore(); }
}
function line(a, b, color, lw = 2, dash) { ctx.save(); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; if (dash) ctx.setLineDash(dash); ctx.stroke(); ctx.restore(); }
// affine frame: local (0,0)->p0, (w,0)->p1, (0,h)->p3
function withFace(p0, p1, p3, w, h, fn) {
  ctx.save();
  const ax = (p1.x - p0.x) / w, ay = (p1.y - p0.y) / w, bx = (p3.x - p0.x) / h, by = (p3.y - p0.y) / h;
  ctx.transform(ax, ay, bx, by, p0.x, p0.y); fn(); ctx.restore();

function pill(cx, cy, label, o = {}) {

  const tw = measure(label, font, ls) + (o.check || o.dot || o.cross ? 30 : 0);
  const w = o.w || tw + 44, h = o.h || 44;

  const r = isoBox(P0, U, V, 20 * s, { top: blueTop ? `rgb(${[242, 239, 230].map((v, i) => Math.round(lerp(v, [226, 232, 244][i], look))).join(',')})` : C.paperTop, shadowA: .25 });
  withFace(r.d, r.c, r.a, 150, 60, () => {
    txt('countries', 22, 30, { font: F.mono(15, 600), color: C.ink2, alpha: 1 - look * .8 });
    txt('200 rows', 22, 48, { font: F.mono(14), color: C.gray });
  });
  if (blueTop) poly([r.a, r.b, r.c, r.d], null, `rgba(60,90,160,${.6 * look})`, 2);
  ctx.restore();
}
function blueCopy(cx, cy, s, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const U = P(120 * s, -38 * s), V = P(-50 * s, -38 * s);
  const P0 = P(cx - (U.x + V.x) / 2, cy - (U.y + V.y) / 2);
  const r = isoBox(P0, U, V, 9 * s, { top: '#cfdcf2', front: '#b7c7e6', side: '#a8b9db', shadow: false });
  withFace(r.d, r.c, r.a, 150, 60, () => txt('countries', 18, 26, { font: F.mono(13, 500), color: '#5872a8' }));
  ctx.restore();
}
function s10(t) {
  const out = 1 - seg(t, 75.4, 75.5) * 0;
  const ex = [[200, 760, .92, 70.25, 'EXEC 1'], [680, 612, .72, 70.35, 'EXEC 2'], [380, 935, 1.0, 70.5, 'EXEC 3'], [895, 750, .82, 70.65, 'EXEC 4']];
  // title
  const tA = seg(t, 70.45, 70.75) * (1 - seg(t, 74.5, 74.65));
  if (tA > 0) {
    txt('LESS DATA MOVEMENT', 130, 288, { font: F.mono(17), color: C.gray, ls: 2.2, alpha: tA });
    txt('a powerful trick…', 130, 352, { font: F.sm(46), color: devColor(seg(t, 70.45, 70.8)), alpha: tA });
  }
  const bA = seg(t, 74.65, 74.75);
  if (bA > 0) {
    txt('NEXT EPISODE →'.replace(' →', ''), 130, 288, { font: F.mono(17), color: C.gray, ls: 2.2, alpha: bA });
    ctx.save(); ctx.globalAlpha = bA; arrowGlyph(130 + measure('NEXT EPISODE', F.mono(17), 2.2) + 8, 282, 14, C.gray, 1.6); ctx.restore();
    const full = 'BROADCAST JOIN'; const n = Math.min(full.length, Math.floor((t - 74.7) * 26));
    txt(full.slice(0, Math.max(0, n)), 130, 360, { font: F.sg(56), color: C.blue });
  }
  // executors (drawn back to front)
  const order = [1, 3, 0, 2];
  const trayLook = seg(t, 73.6, 73.85);
  for (const i of order) {
    const [cx, cy, s, t0, lab] = ex[i];
    if (t < t0) continue;
    const k = eo3(seg(t, t0, t0 + 0.22));
    const lift = (1 - k) * 230;
    softShadow(cx + 14, cy + 62 * s, 120 * s * (.5 + .5 * k), 30 * s, .2);
    ctx.save(); ctx.globalAlpha *= Math.min(1, k * 1.5);
    isoExec(cx, cy - lift, s, lab, 1, Math.sin(t * 2.6 + i) > 0);
    ctx.restore();
    if (i === 1) countriesTray(540, 745, 1, trayLook, eo3(seg(t, 71.3, 71.55)) * (t < 71.55 ? 1 : 1));
  }
  // broadcast copies flying out (74.75 →)
  const dests = [[197, 640], [684, 500], [378, 800], [896, 640]];
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 3; j++) {
      const st = 74.75 + i * .08 + j * .1; const k = eio3(seg(t, st, st + .55));
      if (k <= 0) continue;
      const p = plerp(P(540, 690), P(dests[i][0], dests[i][1] - 40 + j * 8), k);
      blueCopy(p.x, p.y - Math.sin(k * Math.PI) * 120, .9, .85 * (1 - j * .25));
    }
  }
}

/* ======================================================================
   SCENE 12 (76.45 – 80.47 s): end card

function s12(t) {
  txt('DATA / 03', 540, 409, { font: F.px(22), color: '#7d796c', align: 'center', ls: 6 });
  txt('Spark Performance', 540, 520, { font: F.sm(66), color: C.ink, align: 'center' });

    ctx.save(); ctx.globalAlpha = Math.min(1, a); ctx.translate(xs[i], 708 - (1 - Math.min(1, a)) * 14); ctx.scale(.85 + .15 * a, .85 + .15 * a);
    ctx.shadowColor = 'rgba(50,45,30,.25)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 8;
    rrect(-52, -27, 104, 54, 7); ctx.fillStyle = i === 0 ? C.blue : C.panel; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.lineWidth = 2.2; ctx.strokeStyle = C.ink2; ctx.stroke();
    txt(k, 0, 2, { font: F.mono(24, 500), color: i === 0 ? '#eef0f6' : C.ink2, align: 'center', base: 'middle' });

}

/* ---------- master timeline ---------- */
// Intervals where the reference shows only the (removed) presenter. Their underlying
// content is never visible, so the preceding shot is held and the cut placed mid-gap.
const SHOTS = [
  [0, 7.27, t => s1(Math.min(t, 6.5))],
  [7.27, 30.4, t => sRow(Math.min(t, 29.07))],
  [30.4, 46.97, t => s6(Math.max(t, 31.5))],
  [46.97, 55.9, t => s7(Math.min(t, 54.43))],
  [55.9, 63.6, t => s8(Math.max(t, 57.3))],
  [63.1, 70.32, t => s9(t)],
  [70.25, 76.45, t => s10(Math.min(t, 75.27))],
  [76.45, 99, t => s12(Math.max(t, 77.45))]
];
function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.drawImage(bg, 0, 0);
  for (const [a, b, fn] of SHOTS) if (t >= a && t < b) { ctx.save(); fn(t); ctx.restore(); }
  drawHeader(t);
}

/* ---------- deterministic seek + player ---------- */
let curFrame = 0, playing = false, t0wall = 0, f0 = 0;
function seek(n) {
  n = Math.max(0, Math.min(NFRAMES - 1, Math.round(n)));
  curFrame = n; renderAt(n / FPS); updateUI(); return n;
}
window.seek = seek;
window.renderTime = t => renderAt(t);
window.FRAME_COUNT = NFRAMES; window.FPS = FPS;
const ui = { play: document.getElementById('play'), bar: document.getElementById('scrub'), tc: document.getElementById('tc') };
function updateUI() {
  if (!ui.bar) return;
  ui.bar.value = curFrame;
  const s = curFrame / FPS; ui.tc.textContent = `${s.toFixed(2)}s · f${curFrame}`;
  ui.play.textContent = playing ? '❚❚' : '▶';
}
function tick(now) {
  if (!playing) return;
  const f = f0 + Math.floor((now - t0wall) / 1000 * FPS);
  if (f >= NFRAMES) { playing = false; seek(NFRAMES - 1); return; }
  if (f !== curFrame) seek(f);
  requestAnimationFrame(tick);
}
function setPlaying(p) {
  playing = p; if (p) { if (curFrame >= NFRAMES - 1) curFrame = 0; f0 = curFrame; t0wall = performance.now(); requestAnimationFrame(tick); }
  updateUI();
}
if (ui.bar) {
  ui.bar.max = NFRAMES - 1;
  ui.play.onclick = () => setPlaying(!playing);
  ui.bar.oninput = e => { setPlaying(false); seek(+e.target.value); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    if (e.code === 'ArrowRight') { setPlaying(false); seek(curFrame + (e.shiftKey ? 30 : 1)); }
    if (e.code === 'ArrowLeft') { setPlaying(false); seek(curFrame - (e.shiftKey ? 30 : 1)); }
  });
}
window.ready = document.fonts.ready.then(() => Promise.all([
  '400 20px "Plex Mono"', '500 20px "Plex Mono"', '600 20px "Plex Mono"', '700 20px "Space Mono"', '400 20px "Silkscreen"', '700 20px "Space Grotesk"', '300 20px "Plex Sans"'
].map(f => document.fonts.load(f, 'A₹')))).then(() => { seek(0); if (!/[?&]paused/.test(location.search)) setPlaying(true); });
