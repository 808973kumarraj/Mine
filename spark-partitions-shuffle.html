function header(){txt('> SPARK INTERNALS / PARTITIONS / 02',60,128,{font:`400 25px ${F.pix}`,col:'#3a3833',ls:4});
 g.save();g.font=`400 25px ${F.pix}`;if('letterSpacing'in g)g.letterSpacing='4px';const w=g.measureText('> SPARK INTERNALS / PARTITIONS / 02').width;g.restore();
 if(Math.floor(NOW*2)%2===0){g.fillStyle=C.orange;g.fillRect(60+w+8,106,14,24)}
 g.fillStyle='#cfc9b8';g.fillRect(60,150,960,2);g.fillStyle=C.navy;g.fillRect(60,149,960*(NOW/T),4)}
function titleBlock(s,i,lt){const a=lin(lt,.1,.6);if(s.end)return;
 if(s.center){txt(s.k,540,250,{size:19,col:C.mut,align:'center',ls:4,a});let total=0;g.font=`700 54px ${F.mono}`;s.title.forEach(([t])=>total+=g.measureText(t).width);let x=540-total/2;s.title.forEach(([t,c])=>{txt(t,x,330,{size:54,w:700,col:c,a});g.font=`700 54px ${F.mono}`;x+=g.measureText(t).width});return}
 txt(s.k,90,250,{size:19,col:C.mut,ls:3,a});g.font=`700 50px ${F.mono}`;let tot=0;s.title.forEach(([t])=>tot+=g.measureText(t).width);const sz=Math.min(50,Math.floor(50*900/tot));let x=90;s.title.forEach(([t,c])=>{txt(t,x,322,{size:sz,w:700,col:c,a});g.font=`700 ${sz}px ${F.mono}`;x+=g.measureText(t).width})}
function captions(i,lt){const s=SC[i],{lines,size,lh}=wrapped(i),n=s.words.length,span=s.dur*.86,wt=span/n;
 const y0=s.end?1480:1400;
 lines.forEach((l,li)=>l.forEach(([wd,j,x])=>{const a=cl((lt-j*wt)/.25);txt(wd,90+x,y0+li*lh,{size,w:500,f:F.sans,col:mix('#c4bfae',C.ink,a)})}));
 let x=90;const cy=1820;g.font=`400 15px ${F.mono}`;s.hood.forEach((h,k)=>{const w=g.measureText(h).width+26;if(x+w>990)return;const a=lin(lt,1+k*.3,1.6+k*.3);g.save();g.globalAlpha=a;rr(x,cy-17,w,34,17);g.strokeStyle='#8c887c';g.lineWidth=1.4;g.stroke();g.restore();txt(h,x+13,cy+5,{size:15,col:'#5f5b52',a});x+=w+10});
 txt(`${String(i+1).padStart(2,'0')} / ${SC.length}`,990,1880,{size:15,col:C.mut,align:'right'});
}
function frame(){const i=chapterAt(NOW),s=SC[i],lt=NOW-ST[i],u=lt/s.dur*10;
 background();header();titleBlock(s,i,lt);
 g.save();const ap=ez(lt/.45);g.globalAlpha=ap;g.translate(0,(1-ez(lt/.6))*28);s.draw(u,lt);g.restore();
 costCard(s,u);captions(i,lt)}
/* ---------- player ---------- */
const chapterAt=tt=>{let i=0;for(let j=0;j<ST.length;j++)if(ST[j]<=tt)i=j;return i};
const $=id=>document.getElementById(id);const pp=$('pp'),sc=$('sc'),tm=$('tm'),vc=$('vc'),recB=$('rec'),ch=$('ch');
const btns=SC.map((s,i)=>{const b=document.createElement('button');b.textContent=i===0?'intro':s.end?'end':String(i);b.title=s.title.map(x=>x[0]).join('')||'end';b.onclick=()=>go(i);ch.appendChild(b);return b});
let t=0,play=true,last=performance.now(),cur=-1,voice=false,rec=null;
function go(i){t=ST[cl(i,0,SC.length-1)]+.01;cur=-1;if(voice)speechSynthesis.cancel()}
pp.onclick=()=>{play=!play;if(play&&t>=T)t=0;pp.textContent=play?'❚❚ pause':'▶ play';if(voice){play?speechSynthesis.resume():speechSynthesis.pause()}};
sc.oninput=()=>{t=sc.value/10000*T;if(voice)speechSynthesis.cancel()};
vc.onclick=()=>{if(!('speechSynthesis'in window)){vc.textContent='no voice';return}voice=!voice;vc.classList.toggle('on',voice);vc.textContent=voice?'🔊 voice':'🔈 voice';if(voice)cur=-1;else speechSynthesis.cancel()};
recB.onclick=()=>{if(rec){rec.stop();return}if(!cv.captureStream||!window.MediaRecorder){recB.textContent='not supported';return}
 const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));const chunks=[];
 rec=new MediaRecorder(cv.captureStream(30),{mimeType:mt,videoBitsPerSecond:8e6});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));const a=document.createElement('a');a.href=url;a.download='spark-partitions-shuffle.webm';a.click();rec=null;recB.textContent='⏺ record .webm';recB.classList.remove('on')};
 if(voice)vc.click();t=0;play=true;pp.textContent='❚❚ pause';rec.start(1000);recB.textContent='■ stop';recB.classList.add('on')};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.click()}else if(e.key==='ArrowRight')go(chapterAt(t)+1);else if(e.key==='ArrowLeft')go(chapterAt(t)-(t-ST[chapterAt(t)]<1.5?1:0))});
function speak(i){if(!voice)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SC[i].n);u.rate=1.02;speechSynthesis.speak(u)}
const fmt=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(play){const i0=chapterAt(Math.min(t,T-.001));const hold=voice&&speechSynthesis.speaking&&t+dt>=ST[i0]+SC[i0].dur-.05&&i0<SC.length-1;if(!hold)t+=dt;
  if(t>=T){if(rec){t=T;rec.stop()}else{t=T;play=false;pp.textContent='▶ replay'}}}
 NOW=Math.min(t,T-.001);frame();sc.value=Math.round(NOW/T*10000);tm.textContent=`${fmt(NOW)} / ${fmt(T)}`;
 const i=chapterAt(NOW);if(i!==cur){cur=i;btns.forEach((b,j)=>b.classList.toggle('on',j===i));if(play)speak(i)}
 requestAnimationFrame(loop)}
const fontsReady=document.fonts?Promise.race([Promise.all([`700 50px "Space Mono"`,`400 20px "Space Mono"`,`500 40px "IBM Plex Sans"`,`25px "Silkscreen"`].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontsReady.then(()=>{wrapCache.clear();last=performance.now();requestAnimationFrame(loop)});
if(document.fonts)document.fonts.addEventListener('loadingdone',()=>wrapCache.clear());
</script></body></html>
