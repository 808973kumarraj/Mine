S({title:[['why partitions ',C.ink],['matter',C.navy]],

   if(i===3){for(let k=0;k<3;k++){box2(ix+k*60,y+64,48,30,{a,fill:mix('#ffffff',C.plum,.2),stroke:C.plum});vArrow(ix+24+k*60,y+98,y+122,a*p);gear(ix+24+k*60,y+140,13,0,{a:a*p})}}

   const p=lin(u,.9+i*2.6,3.2+i*2.6);
   if(i===0){for(let k=0;k<8;k++){const busy=k<2;box2(115+k*60,y+80,48,48,{a,fill:busy?C.navy:'#e3dfd3'});}txt('8 cores · 2 partitions',115,y+160,{size:17,col:'#4a4842',a});

    txt('6 cores idle · huge tasks may spill',115,y+210,{size:18,w:700,col:C.brick,a:seg(u,2,2.6)})}
   if(i===1){for(let k=0;k<60;k++){const x=115+(k%30)*28,yy=y+80+Math.floor(k/30)*44,on=p>k/60;g.save();g.globalAlpha=a;g.fillStyle=on?C.navy:'#e3dfd3';g.fillRect(x,yy,14,34);g.fillStyle=C.brick;g.fillRect(x+14,yy,8,34);g.restore()}
    txt('100,000 tiny tasks: the red slivers are scheduling overhead',115,y+200,{size:17,col:C.brick,w:700,a:seg(u,4.6,5.2)})}
   if(i===2){for(let k=0;k<8;k++){g.save();g.globalAlpha=a;for(let w=0;w<3;w++){const f=cl(p*3-w);g.fillStyle=[C.navy,C.green,C.ochre][w];g.fillRect(115+k*60,y+150-w*26,48*f,22)}g.strokeStyle=C.ink;g.lineWidth=1.2;g.strokeRect(115+k*60,y+72,48,100);g.restore()}

  });
 }});

  pill(540,905,'partition = hash(key) % 4',C.navy,{dot:false,size:15,a:seg(u,1.2,1.8)});
  let r=0;BEFORE.forEach((recs,p)=>recs.forEach(([k,v],j)=>{const q=KEYS.indexOf(k),kk=AFTER[k].indexOf(v),s0=2.2+r*.5,pr=seg(u,s0,s0+1.6);r++;
   const src=[sx[p]+24,690-220+50+j*52],dst=[tx[q]+18,1250-200+50+kk*46];

 n:'That movement is why shuffles are expensive. Records are serialized, written to disk, sent across the network, and deserialized again, and the next stage waits until all of it is done. So minimize data movement: filter rows and columns early, combine before shuffling with reduceByKey, and broadcast small tables instead of shuffling them.',

   if(i===0)bin(x+220,y+115,'01000001 00110001',{a,size:17});

   if(i===3)for(let k=0;k<4;k++)chip(x+30+(k%2)*200,y+80+Math.floor(k/2)*48,KEYS[k],k+1,{w:180,h:40,size:17,a})});

  const tips=[['filter rows & select columns early','less data to move'],['reduceByKey, not groupByKey','combine on the map side first'],['broadcast small tables','join without shuffling the big side']];
  tips.forEach(([t,d],i)=>{const y=920+i*112,a=seg(u,6+i*.9,6.7+i*.9);card(90,y,900,96,'',{a,border:C.green});mark(125,y+48,true,a);txt(t,160,y+44,{size:23,w:700,a});txt(d,160,y+76,{size:18,f:F.sans,col:'#5f5b52',a})});
 }});
