<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spark Shuffle in 3D</title>
<style>
:root{--bg:#0f1420;--fg:#e8ecf4;--mut:#8a94a8;--acc:#f5a524;--panel:#171e2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);margin:0 0 10px;font-size:13px}
.stage{width:100%;max-width:1000px;background:var(--panel);border-radius:14px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:auto}
.cap{padding:12px 16px;min-height:86px;border-top:1px solid #263049}.cap b{color:var(--acc)}
.ctl{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid #263049;flex-wrap:wrap}
button{background:#263049;color:var(--fg);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
button.on{background:var(--acc);color:#111}input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
.ch{display:flex;gap:6px;flex-wrap:wrap}
</style></head><body>
<h1>How a Spark Shuffle Works</h1><p class="sub">groupByKey / reduceByKey: moving records so every key lands on one reducer</p>
<div class="stage"><canvas id="c" width="1000" height="560"></canvas>
<div class="cap" id="cap"></div>
<div class="ctl"><button id="pp">❚❚ Pause</button><input id="sc" type="range" min="0" max="1000" value="0"><span id="tm" style="color:var(--mut);font-size:12px;width:70px"></span></div>
<div class="ctl ch" id="ch"></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=1000*DPR;cv.height=560*DPR;g.scale(DPR,DPR);
const KC=[['#4f8cff','#3a6bd0','#2c52a3'],['#2fc28a','#23996c','#197250'],['#ff6b6b','#d64f4f','#a83b3b']];
const KN=['A','B','C'];
const SCENES=[
 {d:6,t:'1 · Map stage',c:'A wide transformation (groupByKey, reduceByKey, join) needs every record with the same key in one place. Right now the keys A, B, C are <b>scattered across all executors\' partitions</b>, so Spark has to split the job into two stages with a shuffle in between.'},
 {d:7,t:'2 · Partition & sort',c:'Each map task assigns every record to a reducer with <b>hash(key) % numPartitions</b> and sorts the records by partition ID (sort-based shuffle, the default since Spark 1.2). If memory fills up, sorted runs <b>spill to disk</b> and get merged later. With DataFrames/SQL the partition count comes from <b>spark.sql.shuffle.partitions</b> (default 200).'},
 {d:6,t:'3 · Write data + index file',c:'Each map task writes <b>one data file</b> holding all its buckets back-to-back, plus <b>one small index file</b> recording where each bucket starts. (The old hash shuffle wrote one file per reducer.) This is the <b>stage boundary</b>: reducers wait until all map output exists.'},
 {d:8,t:'4 · Fetch over network',c:'Each reducer asks the driver\'s <b>MapOutputTracker</b> where its blocks are, then fetches its slice from <b>every</b> executor. It uses the index file to find the byte offset and reads only its own slice (the shuffle read). This all-to-all disk + network + serialization cost is why shuffles are expensive. An <b>external shuffle service</b> can serve these files even after an executor goes away.'},
 {d:7,t:'5 · Merge & aggregate',c:'Each reducer now has <b>all records for its keys</b> and merges them, e.g. count by key. Tips: <b>reduceByKey</b> combines on the map side first, so less data crosses the network. <b>AQE</b> (spark.sql.adaptive.enabled) can merge small shuffle partitions toward ~64 MB each. Broadcast joins skip the shuffle entirely.'}];
let starts=[],T=0;SCENES.forEach(s=>{starts.push(T);T+=s.d});
const MAPKEYS=[[0,1,2,0,2,1],[1,1,0,2,0,2],[2,0,1,1,2,0]];
const R=[];const perKey=[0,0,0];
MAPKEYS.forEach((ks,m)=>{const cnt=[0,0,0];ks.forEach((k,s)=>R.push({m,s,k,j:cnt[k]++}))});
MAPKEYS.forEach((_,m)=>[0,1,2].forEach(k=>R.filter(r=>r.m==m&&r.k==k).forEach(r=>r.n=perKey[k]++)));
const S=27,OX=500,OY=110;
const iso=(x,y,z)=>[OX+(x-y)*0.866*S,OY+(x+y)*0.5*S-z*S];
function box(x,y,z,w,d,h,c){const p=(a,b,cc)=>iso(a,b,cc);
 const f=(pts,col)=>{g.beginPath();pts.forEach((q,i)=>{const s=p(...q);i?g.lineTo(...s):g.moveTo(...s)});g.closePath();g.fillStyle=col;g.fill();g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;g.stroke()};
 f([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c[1]);
 f([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c[2]);
 f([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],c[0]);}
function label(x,y,z,txt,col='#e8ecf4',sz=12,a=1){const[s,t]=iso(x,y,z);g.globalAlpha=a;g.font=`600 ${sz}px system-ui`;g.textAlign='center';g.fillStyle=col;g.fillText(txt,s,t);g.globalAlpha=1}
const cl=v=>Math.max(0,Math.min(1,v)),ez=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
const ph=(t,i,a=0,b=1)=>ez(cl(((t-starts[i])/SCENES[i].d-a)/(b-a)));
const lerp=(a,b,p)=>a+(b-a)*p;
function recPos(r,t){
 let x=r.m*5+(r.s%3)*1.1-1.1,y=Math.floor(r.s/3)*1.1-0.5,z=0.35,sc=1;
 const p2=ph(t,1,.1,.8);x=lerp(x,r.m*5+r.k*1.1-1.1,p2);y=lerp(y,0.9,p2);z=lerp(z,0.35+r.j*0.75,p2);
 const p3=ph(t,2,.1,.7);y=lerp(y,3.6,p3);
 const p4=ph(t,3,r.m*.18+.05,r.m*.18+.6);
 const tx=r.k*5+(r.n%3)*1.1-1.1,ty=9.3+Math.floor(r.n/3)*1.1-0.5;
 x=lerp(x,tx,p4);y=lerp(y,ty,p4);z=lerp(z,0.35,p4)+Math.sin(Math.PI*p4)*4;
 const p5=ph(t,4,.05,.55);x=lerp(x,r.k*5-0.35,p5);y=lerp(y,9.4,p5);z=lerp(z,0.35+r.n*0.45,p5);sc=lerp(1,1.6,p5);
 return{x,y,z,sc};}
function draw(t){g.clearRect(0,0,1000,560);
 const g1=g.createLinearGradient(0,0,0,560);g1.addColorStop(0,'#141b2b');g1.addColorStop(1,'#0f1420');g.fillStyle=g1;g.fillRect(0,0,1000,560);
 const plat=['#2a3550','#222b42','#1a2134'],plat2=['#3a2f55','#2e2545','#231c36'],disk=['#5a5f6e','#464a57','#343742'];
 for(let i=0;i<3;i++){box(i*5-1.8,-1.4,0,3.6,3.2,.35,plat);}
 const dA=cl((t-starts[2])/1.5);
 for(let i=0;i<3;i++){if(dA>0){g.globalAlpha=dA;box(i*5-1.8,3.1,0,3.6,1.4,.35,disk);g.globalAlpha=1}}
 for(let i=0;i<3;i++){box(i*5-1.8,8.4,0,3.6,2.8,.35,plat2);}
 // network lines
 const nA=t>=starts[3]?Math.min(1,(t-starts[3])/1)*(t<starts[4]+1?1:Math.max(0,1-(t-starts[4]-1))):0;
 if(nA>0){g.setLineDash([4,6]);g.lineDashOffset=-t*30;for(let m=0;m<3;m++)for(let k=0;k<3;k++){const a=iso(m*5,3.8,.4),b=iso(k*5,8.6,.4);g.strokeStyle=KC[k][0];g.globalAlpha=.35*nA;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}g.setLineDash([]);g.globalAlpha=1}
 const items=R.map(r=>({r,...recPos(r,t)}));
 items.sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.z-b.z);
 items.forEach(o=>{const w=.8*o.sc;box(o.x-w/2+.4,o.y-.4+(.8-.8*o.sc)/2+(.8*o.sc-.8)/2,o.z,w,.8,.6*(o.sc>1?.7:1),KC[o.r.k]);
   if(o.sc<1.05){const[s,q]=iso(o.x+.4,o.y,o.z+.6);g.font='bold 10px system-ui';g.fillStyle='#fff';g.textAlign='center';g.fillText(KN[o.r.k],s,q+3)}});
 for(let i=0;i<3;i++){label(i*5-2.2,-1.6,0,`Executor ${i+1} · map task`,'#aab4cc',12);
   label(i*5+1.6,11.6,0,`Reducer ${i} · partition ${i}`,KC[i][0],12);}
 if(dA>0)label(12.3,4.4,0,'data + index files (local disk)','#c9ccd6',12,dA);
 const hA=ph(t,1,0,.2)*(1-ph(t,2,0,.3));
 if(hA>0){for(let m=0;m<3;m++)for(let k=0;k<3;k++)label(m*5+k*1.1-1.1+.4,1.4,0,`→${k}`,KC[k][0],10,hA);
   g.globalAlpha=hA;g.font='600 16px ui-monospace,monospace';g.fillStyle='#f5a524';g.textAlign='left';g.fillText('partition = hash(key) % 3  → sort by partition',24,40);g.globalAlpha=1}
 if(nA>0){g.globalAlpha=nA;g.font='600 16px ui-monospace,monospace';g.fillStyle='#f5a524';g.textAlign='left';g.fillText('all-to-all network fetch (shuffle read)',24,40);g.globalAlpha=1}
 const rA=ph(t,4,.5,.8);
 if(rA>0){for(let k=0;k<3;k++){const[s,q]=iso(k*5,9.4,0.35+6*0.45+1.4);g.globalAlpha=rA;g.fillStyle='#0b0f18cc';g.fillRect(s-38,q-16,76,24);g.fillStyle=KC[k][0];g.font='bold 14px ui-monospace,monospace';g.textAlign='center';g.fillText(`${KN[k]} → ${perKey[k]}`,s,q+1);g.globalAlpha=1}
   g.globalAlpha=rA;g.font='600 16px ui-monospace,monospace';g.fillStyle='#f5a524';g.textAlign='left';g.fillText('merge + aggregate: count by key',24,40);g.globalAlpha=1}
 const ms=['Stage 1: Map (shuffle write)','Stage 2: Reduce (shuffle read)'];
 g.font='600 12px system-ui';g.fillStyle='#6f7a92';g.textAlign='right';g.fillText(ms[0],980,24);g.fillText(ms[1],980,530);
}
const cap=document.getElementById('cap'),sc=document.getElementById('sc'),pp=document.getElementById('pp'),tm=document.getElementById('tm'),ch=document.getElementById('ch');
const btns=SCENES.map((s,i)=>{const b=document.createElement('button');b.textContent=s.t;b.onclick=()=>{t=starts[i]+.01};ch.appendChild(b);return b});
let t=0,play=true,last=performance.now(),cur=-1;
pp.onclick=()=>{play=!play;if(play&&t>=T)t=0;pp.textContent=play?'❚❚ Pause':'▶ Play'};
sc.oninput=()=>{t=sc.value/1000*T};
function loop(now){const dt=(now-last)/1000;last=now;if(play){t+=dt;if(t>=T+2)t=0}
 const tt=Math.min(t,T-.001);draw(tt);sc.value=Math.min(1000,tt/T*1000);tm.textContent=`${tt.toFixed(1)}s / ${T}s`;
 let i=starts.findLastIndex(s=>s<=tt);if(i!==cur){cur=i;cap.innerHTML=`<b>${SCENES[i].t}</b><br>${SCENES[i].c}`;btns.forEach((b,j)=>b.classList.toggle('on',j==i))}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
