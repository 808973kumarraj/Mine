<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spark Shuffle in 3D</title>
<style>
:root{--bg:#0f1420;--fg:#e8ecf4;--mut:#8a94a8;--acc:#f5a524;--panel:#171e2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);margin:0 0 10px;font-size:13px;text-align:center}
.stage{width:100%;max-width:1000px;background:var(--panel);border-radius:14px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:auto}
.cap{padding:12px 16px;min-height:132px;border-top:1px solid #263049}.cap b.t{color:var(--acc)}
.cap .hood{margin-top:8px;font-size:12px;color:var(--mut)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#222b42;padding:1px 5px;border-radius:4px;color:#ffd38a}
.ctl{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid #263049;flex-wrap:wrap}
button{background:#263049;color:var(--fg);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
button.on{background:var(--acc);color:#111}input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
.ch{display:flex;gap:6px;flex-wrap:wrap}
</style></head><body>
<h1>How a Spark Shuffle Works</h1><p class="sub">reduceByKey, end to end: partition → combine → spill → merge → MapStatus → fetch → recover → reduce</p>
<div class="stage"><canvas id="c" width="1000" height="560" aria-label="Isometric animation of a Spark shuffle"></canvas>
<div class="cap" id="cap"></div>
<div class="ctl"><button id="pp">❚❚ Pause</button><input id="sc" type="range" min="0" max="10000" value="0" aria-label="Timeline"><span id="tm" style="color:var(--mut);font-size:12px;width:84px;text-align:right"></span><button id="vc">🔈 Voice</button></div>
<div class="ctl ch" id="ch"></div></div>
<script>
"use strict";
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1000,H=560;
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;g.scale(DPR,DPR);
/* ---------- helpers ---------- */
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),L=(a,b,p)=>a+(b-a)*p;
const ez=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const seg=(u,a,b)=>ez((u-a)/(b-a)),lin=(u,a,b)=>cl((u-a)/(b-a)),bump=p=>Math.sin(Math.PI*cl(p));
const rgbOf=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const mix=(a,b,p)=>{const x=rgbOf(a),y=rgbOf(b);return'#'+x.map((v,i)=>Math.round(L(v,y[i],cl(p))).toString(16).padStart(2,'0')).join('')};
const sh=(h,f)=>mix(h,f<0?'#000000':'#ffffff',Math.abs(f));
const S=28,OX=480,OY=130;
const iso=(x,y,z=0)=>[OX+(x-y)*0.866*S,OY+(x+y)*0.5*S-z*S];
function poly(pts,fill,stroke){g.beginPath();pts.forEach((p,i)=>{const s=iso(...p);i?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1])});g.closePath();if(fill){g.fillStyle=fill;g.fill()}g.strokeStyle=stroke||'rgba(0,0,0,.28)';g.lineWidth=1;g.stroke()}
function boxNow(x,y,z,w,d,h,col,o={}){const a=o.a??1;if(a<=.003)return;g.save();g.globalAlpha*=a;
 poly([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],sh(col,-.05));
 poly([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],sh(col,-.3));
 poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],sh(col,.16));
 if(o.glow){g.lineWidth=2;g.strokeStyle=o.glow;g.stroke()}
 if(o.txt){const[s,t]=iso(x+w/2,y+d/2,z+h);g.fillStyle=o.tc||'#fff';g.font=`700 ${o.ts||10}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(o.txt,s,t)}
 g.restore()}
let Q=[];
const cube=(x,y,z,w,d,h,col,o)=>Q.push({k:(x+w/2)+(y+d/2)+z*.03,f:()=>boxNow(x,y,z,w,d,h,col,o)});
const later=(k,f)=>Q.push({k,f});
function flush(){Q.sort((a,b)=>a.k-b.k);Q.forEach(q=>q.f());Q=[]}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function txt(s,x,y,o={}){const a=o.a??1;if(a<=.01)return;g.save();g.globalAlpha*=a;const sz=o.size||12;g.font=o.font||`${o.w||600} ${sz}px system-ui`;g.textAlign=o.align||'center';g.textBaseline='middle';
 if(o.bg){const w=g.measureText(s).width+12,h=sz+8;const bx=o.align==='left'?x-6:o.align==='right'?x-w+6:x-w/2;g.fillStyle=o.bg;rr(bx,y-h/2,w,h,5);g.fill();if(o.border){g.strokeStyle=o.border;g.stroke()}}
 g.fillStyle=o.col||'#e8ecf4';g.fillText(s,x,y);g.restore()}
const ltxt=(s,x,y,z,o={})=>{const[a,b]=iso(x,y,z);txt(s,a+(o.dx||0),b+(o.dy||0),o)};
function line3(a,b,col,o={}){const al=o.a??1;if(al<=.01)return;g.save();g.globalAlpha*=al;g.strokeStyle=col;g.lineWidth=o.w||1.4;if(o.dash){g.setLineDash(o.dash);g.lineDashOffset=o.off||0}
 const p=iso(...a),q=iso(...b);g.beginPath();g.moveTo(...p);if(o.arc){const c=iso((a[0]+b[0])/2,(a[1]+b[1])/2,Math.max(a[2],b[2])+o.arc);g.quadraticCurveTo(c[0],c[1],q[0],q[1])}else g.lineTo(...q);g.stroke();g.restore()}
const arc=(a,b,p,h)=>[L(a[0],b[0],p),L(a[1],b[1],p),L(a[2],b[2],p)+bump(p)*h];
/* ---------- data ---------- */
const KC=['#4f8cff','#2fc28a','#ff6b6b'],NEU='#7d879c',ACC='#f5a524';
const PID={A:0,B:1,C:2,D:0,E:1,F:2},PKEYS=[['A','D'],['B','E'],['C','F']];
const MAPS=['ACABFDEDBA','BEBDCAFECD','FDAFCEBADC'].map(s=>[...s]);
const BLK=MAPS.map(ks=>[0,1,2].map(p=>{const c={};ks.forEach(k=>{if(PID[k]===p)c[k]=(c[k]||0)+1});return Object.keys(c).sort().map(k=>({k,n:c[k]}))}));
const blkN=(m,p)=>BLK[m][p].reduce((s,e)=>s+e.n,0);
const ord=(a,b)=>PID[a]-PID[b]||a.localeCompare(b);
// each map task processes its records in two memory-sized batches (rows)
const ROWS=MAPS.map(ks=>[0,1].map(r=>{const idx=[0,1,2,3,4].map(c=>r*5+c);const keys=[...new Set(idx.map(i=>ks[i]))].sort(ord);
 return keys.map((k,j)=>({k,j,r,recs:idx.filter(i=>ks[i]===k)}))}));
/* ---------- geometry ---------- */
const EX=m=>m*5,RX=k=>k*5;
const recXY=(m,i)=>[EX(m)-1.62+(i%5)*.72,i<5?-.85:.3];
const slotXY=(m,r,j)=>[EX(m)-1.62+j*.72,r?.3:-.85];
const SPY=[2.15,3.2],FINY=4.3,RETRYY=5.45,WALLY=6.95,STKY=8.9,TWRY=9.9;
const segX=(m,p)=>EX(m)-1.75+p*1.1;
const finXY=(m,p,j,y=FINY)=>[segX(m,p)+.04+j*.52,y];
const stackXY=(m,k)=>[RX(k)-1.45+m*1.0,STKY];
const DRV={x:14.4,y:2.9,w:3.4,d:3.2},drvTop=[16.1,4.5,1.45];
/* ---------- chapters ---------- */
const CH=[
 {t:'1 · One job, two stages',o:'textFile → map (narrow) → reduceByKey (wide ⇒ shuffle)',
  c:'Our job is <code>textFile → map(w ⇒ (w,1)) → reduceByKey(_ + _)</code>. <code>map</code> is a <b>narrow</b> dependency, so it is pipelined inside one task. <code>reduceByKey</code> creates a <b>ShuffleDependency</b>: every output partition may need records from every input partition. The DAGScheduler cuts the job there into a <b>ShuffleMapStage</b> (executors, top) and a <b>ResultStage</b> (reducers, bottom). The wall between them is the shuffle.',
  h:['DAGScheduler','ShuffleDependency','Exchange hashpartitioning (SQL plans)']},
 {t:'2 · Launching map tasks',o:'TaskScheduler → one ShuffleMapTask per input partition',
  c:'The driver\'s TaskScheduler sends one <b>ShuffleMapTask</b> per input partition to the executors. Each task reads its partition and emits <code>(word, 1)</code> records. Keys A–F are scattered across all three executors, so no executor can finish any count on its own.',
  h:['ShuffleMapTask','SortShuffleManager','BlockManager']},
 {t:'3 · Tag every record with a partition',o:'partition = nonNegativeMod(key.hashCode, 3)',
  c:'The <b>HashPartitioner</b> computes <code>nonNegativeMod(key.hashCode, numPartitions)</code> for every record. With 3 reduce partitions: <b style="color:#4f8cff">A, D → 0</b>, <b style="color:#2fc28a">B, E → 1</b>, <b style="color:#ff6b6b">C, F → 2</b>. Nothing moves yet; each record just knows where it will go. For DataFrames the partition count is <code>spark.sql.shuffle.partitions</code> (200 by default).',
  h:['HashPartitioner','RangePartitioner (sortByKey)','spark.default.parallelism']},
 {t:'4 · Combine in memory',o:'ExternalSorter.insertAll: (A,1) + (A,1) ⇒ (A,2)',
  c:'reduceByKey has an aggregator, so each task\'s <b>ExternalSorter</b> inserts records into an in-memory <code>PartitionedAppendOnlyMap</code> keyed by (partition, key). A repeated key is merged in place: on Executor 1, (A,1) + (A,1) becomes <b>A×2</b>. Entries are ordered by partition, then key. Spark estimates the map\'s size by sampling. Once it passes the threshold (starting at 5 MB) and no more execution memory is available, it must <b>spill</b>.',
  h:['PartitionedAppendOnlyMap','SizeTracker.estimateSize','spark.shuffle.spill.initialMemoryThreshold = 5 MB']},
 {t:'5 · Spill to disk',o:'spill(): sorted by (partitionId, key) → temp file',
  c:'To free memory, the sorted entries are written to a temporary <b>spill file</b> on local disk, in serialized, compressed batches. The task keeps reading: the second batch is combined (D×2 on Executor 1, B×2 and F×2 elsewhere), sorted, and spilled too. The Spark UI shows this as <b>Spill (Memory)</b> and <b>Spill (Disk)</b>.',
  h:['spark.shuffle.spill.compress = true (lz4)','spark.shuffle.spill.batchSize = 10000','spark.shuffle.file.buffer = 32k']},
 {t:'6 · Merge into one data file + index',o:'k-way merge → shuffle_0_<mapId>_0.data + .index',
  c:'When the task ends, a <b>k-way merge</b> reads all spills together and combines matching keys again (A×2 + A×1 → <b>A×3</b>). It writes <b>one data file</b>, partition after partition, plus a tiny <b>index file</b> of numPartitions + 1 byte offsets. The spills are deleted. This is <b>SortShuffleWriter</b>. Without map-side combine, Spark would pick <b>BypassMergeSortShuffleWriter</b> (≤ 200 partitions: one file per partition, then concatenate) or <b>UnsafeShuffleWriter</b> (sorts 8-byte pointers to serialized records).',
  h:['IndexShuffleBlockResolver','bypassMergeThreshold = 200','2 files per map task (old hash shuffle: M × R)']},
 {t:'7 · MapStatus and the barrier',o:'MapStatus(location, blockSizes[]) → MapOutputTracker',
  c:'Each finished map task sends a <b>MapStatus</b> to the driver: its BlockManager location and the size of each of its 3 blocks. The driver\'s <b>MapOutputTracker</b> fills a map × partition table (the tiles on the driver). Only when every map output is registered does the DAGScheduler open the barrier and launch the <b>reduce tasks</b>, usually on the same executors.',
  h:['CompressedMapStatus','HighlyCompressedMapStatus (> 2000 partitions)','MapOutputTrackerMaster']},
 {t:'8 · Where are my blocks?',o:'getMapSizesByExecutorId → index → bytes [offset[k], offset[k+1])',
  c:'Each reduce task asks the MapOutputTracker where every block of its partition lives and how big it is. A block on its own executor is read <b>locally</b>; the rest are <b>remote</b>. On the source side, the <b>index file</b> turns "partition k" into an exact byte range of the data file: bytes offset[k] to offset[k+1].',
  h:['getMapSizesByExecutorId','block id shuffle_0_<map>_<reduce>','FileSegmentManagedBuffer']},
 {t:'9 · Fetch over the network',o:'≤ 48 MB in flight · random request order · local reads skip network',
  c:'<b>ShuffleBlockFetcherIterator</b> sends fetch requests in random order and keeps at most <b>48 MB in flight</b> per reduce task. Remote blocks stream over Netty from the executor\'s BlockManager, or from the <b>External Shuffle Service</b> (port 7337). Local blocks skip the network. Blocks are decompressed and deserialized as they arrive. Executor 2\'s blocks are still queued behind the in-flight limit…',
  h:['spark.reducer.maxSizeInFlight = 48m','maxReqsInFlight / maxBlocksInFlightPerAddress','spark.shuffle.service.enabled']},
 {t:'10 · An executor dies',o:'FetchFailedException → resubmit map 1 only → refetch',
  c:'Executor 2 crashes, and its shuffle files go with it. Its fetches fail (after <code>spark.shuffle.io.maxRetries</code> = 3) with a <b>FetchFailedException</b>. The DAGScheduler unregisters map 1\'s output and <b>re-runs only that map task</b>, here on Executor 3, then the reducers fetch the missing blocks from the new file. With the External Shuffle Service, the files would have survived a lost executor process.',
  h:['spark.stage.maxConsecutiveAttempts = 4','spark.shuffle.io.retryWait = 5s','decommission shuffle-block migration (3.1+)']},
 {t:'11 · Reduce: merge the combiners',o:'combineCombinersByKey: A = 3 + 1 + 2 = 6',
  c:'Each reducer feeds its blocks into an <b>ExternalAppendOnlyMap</b>, merging the partial counts. For A: 3 from Executor 1, 1 from map 1 (recomputed), 2 from Executor 3 = <b>6</b>. This map can spill too if one reducer receives too much data. That is what a skewed key does. Results go to the next stage, or back to the driver for <code>collect()</code>.',
  h:['Aggregator.combineCombinersByKey','ExternalAppendOnlyMap','A=6 B=5 C=5 D=6 E=4 F=4']},
 {t:'12 · Where the cost is and how to cut it',o:'',
  c:'A shuffle costs <b>disk I/O</b> (spills, data files), <b>serialization</b>, and an <b>all-to-all network transfer</b>, and skew can leave one reducer straggling. To reduce it, shuffle less data: use <code>reduceByKey</code> over <code>groupByKey</code>, and broadcast joins under <code>autoBroadcastJoinThreshold</code> = 10 MB. Let <b>AQE</b> coalesce small partitions toward 64 MB and split skewed ones (> 5× median and > 256 MB). <b>Push-based shuffle</b> (Spark 3.2+) merges blocks per partition on the shuffle service for fewer, larger reads.',
  h:['spark.sql.adaptive.enabled (default since 3.2)','skewedPartitionFactor = 5 · threshold = 256MB','spark.shuffle.push.enabled']},
];
CH.forEach(c=>{const w=c.c.replace(/<[^>]+>/g,'').split(/\s+/).length;c.d=Math.max(12,Math.round(w/2.8+2))});
const ST=[];let T=0;CH.forEach(c=>{ST.push(T);T+=c.d});
let NOW=0;
const U=i=>cl((NOW-ST[i])/CH[i].d)*10;   // chapter i progress in 0..10 (0 before, 10 after)
/* ---------- timing tables ---------- */
const combWin=(m,r,c)=>r===0?[3,1+c*.35+m*.2,2.6+c*.35+m*.2]:[4,3.5+c*.3+m*.15,4.8+c*.3+m*.15];
const spillWin=(m,r,j)=>r===0?[4,.4+j*.18+m*.15,1.8+j*.18+m*.15]:[4,7+j*.18+m*.15,8.4+j*.18+m*.15];
const mergeWin=(m,k,r)=>{const s=1+PID[k]*2+r*.45+m*.12;return[5,s,s+1.4]};
const W_=(w)=>seg(U(w[0]),w[1],w[2]);
const FETCH=[[0,0],[2,1],[0,2],[2,0],[0,1],[2,2]];
const fetchWin=(m,k)=>{if(m===1)return[9,7.8+k*.55,9.4+k*.55];const i=FETCH.findIndex(f=>f[0]===m&&f[1]===k);return[8,1+i*1.1,(m===k?2.5:3.2)+i*1.1]};
const towerWin=m=>[10,1+m*1.2,2.3+m*1.2];
/* ---------- the scene ---------- */
function draw(){
 g.clearRect(0,0,W,H);const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#141b2b');bg.addColorStop(1,'#0f1420');g.fillStyle=bg;g.fillRect(0,0,W,H);
 const crash=seg(U(9),.5,1.5),retryOn=U(9)>=6.2;
 const redA=L(.35,1,seg(U(6),6,8.5));
 const cost=U(11);
 // ----- platforms
 for(let m=0;m<3;m++){const dd=m===1?crash:0;const base=mix('#2a3550','#3a3a3a',dd);
  boxNow(EX(m)-1.8,-1.5,0,3.6,3.2,.3,base);
  const dk=mix('#30343f','#262626',dd);const pulse=cost>.3&&cost<3.6?.25*bump((cost-.3)/3.3)*(.6+.4*Math.sin(NOW*6)):0;
  boxNow(EX(m)-1.8,2.0,0,3.9,(m===2&&retryOn)?4.45:3.3,.1,sh(dk,pulse),{glow:pulse>.05?'#ff8a8a':null});
 }
 for(let k=0;k<3;k++){const sk=cost>6.6?.25*bump((cost-6.6)/3.2):0;boxNow(RX(k)-1.8,8.2,0,3.6,3.0,.3,sh('#3a2f55',sk),{a:redA,glow:sk>.05&&k===0?'#ffcf70':null})}
 // driver
 boxNow(DRV.x,DRV.y,0,DRV.w,DRV.d,.3,'#4d3c18');boxNow(DRV.x+.2,DRV.y+.2,.3,3.0,2.8,.85,'#a07c2c');
 // MapOutputTracker tiles on the driver
 for(let m=0;m<3;m++){const arrived=seg(U(6),1.6+m*.6,2.1+m*.6);const lost=m===1?lin(U(9),4.4,4.8)*(1-lin(U(9),7.2,7.6)):0;
  for(let p=0;p<3;p++){const col=lost>.5?'#ff3b3b':mix('#6b5420',KC[p],arrived);boxNow(DRV.x+.45+p*.95,DRV.y+.4+m*.85,1.15,.8,.7,.1,col)}}
 // ----- stage boundary wall
 const wa=seg(U(0),4,6),pass=seg(U(6),4.5,5.5);
 const wc=pass>.5?'47,194,138':'245,165,36';
 poly([[-2.2,WALLY,0],[12.2,WALLY,0],[12.2,WALLY,.45],[-2.2,WALLY,.45]],`rgba(${wc},${.22*wa*(1-.4*pass)})`,`rgba(${wc},${.75*wa})`);
 // ----- network lines (fetch)
 const net=lin(U(8),.5,1.2)*(1-lin(U(10),0,1))+(cost>3.6&&cost<6.6?bump((cost-3.6)/3):0);
 if(net>0)for(let m=0;m<3;m++)for(let k=0;k<3;k++){if(m===k)continue;const sm=m===1&&retryOn?2:m;const sy=m===1&&retryOn?RETRYY:FINY;line3([segX(sm,k)+.5,sy+.75,.15],[RX(k),8.2,.3],KC[k],{dash:[4,6],off:-NOW*30,a:.32*net*(m===1&&crash>.5&&!retryOn?.2:1)})}
 // ----- spill slabs / data files / index / retry
 for(let m=0;m<3;m++){
  SPY.forEach((y,r)=>{const appear=lin(U(4),r?6.6:0,r?7.1:.5),gone=lin(U(5),8,9);const a=appear*(1-gone);if(a>0)later(EX(m)-2+y,()=>boxNow(EX(m)-1.7,y-.08,.1,3.5,.82,.06,'#575d6c',{a}))});
  const fa=lin(U(5),.4,1)*(m===1?1-crash*.5:1);if(fa>0)later(EX(m)-2+FINY,()=>boxNow(EX(m)-1.8,FINY-.1,.1,3.4,.95,.06,m===1&&crash>.5?'#3d3d3d':'#69718a',{a:fa}));
  const ia=lin(U(5),7.5,8.3);if(ia>0)later(EX(m)+FINY,()=>boxNow(EX(m)+1.68,FINY-.1,.1,.38,.95,.32,m===1&&crash>.5?'#4a4a4a':'#9a7b33',{a:ia}));
 }
 if(retryOn){const ra=lin(U(9),6.2,6.8);later(EX(2)-2+RETRYY,()=>boxNow(EX(2)-1.8,RETRYY-.1,.1,3.4,.95,.06,'#69718a',{a:ra}));later(EX(2)+RETRYY,()=>boxNow(EX(2)+1.68,RETRYY-.1,.1,.38,.95,.32,'#9a7b33',{a:ra}))}
 // ----- records → entries (combine, spill, merge)
 for(let m=0;m<3;m++)MAPS[m].forEach((k,i)=>{
  const ap=seg(U(1),3.6+m*.35+i*.08,4.2+m*.35+i*.08);if(ap<=0)return;
  const r=i<5?0:1,c=i%5,e=ROWS[m][r].find(e=>e.k===k),leader=e.recs[0]===i,p=PID[k];
  const tag=seg(U(2),1+m*.6+i*.12,1.6+m*.6+i*.12);const col=mix(NEU,KC[p],tag);
  const cw=combWin(m,r,c),pc=W_(cw);
  let[x,y]=recXY(m,i);let z=.3+(1-ap)*1.6,h=.55,w=.55;
  const[tx,ty]=slotXY(m,r,e.j);
  if(!leader&&pc>=1)return;
  x=L(x,tx,pc);y=L(y,ty,pc);z+=bump(pc)*.7+(leader?0:pc*.55);
  const n=e.recs.filter(ri=>W_(combWin(m,r,ri%5))>=1).length;
  let label=k+(n>1?'×'+n:'');
  if(leader){const sp=W_(spillWin(m,r,e.j));const sx=EX(m)-1.62+e.j*.69,sy=SPY[r];
   x=L(x,sx,sp);y=L(y,sy,sp);z=L(z,.16,sp)+bump(sp)*1.4;h=L(h,.26,sp);
   const mp=W_(mergeWin(m,k,r));if(mp>=1)return;
   if(mp>0){const fj=BLK[m][p].findIndex(b=>b.k===k);const[fx,fy]=finXY(m,p,fj);x=L(x,fx,mp);y=L(y,fy,mp);z=L(z,.16,mp)+bump(mp)*1.3;w=L(w,.48,mp)}
  }else label=k;
  const glow=(m===0&&leader&&n>1&&U(3)>3&&U(3)<6)?'#ffcf70':null;
