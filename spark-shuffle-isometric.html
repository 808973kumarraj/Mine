</style></head><body>
<canvas id="c" width="1080" height="1920" aria-label="Animated explainer: how a Spark shuffle works"></canvas>

<script>
"use strict";
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1080,H=1920;
/* ---------- palette & fonts ---------- */
const C={bg:'#ebe7da',grid:'#dfdaca',ink:'#23221f',mut:'#8c887c',faint:'#cbc6b6',pT:'#f9f6ee',pF:'#f0ebdf',pR:'#dfd9c9',navy:'#26429a',green:'#2e7d5b',ochre:'#c0812f',brick:'#b4472f',orange:'#c8873a',card:'#faf8f2',term:'#1f1e1b'};

const F={mono:'"Space Mono", ui-monospace, Menlo, monospace',sans:'"IBM Plex Sans", system-ui, sans-serif',pix:'"Silkscreen", "Space Mono", monospace'};
/* ---------- math ---------- */
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),L=(a,b,p)=>a+(b-a)*p;
const ez=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};

const rgbOf=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const mix=(a,b,p)=>{const x=rgbOf(a),y=rgbOf(b);return'#'+x.map((v,i)=>Math.round(L(v,y[i],cl(p))).toString(16).padStart(2,'0')).join('')};

/* ---------- drawing primitives (paper style) ---------- */
function path(pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()}

 g.lineWidth=o.lw||2;g.lineJoin='round';g.strokeStyle=o.ink||C.ink;if(o.dash)g.setLineDash(o.dash);
 face([[x,y-h],[x+w,y-h],[x+w+dx,y-h+dy],[x+dx,y-h+dy]],top);
 face([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y-h+dy],[x+w,y-h]],right);
 face([[x,y],[x+w,y],[x+w,y-h],[x,y-h]],front);g.setLineDash([]);
 const tc=o.tc||(o.col?'#ffffff':C.ink);
 if(o.label){g.fillStyle=tc;g.font=`700 ${o.ls||15}px ${F.mono}`;g.textAlign='left';g.textBaseline='alphabetic';g.fillText(o.label,x+12,y-h+26)}

 if(o.x){g.strokeStyle=C.brick;g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(x+w*.32,y-h*.82);g.lineTo(x+w*.68,y-h*.18);g.moveTo(x+w*.68,y-h*.82);g.lineTo(x+w*.32,y-h*.18);g.stroke()}
 if(o.ring){g.strokeStyle=o.ring;g.lineWidth=3;g.strokeRect(x-5,y-h-5,w+10,h+10)}
 g.restore()}

function txt(s,x,y,o={}){const a=o.a??1;if(a<=.01)return;g.save();g.globalAlpha*=a;g.font=o.font||`${o.w||400} ${o.size||20}px ${o.f||F.mono}`;g.textAlign=o.align||'left';g.textBaseline=o.base||'alphabetic';if(o.ls&&'letterSpacing'in g)g.letterSpacing=o.ls+'px';g.fillStyle=o.col||C.ink;g.fillText(s,x,y);g.restore()}

 rr(cx-w/2,cy-h/2,w,h,h/2);g.fillStyle=o.fill?col:'#f6f3ea';g.fill();g.lineWidth=2;g.strokeStyle=col;g.stroke();
 if(dot){g.fillStyle=o.fill?'#fff':col;g.beginPath();g.arc(cx-w/2+20,cy,5.5,0,7);g.fill()}
 g.fillStyle=o.fill?'#fff':col;g.textAlign='left';g.textBaseline='middle';g.fillText(s,cx-w/2+(dot?34:15),cy+1);g.restore()}
function term(x,y,w,h,s,n,o={}){const a=o.a??1;if(a<=.01)return;g.save();g.globalAlpha*=a;rr(x,y,w,h,6);g.fillStyle=C.term;g.fill();
 g.font=`400 ${o.size||26}px ${F.mono}`;g.textBaseline='middle';g.textAlign='left';const p=o.prompt??'>>> ';g.fillStyle='#8d887b';g.fillText(p,x+22,y+h/2);const pw=g.measureText(p).width;
 const vis=s.slice(0,Math.floor(n));g.fillStyle='#efe9dc';g.fillText(vis,x+22+pw,y+h/2);
 if(o.cursor!==false&&Math.floor(NOW*2.2)%2===0){const cw=g.measureText(vis).width;g.fillStyle=C.orange;g.fillRect(x+24+pw+cw,y+h/2-14,13,28)}g.restore()}
function bin(x,y,s,o={}){const a=o.a??1;if(a<=.01)return;g.save();g.globalAlpha*=a;g.font=`400 ${o.size||18}px ${F.mono}`;const w=g.measureText(s).width+28;rr(x-w/2,y-19,w,38,4);g.fillStyle=C.term;g.fill();g.fillStyle='#e8e3d6';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y+1);g.restore()}
function disk(cx,cy,s=1,a=1){if(a<=.01)return;g.save();g.globalAlpha*=a;g.lineWidth=1.6;
 g.save();g.shadowColor='rgba(70,58,30,.2)';g.shadowBlur=18;g.shadowOffsetY=10;g.beginPath();g.ellipse(cx,cy,80*s,27*s,0,0,7);g.fillStyle='#d8d4c8';g.fill();g.restore();
 for(let i=0;i<6;i++){const y=cy-i*9*s;g.beginPath();g.ellipse(cx,y,80*s,27*s,0,0,7);g.fillStyle=i===5?'#f1eee6':'#dcd8cc';g.fill();g.strokeStyle='#8f8a7e';g.stroke()}
 const ty=cy-45*s;g.beginPath();g.ellipse(cx,ty,14*s,5.5*s,0,0,7);g.fillStyle='#2a2926';g.fill();
 txt('DISK',cx,cy+50*s,{size:14,col:C.mut,align:'center',ls:2});g.restore()}
function sheet(x,y,w,h,title,o={}){const a=o.a??1;if(a<=.01)return;g.save();g.globalAlpha*=a;const e=22;
 g.save();g.shadowColor='rgba(70,58,30,.18)';g.shadowBlur=14;g.shadowOffsetY=7;path([[x,y],[x+w-e,y],[x+w,y+e],[x+w,y+h],[x,y+h]]);g.fillStyle='#fcfaf5';g.fill();g.restore();
 path([[x,y],[x+w-e,y],[x+w,y+e],[x+w,y+h],[x,y+h]]);g.lineWidth=1.8;g.strokeStyle=o.border||C.ink;g.stroke();
 g.beginPath();g.moveTo(x+w-e,y);g.lineTo(x+w-e,y+e);g.lineTo(x+w,y+e);g.stroke();
 if(title)txt(title,x+14,y+28,{size:o.ts||15,w:700,col:o.tcol||C.ink});
 if(o.strike){g.strokeStyle=C.brick;g.lineWidth=3;g.beginPath();g.moveTo(x+8,y+h/2);g.lineTo(x+8+(w-16)*o.strike,y+h/2);g.stroke()}
 g.restore()}

 g.beginPath();for(let i=0;i<=40;i++){const p=pr*i/40,q=qpt(a,b,hgt,p);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])}g.stroke();g.restore()}

/* ---------- data ---------- */
const PID={A:0,B:1,C:2,D:0,E:1,F:2},PKEYS=[['A','D'],['B','E'],['C','F']];

const ord=(a,b)=>PID[a]-PID[b]||a.localeCompare(b);
function batch(keys){const ents=[];keys.forEach((k,c)=>{let e=ents.find(e=>e.k===k);if(!e){e={k,slot:ents.length,recs:[]};ents.push(e)}e.recs.push(c)});[...ents].sort((a,b)=>ord(a.k,b.k)).forEach((e,j)=>e.sorted=j);return ents}

/* ---------- shared layout bits ---------- */
const EXX=[70,395,720],EW=250,EH=120,ED=100;
const tileXY=(m,i,y)=>TA(EXX[m],y,EH,14+(i%5)*46,i<5?60:16);

 for(let m=0;m<3;m++){const a=o.appear?o.appear(m):1;if(a<=0)continue;const yy=y+(1-a)*40;
  pbox(EXX[m],yy,EW,EH,ED,{a,label:`EXECUTOR ${m+1}`,lines:4,dot:C.green,bar:o.bar?o.bar(m):null});
  for(const row of[0,1])for(let c=0;c<5;c++){const i=row*5+c,ta=o.tile?o.tile(m,i):1;if(ta<=0)continue;const[tx,ty]=tileXY(m,i,yy);const k=MAPS[m][i];
   const st=o.style?o.style(m,i,k):{};tile(tx,ty-(1-ta)*50,k,{a:ta*a,...st})}}}
function costCard(s,u){if(!s.cost)return;const on=s.cost.map(v=>v===true||(typeof v==='number'&&u>=v));
 const a=s.costIn?lin(u,s.costIn,s.costIn+.6):1;const x=730,y=200;card(x,y,290,200,'SHUFFLE COST',{a});
 g.save();g.globalAlpha*=a;const n=on.filter(Boolean).length;g.fillStyle='#ebe6d8';g.fillRect(x+18,y+46,254,12);g.fillStyle=C.brick;g.fillRect(x+18,y+46,254*n/4,12);g.strokeStyle=C.ink;g.lineWidth=1.2;g.strokeRect(x+18,y+46,254,12);
 ['serialize','disk I/O','network I/O','deserialize'].forEach((s,i)=>{check(x+18,y+74+i*30,on[i],C.brick);txt(s,x+48,y+89+i*30,{size:18,col:on[i]?C.ink:'#bdb8a8'})});g.restore()}

const SC=[];const S=o=>SC.push(o);
S({k:'SPARK INTERNALS · SHUFFLE',title:[['one line, ',C.ink],['two stages',C.navy]],center:true,
 n:'One line of Spark: map every word to a pair of word and one, then reduceByKey. map is a narrow dependency, so it stays inside the task. reduceByKey is wide: every output partition needs data from every input partition. So the DAGScheduler splits the job into two stages, and the gap between them is the shuffle.',
 hood:['ShuffleDependency','DAGScheduler','narrow vs wide'],
 draw(u){const code='words.map(w => (w, 1)).reduceByKey(_ + _)';
  term(90,440,900,76,code,lin(u,.3,3)*code.length,{size:25,cursor:u<3.4});
  const a0=seg(u,3.2,4.2),a1=seg(u,3.6,4.6);

  pbox(640,960+(1-a1)*40,290,170,110,{a:a1,label:'STAGE 1 · REDUCE',lines:6,dot:C.mut,bar:0});
  pill(255,1030,'map() · narrow',C.green,{a:a0,size:15});pill(785,1030,'reduceByKey() · wide',C.brick,{a:a1,size:15});
  const w=seg(u,5,6.6);for(let i=0;i<3;i++)for(let j=0;j<3;j++){const A=[400,820+i*40],B=[640,820+j*40];g.save();g.globalAlpha=w*.8;g.strokeStyle=PC[j];g.lineWidth=2;g.beginPath();g.moveTo(...A);g.lineTo(L(A[0],B[0],w),L(A[1],B[1],w));g.stroke();g.restore()}

 n:'With DataFrames, the same shuffle appears in explain. Spark plans a partial count on every partition, then an Exchange that hash-partitions by word into two hundred partitions, then a final merge of the partial counts. The Exchange is the shuffle and the stage boundary. With AQE on, the plan can still change at runtime.',

const chapterAt=tt=>{let i=0;for(let j=0;j<ST.length;j++)if(ST[j]<=tt)i=j;return i};
const $=id=>document.getElementById(id);const pp=$('pp'),sc=$('sc'),tm=$('tm'),vc=$('vc'),recB=$('rec'),ch=$('ch');
const btns=SC.map((s,i)=>{const b=document.createElement('button');b.textContent=i===0?'intro':s.end?'end':String(i);b.title=s.title.map(x=>x[0]).join('')||'end';b.onclick=()=>go(i);ch.appendChild(b);return b});
let t=0,play=true,last=performance.now(),cur=-1,voice=false,rec=null;
function go(i){t=ST[cl(i,0,SC.length-1)]+.01;cur=-1;if(voice)speechSynthesis.cancel()}
pp.onclick=()=>{play=!play;if(play&&t>=T)t=0;pp.textContent=play?'❚❚ pause':'▶ play';if(voice){play?speechSynthesis.resume():speechSynthesis.pause()}};
sc.oninput=()=>{t=sc.value/10000*T;if(voice)speechSynthesis.cancel()};
vc.onclick=()=>{if(!('speechSynthesis'in window)){vc.textContent='no voice';return}voice=!voice;vc.classList.toggle('on',voice);vc.textContent=voice?'🔊 voice':'🔈 voice';if(voice)cur=-1;else speechSynthesis.cancel()};
recB.onclick=()=>{if(rec){rec.stop();return}if(!cv.captureStream||!window.MediaRecorder){recB.textContent='not supported';return}
 const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));const chunks=[];
 rec=new MediaRecorder(cv.captureStream(30),{mimeType:mt,videoBitsPerSecond:8e6});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));const a=document.createElement('a');a.href=url;a.download='spark-shuffle.webm';a.click();rec=null;recB.textContent='⏺ record .webm';recB.classList.remove('on')};
 if(voice)vc.click();t=0;play=true;pp.textContent='❚❚ pause';rec.start(1000);recB.textContent='■ stop';recB.classList.add('on')};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.click()}else if(e.key==='ArrowRight')go(chapterAt(t)+1);else if(e.key==='ArrowLeft')go(chapterAt(t)-(t-ST[chapterAt(t)]<1.5?1:0))});
function speak(i){if(!voice)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SC[i].n);u.rate=1.02;speechSynthesis.speak(u)}
const fmt=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(play){const i0=chapterAt(Math.min(t,T-.001));const hold=voice&&speechSynthesis.speaking&&t+dt>=ST[i0]+SC[i0].dur-.05&&i0<SC.length-1;if(!hold)t+=dt;
  if(t>=T){if(rec){t=T;rec.stop()}else{t=T;play=false;pp.textContent='▶ replay'}}}
 NOW=Math.min(t,T-.001);frame();sc.value=Math.round(NOW/T*10000);tm.textContent=`${fmt(NOW)} / ${fmt(T)}`;
 const i=chapterAt(NOW);if(i!==cur){cur=i;btns.forEach((b,j)=>b.classList.toggle('on',j===i));if(play)speak(i)}
 requestAnimationFrame(loop)}
const fontsReady=document.fonts?Promise.race([Promise.all([`700 50px "Space Mono"`,`400 20px "Space Mono"`,`500 40px "IBM Plex Sans"`,`25px "Silkscreen"`].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontsReady.then(()=>{wrapCache.clear();last=performance.now();requestAnimationFrame(loop)});
if(document.fonts)document.fonts.addEventListener('loadingdone',()=>wrapCache.clear());
</script></body></html>
