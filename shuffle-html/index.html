<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Shuffle Explainer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* The top-half graphics are an EffectCraft composition (effectcraft/shuffle.jsx),
   exported to Lottie (graphics.json) and played in sync with the footage. */
:root{--bg:#111;--fg:#fff;--ui:#222;--line:#444;--muted:#aaa}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.stage{position:relative;width:min(420px,100%,calc((100vh - 90px)*9/16));aspect-ratio:9/16;overflow:hidden;border-radius:14px;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gfx{position:absolute;left:0;top:0;width:100%;height:50%;transition:opacity .3s}
#gfx.hide{opacity:0}
/* paper strip that covers the original graphics between the top half and the speaker card */
#strip{position:absolute;left:0;right:0;top:49.9%;height:8.5%;background:#ece8dc;transition:opacity .3s}
#gfx.hide+#strip{opacity:0}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;color:var(--muted)}
button{background:var(--ui);color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer}
input[type=range]{width:min(420px,90vw)}
</style>
</head>
<body>
<div class="stage">
  <video id="v" src="shuffle.mp4" playsinline preload="auto"></video>
  <div id="gfx"></div><div id="strip"></div>
</div>
<input type="range" id="seek" min="0" max="80.4" step="0.05" value="0">
<div class="ctrl">
  <button id="play">▶ Play</button>
  <button id="orig">Show original graphics</button>
  <span id="clock">0.0s</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
// Seconds where the speaker is full-frame: the graphics step aside.
const FACE = [[7, 8], [29, 32], [54, 56], [75, 78]];
const v = document.getElementById('v'), gfx = document.getElementById('gfx'), seek = document.getElementById('seek');
let showOrig = false;
// EffectCraft names fonts by PostScript name; map them to the web font's family + weight.
const FONT_STYLE = { 'JetBrainsMono-Regular': 'Regular', 'JetBrainsMono-Bold': 'Bold', 'JetBrainsMono-ExtraBold': 'Black' };
let anim = { isLoaded: false };
Promise.all([fetch('graphics.json').then(r => r.json()), document.fonts.load('700 20px "JetBrains Mono"'),
             document.fonts.load('800 20px "JetBrains Mono"'), document.fonts.load('400 20px "JetBrains Mono"')])
  .then(([data]) => {
    (data.fonts && data.fonts.list || []).forEach(f => { f.fStyle = FONT_STYLE[f.fFamily] || 'Regular'; f.fFamily = 'JetBrains Mono'; });
    anim = lottie.loadAnimation({ container: gfx, renderer: 'svg', loop: false, autoplay: false, animationData: data });
  });
function frame() {
  const t = v.currentTime;
  if (anim.isLoaded) anim.goToAndStop(t * 1000, false);   // the footage is the clock
  gfx.classList.toggle('hide', showOrig || FACE.some(([a, b]) => t >= a && t < b));
  seek.value = t; document.getElementById('clock').textContent = t.toFixed(1) + 's';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
seek.oninput = () => { v.currentTime = +seek.value; };
const playBtn = document.getElementById('play');
playBtn.onclick = () => v.paused ? v.play() : v.pause();
v.onplay = () => playBtn.textContent = '❚❚ Pause';
v.onpause = () => playBtn.textContent = '▶ Play';
document.getElementById('orig').onclick = e => { showOrig = !showOrig; e.target.textContent = showOrig ? 'Show EffectCraft graphics' : 'Show original graphics'; };
</script>
</body>
</html>
