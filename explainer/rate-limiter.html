<script>
// =====================================================================
// CONFIG: topic strings, colours, timing, captions, camera, slow motion.
// Times marked "story" are in story seconds (before slow motion).
// =====================================================================
const config = {

  },

      focus: { event: 'accept', near: 39.6, tag: 'key' } },

  ],
  shots: [ // at = story seconds, or {event, near, lead(video s)}; dur in video seconds
    { at: 0,    x: 540, y: 960,  z: 1,    why: 'the whole system: two sources, one server' },
    { event: 'spawn:user', near: 5.9, lead: 0.35, dur: 0.7, x: 440, y: 800, z: 1.8, why: 'one ball is one request' },
    { event: 'spawn:bot', near: 10.3, lead: 0.35, dur: 0.7, x: 650, y: 800, z: 1.8, why: 'requests differ by key' },
    { at: 14.0, dur: 0.8, x: 540, y: 960, z: 1,  why: 'everything lands on the server' },
    { at: 18.3, dur: 0.7, x: 720, y: 860, z: 1.45, why: 'server output drives the bots counter' },
    { at: 21.7, dur: 0.7, x: 540, y: 960, z: 1,  why: 'see the map before the fix' },
    { event: 'drop', near: 24, lead: 0.3, dur: 0.7, x: 540, y: 1000, z: 1.7, why: 'the new gate lands on the track' },
    { at: 27.1, dur: 0.7, x: 540, y: 960, z: 1,  why: 'back to the map: the gate now guards the track' },
    { event: 'reject', near: 31.2, lead: 0.35, dur: 0.7, x: 680, y: 1090, z: 1.75, why: 'a key over its limit is bounced' },
    { at: 33.8, dur: 0.7, x: 540, y: 960, z: 1,  why: 'bots keep trying, bin fills' },
    { event: 'accept', near: 39.6, lead: 0.35, dur: 0.7, x: 540, y: 1010, z: 1.8, why: 'a key with tokens passes' },
    { at: 41.8, dur: 0.8, x: 540, y: 960, z: 1,  why: 'nothing more gets in: the counter holds' }
  ],
  slowmo: [ // before/after/ramp in story seconds
    { event: 'land',   near: 24.6, before: 0.1, after: 0.9, speed: 0.4, ramp: 0.15 },
    { event: 'reject', near: 31.2, before: 0.1, after: 0.9, speed: 0.4, ramp: 0.15 },
    { event: 'accept', near: 39.6, before: 0.1, after: 0.9, speed: 0.4, ramp: 0.15 }
  ]
};

// =====================================================================
// Utilities
// =====================================================================
const C = config.colors, G = config.geo, SIM = config.sim, W = config.world;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const easeIO = k => { k = clamp(k, 0, 1); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',') + ')'; };
const rgba = (h, a) => { const A = hex(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; };
const col = name => C[name] || name;
function bsearchLE(arr, v) { let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= v) { r = m; lo = m + 1; } else hi = m - 1; } return r; }

// =====================================================================
// SCRIPTED RUN: every item's path and event times, precomputed
// =====================================================================
function buildRun() {
  const rng = mulberry32(config.seed);
  const items = [];
  for (const kind of ['user', 'bot']) {
    const src = config.sources[kind];
    let t = src.start;
    while (t < SIM.spawnUntil) { items.push({ kind, sx: src.x, t0: t }); t += src.every * (1 + SIM.jitter * (rng() * 2 - 1)); }
  }
  const fallT = Math.sqrt(2 * (G.chuteY - G.mouthY) / SIM.g), bounceT = 0.14;
  const chuteLen = it => Math.hypot(G.mergeX - it.sx, G.mergeY - G.chuteY);
  const mergeT = it => it.t0 + fallT + bounceT + chuteLen(it) / SIM.v;
  items.sort((a, b) => mergeT(a) - mergeT(b));
  let lastM = -9;
  for (const it of items) { // keep a minimum gap on the shared track
    let m = mergeT(it); if (m < lastM + SIM.minGap) { it.t0 += lastM + SIM.minGap - m; m = mergeT(it); } lastM = m;
    it.tf = it.t0 + fallT; it.tb = it.tf + bounceT; it.tm = m;
    it.tg = m + (G.gateY - G.mergeY) / SIM.v;
    it.d1 = G.chuteY - G.mouthY; it.d2 = it.d1 + chuteLen(it); it.d3 = it.d2 + (G.gateY - G.mergeY);
  }
  const land = SIM.landAt;
  const admitted = [], rejected = [];
  let prevSe = -9;
  for (const it of items) {
    it.rejected = it.kind === 'bot' && it.tg >= land;
    if (it.rejected) {
      it.rIdx = rejected.length; rejected.push(it);
      const [kx, ky] = G.rejectKick, [cx, cy] = G.chuteEnd;
      it.tk = it.tg + 0.1; it.tc = it.tk + Math.hypot(cx - kx, cy - ky) / SIM.v;
      const k = it.rIdx, cols = 8;
      it.px = G.binX + 20 + (k % cols) * 22.5 + ((Math.floor(k / cols) % 2) ? 8 : 0);
      it.py = G.ground - 13 - Math.floor(k / cols) * 21;
      it.tp = it.tc + Math.sqrt(2 * Math.max(4, it.py - cy) / SIM.g);
      it.tEnd = Infinity;
    } else {
      it.qIdx = admitted.length; admitted.push(it);
      const tHead = it.tg + (G.headY - G.gateY) / SIM.v;
      it.ss = Math.max(tHead, prevSe); it.se = it.ss + SIM.serviceTime; prevSe = it.se;
      it.tdb = it.se + (G.dbTop - G.server.y) / (SIM.v * 1.15);
      it.tEnd = it.tdb + 0.18;
    }
  }
  // queue depth check (slots between gate and head)
  let maxQ = 0;
  for (const it of admitted) { let q = 0; for (const j of admitted) if (j.tg <= it.tg && j.ss > it.tg && j !== it) q++; maxQ = Math.max(maxQ, q); }
  // event lists (story time)
  const ev = [];
  for (const it of items) {
    ev.push({ type: 'spawn:' + it.kind, s: it.t0, it, x: it.sx });
    ev.push({ type: 'merge', s: it.tm, it, x: G.mergeX });
    if (it.tg >= land) ev.push({ type: it.rejected ? 'reject' : 'accept', s: it.tg, it, x: G.mergeX });
    if (it.rejected) ev.push({ type: 'bin', s: it.tc, it, x: G.chuteEnd[0] });
    else { ev.push({ type: 'serve', s: it.ss, it, x: G.server.x }); ev.push({ type: 'served:' + it.kind, s: it.se, it, x: G.server.x });
      ev.push({ type: 'db', s: it.tdb, it, x: G.mergeX }); }
  }
  ev.push({ type: 'drop', s: land - SIM.dropDur, x: G.mergeX }, { type: 'land', s: land, x: G.mergeX });
  ev.sort((a, b) => a.s - b.s);
  const times = type => ev.filter(e => e.type === type).map(e => e.s);
  const run = { items, admitted, rejected, ev, maxQ, land,
    usersServed: times('served:user'), botsIn: times('served:bot'), binIn: times('bin'),
    dbIn: ev.filter(e => e.type === 'db'), accepts: times('accept'), rejects: times('reject'), served: times('serve'),
    gatePass: ev.filter(e => e.type === 'accept' || e.type === 'reject') };
  run.find = (type, near) => { let best = null; for (const e of ev) if (e.type === type && (!best || Math.abs(e.s - near) < Math.abs(best.s - near))) best = e; return best; };
  return run;
}
const RUN = buildRun();

// =====================================================================
// TIME REMAP: s = warp(t), 1 ms table built once
// =====================================================================
const SLOW = config.slowmo.map(w => { const e = RUN.find(w.event, w.near); return { ...w, a: e.s - w.before, b: e.s + w.after }; });
function speedAtStory(s) {
  let sp = 1;
  for (const w of SLOW) {
    let k = 0;
    if (s >= w.a && s <= w.b) k = 1;
    else if (s > w.a - w.ramp && s < w.a) k = smooth((s - (w.a - w.ramp)) / w.ramp);
    else if (s > w.b && s < w.b + w.ramp) k = 1 - smooth((s - w.b) / w.ramp);
    sp = Math.min(sp, lerp(1, w.speed, k));
  }
  return sp;
}
const DT = 0.001, NT = Math.round(config.duration / DT) + 1;
const WARP = new Float64Array(NT);
{ let s = 0; for (let i = 0; i < NT; i++) { WARP[i] = s; s += speedAtStory(s) * DT; } }
function warp(t) { const f = clamp(t, 0, config.duration) / DT, i = Math.min(NT - 2, Math.floor(f)); return lerp(WARP[i], WARP[i + 1], f - i); }
function vt(s) { // inverse: video time of story time s
  if (s <= 0) return s; let lo = 0, hi = NT - 1;
  if (s >= WARP[hi]) return config.duration + (s - WARP[hi]);
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (WARP[m] <= s) lo = m; else hi = m; }
  return (lo + (s - WARP[lo]) / (WARP[hi] - WARP[lo])) * DT;
}
const speedAt = t => speedAtStory(warp(t));
const STORY_END = warp(config.duration);
const countAt = (arr, s) => bsearchLE(arr, s) + 1;

// captions: resolve templates and video times
const CAPS = config.captions.map(c => {
  const sAt = c.at;
  const text = c.text.replace('{bots}', countAt(RUN.botsIn, sAt)).replace('{users}', countAt(RUN.usersServed, sAt))
    .replace('{botsFinal}', RUN.botsIn.length);
  const focus = c.focus ? RUN.find(c.focus.event, c.focus.near) : null;
  return { ...c, text, t0: vt(c.at), t1: Math.min(vt(c.end), config.duration - 0.05), focusItem: focus && focus.it, tag: c.focus && c.focus.tag };
});
// camera shots: resolve event anchors
const SHOTS = config.shots.map(sh => {
  let t0;
  const dur = sh.dur || 0;
  if (sh.event) { const e = RUN.find(sh.event, sh.near); sh.eventS = e.s; t0 = vt(e.s) - sh.lead - dur; }
  else t0 = vt(sh.at);
  return { ...sh, t0, t1: t0 + dur };
}).sort((a, b) => a.t0 - b.t0);
const clampCam = c => { const hw = W.w / 2 / c.z, hh = W.h / 2 / c.z;
  return { x: clamp(c.x, hw, W.w - hw), y: clamp(c.y, hh, W.h - hh), z: c.z }; };
function camAt(t) {
  let cur = clampCam(SHOTS[0]);
  for (let i = 1; i < SHOTS.length; i++) {
    const sh = SHOTS[i]; if (t < sh.t0) break;
    const to = clampCam(sh), k = sh.t1 > sh.t0 ? easeIO((t - sh.t0) / (sh.t1 - sh.t0)) : 1;
    cur = { x: lerp(cur.x, to.x, k), y: lerp(cur.y, to.y, k), z: Math.exp(lerp(Math.log(cur.z), Math.log(to.z), k)) };
  }
  return cur;
}

// =====================================================================
// ITEM STATE at story time s (pure)
// =====================================================================
function queueTargetY(it, s) {
  let off = 0;
  for (let j = it.qIdx - 1; j >= 0 && j >= it.qIdx - 12; j--) {
    const o = RUN.admitted[j];
    if (o.ss + 0.22 < s) break;
    off += 1 - easeIO((s - o.ss) / 0.22);
  }
  return G.headY - G.slot * off;
}
function itemState(it, s) {
  if (s < it.t0 || s > it.tEnd) return null;
  const r = G.itemR;
  let x, y, d, a = 1, sc = 1;
  if (s < it.tf) { const tau = s - it.t0; x = it.sx; y = G.mouthY + 0.5 * SIM.g * tau * tau; d = y - G.mouthY; sc = easeOut(tau / 0.1); }
  else if (s < it.tb) { const k = (s - it.tf) / (it.tb - it.tf); x = it.sx; y = G.chuteY - 10 * 4 * k * (1 - k); d = it.d1; }
  else if (s < it.tm) { const k = (s - it.tb) / (it.tm - it.tb); x = lerp(it.sx, G.mergeX, k); y = lerp(G.chuteY, G.mergeY, k); d = lerp(it.d1, it.d2, k); }
  else if (s < it.tg) { const k = (s - it.tm) / (it.tg - it.tm); x = G.mergeX; y = lerp(G.mergeY, G.gateY, k); d = lerp(it.d2, it.d3, k); }
  else if (it.rejected) {
    const [kx, ky] = G.rejectKick, [cx, cy] = G.chuteEnd;
    if (s < it.tk) { const k = easeOut((s - it.tg) / (it.tk - it.tg)); x = lerp(G.mergeX, kx, k); y = lerp(G.gateY, ky, k); d = it.d3 + k * 46; }
    else if (s < it.tc) { const k = (s - it.tk) / (it.tc - it.tk); x = lerp(kx, cx, k); y = lerp(ky, cy, k); d = it.d3 + 46 + k * 389; }
    else { const tau = Math.min(s, it.tp) - it.tc, k = clamp((s - it.tc) / (it.tp - it.tc), 0, 1);
      x = lerp(cx, it.px, easeOut(k)); y = Math.min(it.py, cy + 0.5 * SIM.g * tau * tau);
      if (s > it.tp) y = it.py - 6 * Math.max(0, Math.sin(clamp((s - it.tp) / 0.12, 0, 1) * Math.PI));
      d = it.d3 + 435 + (y - cy) + Math.abs(x - cx); }
  } else if (s < it.ss) {
    const yf = G.gateY + SIM.v * (s - it.tg); y = Math.min(yf, queueTargetY(it, s)); x = G.mergeX; d = it.d3 + (y - G.gateY);
  } else if (s < it.se) {
    const k = easeIO((s - it.ss) / 0.14); x = G.mergeX; y = lerp(G.headY, G.server.y, k);
    d = it.d3 + (G.headY - G.gateY) + k * 80 + Math.max(0, s - it.ss - 0.14) * 300;
  } else {
    const k = (s - it.se) / (it.tdb - it.se); x = G.mergeX; y = Math.min(G.dbTop + 20, lerp(G.server.y, G.dbTop, k) + (k > 1 ? (s - it.tdb) * 120 : 0));
    d = it.d3 + 400 + y; a = s > it.tdb ? 1 - (s - it.tdb) / 0.18 : 1;
  }
  return { x, y, rot: d / r, a: clamp(a, 0, 1), sc };
}

// =====================================================================
// RENDERING
// =====================================================================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let CW = 360, CH = 640, DPR = 1;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUST = (() => { const r = mulberry32(99); return Array.from({ length: 70 }, () => ({ x: r() * W.w, y: r() * W.h, vx: (r() - .5) * 6, vy: -2 - r() * 6, s: 1 + r() * 2.2, a: .05 + r() * .12 })); })();
const LW = 3; // world line width (about 2 px at 720 wide)

      const keep = ctx.getImageData(0, 0, cv.width, cv.height); renderAt(0); snap.getContext('2d').drawImage(cv, 0, 0); ctx.putImageData(keep, 0, 0); frame0 = snap; }
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = smooth((t - dz) / 0.5); ctx.drawImage(frame0, 0, 0); ctx.restore();

}
window.seek = t => { player.t = clamp(t, 0, config.duration); drawFrame(player.t); syncUI(); };

// =====================================================================
// AUDIO: one-shots rendered once, mixed at event times, pad, normalise
// =====================================================================
const SR = 44100;
const SFX = {
  thump:  (c, f, o) => tone(c, o, 'sine', 120 * f, 48 * f, 0.18 / f, 0.9),
  clack:  (c, f, o) => noise(c, o, 2600 * f, 8, 0.04 / f, 0.6),
  tick:   (c, f, o) => tone(c, o, 'square', 3200 * f, 3000 * f, 0.018 / f, 0.25),
  ratchet:(c, f, o) => { for (let i = 0; i < 3; i++) noise(c, o, 1800 * f, 10, 0.02 / f, 0.5, i * 0.035 / f); },
  chime:  (c, f, o) => { tone(c, o, 'sine', 1318 * f, 1318 * f, 0.6 / f, 0.5); tone(c, o, 'triangle', 1976 * f, 1976 * f, 0.45 / f, 0.25, 0.04 / f); },
  buzz:   (c, f, o) => tone(c, o, 'sawtooth', 110 * f, 100 * f, 0.26 / f, 0.35, 0, 900 * f),
  thunk:  (c, f, o) => { tone(c, o, 'sine', 170 * f, 70 * f, 0.2 / f, 0.9); noise(c, o, 400 * f, 1, 0.08 / f, 0.5); },
  pop:    (c, f, o) => tone(c, o, 'sine', 900 * f, 1400 * f, 0.05 / f, 0.5),
  whoosh: (c, f, o) => { const n = noiseSrc(c, 1.0); const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(300, 0); bp.frequency.exponentialRampToValueAtTime(2600, 0.6); bp.frequency.exponentialRampToValueAtTime(500, 0.95);
    const g = c.createGain(); g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(0.8, 0.55); g.gain.linearRampToValueAtTime(0, 0.98);
    n.connect(bp).connect(g).connect(o); n.start(0); },
  land:   (c, f, o) => { tone(c, o, 'sine', 75 * f, 45 * f, 0.6 / f, 1); noise(c, o, 300 * f, 0.7, 0.3 / f, 0.6); }
};
function noiseSrc(c, dur) { const b = c.createBuffer(1, Math.ceil(dur * c.sampleRate), c.sampleRate), d = b.getChannelData(0), r = mulberry32(5);
  for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; const s = c.createBufferSource(); s.buffer = b; return s; }
function tone(c, o, type, f0, f1, dur, vol, at = 0, lp) {
  const os = c.createOscillator(), g = c.createGain(); os.type = type; os.frequency.setValueAtTime(f0, at); os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), at + dur);
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0008, at + dur);
  let n = os; if (lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; os.connect(f); n = f; }
  n.connect(g).connect(o); os.start(at); os.stop(at + dur + 0.05);
}
function noise(c, o, freq, q, dur, vol, at = 0) {
  const n = noiseSrc(c, dur + 0.05), bp = c.createBiquadFilter(), g = c.createGain(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0008, at + dur); n.connect(bp).connect(g).connect(o); n.start(at); n.stop(at + dur + 0.05);
}
async function renderShot(name, slow) {
  const f = slow ? 0.62 : 1, len = Math.ceil((name === 'whoosh' ? 1.1 : 1.0) / (slow ? 0.55 : 1) * SR);
  const c = new OfflineAudioContext(1, len, SR); SFX[name](c, f, c.destination);
  return (await c.startRendering()).getChannelData(0);
}
async function renderPad(dur) {
  const c = new OfflineAudioContext(2, Math.ceil(dur * SR), SR), lp = c.createBiquadFilter(), g = c.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 800; g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(1, 3); g.gain.setValueAtTime(1, dur - 2); g.gain.linearRampToValueAtTime(0.4, dur);
  lp.connect(g).connect(c.destination);
  const chords = [[130.81, 196.0, 246.94, 329.63], [110.0, 164.81, 220.0, 261.63]];
  for (let ci = 0; ci * 8 < dur; ci++) {
    const at = ci * 8, ch = chords[ci % 2];
    ch.forEach((fr, i) => { for (const det of [-3, 3]) {
      const o = c.createOscillator(), v = c.createGain(), p = c.createStereoPanner(); o.type = 'triangle'; o.frequency.value = fr; o.detune.value = det;
      p.pan.value = det > 0 ? 0.4 : -0.4; v.gain.setValueAtTime(0, at); v.gain.linearRampToValueAtTime(0.022, at + 2.5); v.gain.setValueAtTime(0.022, at + 6.5); v.gain.linearRampToValueAtTime(0, at + 9.5);
      o.connect(v).connect(p).connect(lp); o.start(at); o.stop(Math.min(dur, at + 9.6)); } });
  }
  return await c.startRendering();
}
function audioEvents() {
  const out = [], add = (name, s, x, vol) => out.push({ name, s, x, vol });
  for (const e of RUN.ev) {
    switch (e.type) {
      case 'spawn:user': case 'spawn:bot': add('thump', e.s, e.x, 0.22); break;
      case 'merge': add('clack', e.s, e.x, 0.18); break;
      case 'accept': add('tick', e.s, e.x, 0.3); add('chime', e.s + 0.02, e.x, 0.32); break;
      case 'reject': add('tick', e.s, e.x, 0.3); add('buzz', e.s + 0.02, e.x + 60, 0.3); break;
      case 'bin': add('thunk', e.s, e.x, 0.4); add('pop', e.s, 900, 0.18); break;
      case 'serve': add('ratchet', e.s, e.x, 0.22); break;
      case 'served:user': add('pop', e.s, 160, 0.22); break;
      case 'served:bot': add('pop', e.s, 920, 0.22); break;
      case 'drop': add('whoosh', e.s - 0.3, e.x, 0.55); break;
      case 'land': add('land', e.s, e.x, 0.9); break;
    }
  }
  return out;
}
async function buildAudio() {
  const D = config.duration, N = Math.ceil(D * SR), L = new Float32Array(N), R = new Float32Array(N);
  const shots = {};
  for (const n of Object.keys(SFX)) { shots[n + '0'] = await renderShot(n, 0); shots[n + '1'] = await renderShot(n, 1); }
  const pad = await renderPad(D), pl = pad.getChannelData(0), pr = pad.getChannelData(1);
  for (let i = 0; i < N; i++) { L[i] = pl[i]; R[i] = pr[i]; }
  for (const e of audioEvents()) {
    const t = vt(e.s); if (t < 0 || t >= D) continue;
    const slow = speedAt(t) < 0.9 ? 1 : 0, buf = shots[e.name + slow];
    const cam = camAt(t), sx = (e.x - cam.x) * cam.z / W.w; // -0.5..0.5 on screen
    const pan = clamp(sx * 1.4, -0.8, 0.8), gl = Math.cos((pan + 1) * Math.PI / 4) * e.vol, gr = Math.sin((pan + 1) * Math.PI / 4) * e.vol;
    const i0 = Math.round(t * SR);
    for (let i = 0; i < buf.length && i0 + i < N; i++) { L[i0 + i] += buf[i] * gl; R[i0 + i] += buf[i] * gr; }
  }
  // loudness: RMS target about -18 dBFS (approximates -18 LUFS for this material), then soft limiter
  let sum = 0; for (let i = 0; i < N; i++) sum += L[i] * L[i] + R[i] * R[i];
  const rms = Math.sqrt(sum / (2 * N)), gain = Math.pow(10, -18 / 20) / Math.max(rms, 1e-6);
  const lim = x => { x *= gain; const a = Math.abs(x); return a < 0.7 ? x : Math.sign(x) * (0.7 + 0.29 * Math.tanh((a - 0.7) / 0.29)); };
  for (let i = 0; i < N; i++) { L[i] = lim(L[i]); R[i] = lim(R[i]); }
  // short fades so the loop point is clean
  const fN = Math.round(0.3 * SR); for (let i = 0; i < fN; i++) { const k = i / fN; L[N - 1 - i] *= k; R[N - 1 - i] *= k; }
  return { L, R, N };
}

// =====================================================================
// PLAYER
// =====================================================================
const player = { t: 0, playing: false, sound: true, loop: true, started: false, wallStart: 0, actx: null, buf: null, src: null, ctxStart: 0, audioReady: null };
const $ = id => document.getElementById(id);
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
function syncUI() {
  $('play').textContent = player.playing ? '❚❚' : '▶';
  $('scrub').value = Math.round(player.t * 1000);
  $('time').textContent = `${fmt(player.t)} / ${fmt(config.duration).replace(/\.0$/, '')}`;
  $('snd').setAttribute('aria-pressed', player.sound); $('loop').setAttribute('aria-pressed', player.loop);
}
function stopSource() { if (player.src) { try { player.src.stop(); } catch (e) {} player.src.disconnect(); player.src = null; } }
function startSource() {
  stopSource();
  if (!player.sound || !player.buf || !player.playing) return;
  const s = player.actx.createBufferSource(); s.buffer = player.buf; s.connect(player.actx.destination);
  player.ctxStart = player.actx.currentTime - player.t; s.start(0, player.t); player.src = s;
}
function ensureAudio() {
  if (player.audioReady) return player.audioReady;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !window.OfflineAudioContext) { $('snd').disabled = true; player.sound = false; return (player.audioReady = Promise.resolve()); }
  player.actx = new AC();
  player.audioReady = buildAudio().then(({ L, R, N }) => {
    const b = player.actx.createBuffer(2, N, SR); b.copyToChannel(L, 0); b.copyToChannel(R, 1); player.buf = b;
    if (player.playing) { player.wallClockT = player.t; startSource(); }
  }).catch(err => { console.warn('audio disabled', err); $('snd').disabled = true; player.sound = false; });
  return player.audioReady;
}
function play() {
  if (player.t >= config.duration - 0.01) player.t = 0;
  player.playing = true; player.started = true; $('bigplay').style.display = 'none';
  player.wallStart = performance.now() / 1000 - player.t;
  if (player.actx && player.actx.state === 'suspended') player.actx.resume();
  ensureAudio(); startSource(); syncUI();
}
function pause() { player.playing = false; stopSource(); syncUI(); }
function toggle() { player.playing ? pause() : play(); }
function seekTo(t) { player.t = clamp(t, 0, config.duration); player.wallStart = performance.now() / 1000 - player.t; if (player.playing) startSource(); drawFrame(player.t); syncUI(); }
function tick() {
  if (player.playing) {
    // audio clock is master while sound plays
    if (player.src && player.sound) player.t = player.actx.currentTime - player.ctxStart;
    else player.t = performance.now() / 1000 - player.wallStart;
    if (player.t >= config.duration) {
      if (player.loop) { player.t = 0; player.wallStart = performance.now() / 1000; startSource(); }
      else { player.t = config.duration; pause(); }
    }
    drawFrame(player.t); syncUI();
  }
  requestAnimationFrame(tick);
}
$('bigplay').onclick = play; $('play').onclick = toggle;
$('scrub').oninput = e => seekTo(e.target.value / 1000);
$('snd').onclick = () => { player.sound = !player.sound; if (player.sound) { ensureAudio(); if (player.playing) startSource(); } else { stopSource(); player.wallStart = performance.now() / 1000 - player.t; } syncUI(); };
$('loop').onclick = () => { player.loop = !player.loop; syncUI(); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); seekTo(player.t + 2); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); seekTo(player.t - 2); }
});
function layout() {
  const barH = 52, availH = innerHeight - barH - 16, availW = Math.min(innerWidth - 16, 1080);
  let h = availH, w = h * 9 / 16; if (w > availW) { w = availW; h = w * 16 / 9; }
  w = Math.floor(w); h = Math.floor(w * 16 / 9);
  const st = $('stage'); st.style.width = w + 'px'; st.style.height = h + 'px'; $('bar').style.width = w + 'px';
  DPR = Math.min(2, window.devicePixelRatio || 1); CW = w; CH = h; cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  frame0 = null; drawFrame(player.t);
}
addEventListener('resize', layout);
window.__debug = { RUN, warp, vt, speedAt, camAt, CAPS, SHOTS, SLOW, countAt, STORY_END };
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layout(); syncUI(); requestAnimationFrame(tick); });
layout();
</script>
