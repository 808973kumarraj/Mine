<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Change Data Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B0F17; --text:#E8ECF2; --text2:#9AA3B2; --slate:#3A4250; --accent:#B7A6F5; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#06080D; color:var(--text); overflow-x:hidden;
    font-family:'Space Grotesk',system-ui,sans-serif; }
  #app { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 0; }
  #stage { position:relative; background:var(--bg); border-radius:10px; overflow:hidden; box-shadow:0 0 0 1px #1a2130; }
  canvas { display:block; width:100%; height:100%; }
  #bigplay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(11,15,23,.35);
    border:0; cursor:pointer; color:var(--text); }
  #bigplay span { width:96px; height:96px; border-radius:50%; border:2px solid var(--accent); display:flex; align-items:center;
    justify-content:center; box-shadow:0 0 24px rgba(183,166,245,.45); background:rgba(11,15,23,.6); }
  #bigplay svg { margin-left:6px; }
  #bar { display:flex; align-items:center; gap:10px; padding:10px 4px 0; font:12px 'JetBrains Mono',monospace; color:var(--text2); }
  #bar button { background:none; border:1px solid var(--slate); color:var(--text); border-radius:6px; height:30px; min-width:34px;
    font:inherit; cursor:pointer; padding:0 8px; }
  #bar button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  #bar button:disabled { opacity:.4; cursor:default; }
  #scrub { flex:1; accent-color:#B7A6F5; min-width:60px; }
  #time { min-width:84px; text-align:right; letter-spacing:.05em; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="bigplay" aria-label="Play"><span><svg width="34" height="38" viewBox="0 0 34 38"><path d="M2 2 L32 19 L2 36 Z" fill="none" stroke="#E8ECF2" stroke-width="3" stroke-linejoin="round"/></svg></span></button>
  </div>
  <div id="bar">
    <button id="play" aria-label="Play or pause">▶</button>
    <input id="scrub" type="range" min="0" max="57000" step="1" value="0" aria-label="Scrub">
    <span id="time">0:00.0 / 0:57</span>
    <button id="snd" aria-pressed="true" aria-label="Sound">SND</button>
    <button id="loop" aria-pressed="true" aria-label="Loop">LOOP</button>
  </div>
</div>
<script>
// =====================================================================
// CONFIG: topic strings, colours, timing, captions, camera, slow motion.
// Times marked "story" are in story seconds (before slow motion).
// =====================================================================
const config = {
  topic: 'Delta Lake Change Data Feed',
  handle: '@kumarraj',
  title: [{ text: 'Change Data ', color: 'text' }, { text: 'Feed', color: 'turn' }],
  subtitle: 'Delta Lake · track row-level changes',
  hook: 'What changed between v0 and v1?',
  footer: ['CDF = ONLY THE CHANGED ROWS, READ FROM THE DELTA LOG', 'SIMPLIFIED · Delta Lake readChangeFeed · table_changes()'],
  duration: 57, seed: 11, world: { w: 1080, h: 1920 },
  colors: {
    bg: '#0B0F17', good: '#7DB4F0', bad: '#F0738F', main: '#F2B544', turn: '#B7A6F5', dest: '#6FD6B4',
    slate: '#3A4250', slateLine: '#5A6476', text: '#E8ECF2', text2: '#9AA3B2'
  },
  // meaning → colour: postimage/new value = good, preimage/old value = bad, Delta table = main, CDF = turn, insert = dest
  table: { name: 'customers', cols: ['id', 'name', 'city'], widths: [130, 270, 360],
    v0: [[1, 'Ravi', 'Hyderabad'], [2, 'John', 'Chennai'], [3, 'Priya', 'Bangalore']],
    update: { row: 1, col: 2, to: 'Mumbai' }, insert: [4, 'Arun', 'Delhi'] },
  cdfRows: [ // [_change_type, id, name, city, colour, source row in v1]
    ['update_preimage', 2, 'John', 'Chennai', 'bad', 1],
    ['update_postimage', 2, 'John', 'Mumbai', 'good', 1],
    ['insert', 4, 'Arun', 'Delhi', 'dest', 3]
  ],
  scenes: [ // story seconds
    { id: 'hook', a: 0, b: 4.6, chip: '' },
    { id: 'example', a: 4.6, b: 12.6, chip: '1 · EXAMPLE' },
    { id: 'how', a: 12.6, b: 20.6, chip: '2 · HOW IT WORKS' },
    { id: 'output', a: 20.6, b: 30.6, chip: '3 · CDF OUTPUT' },
    { id: 'enable', a: 30.6, b: 37.4, chip: '4 · ENABLE CDF' },
    { id: 'read', a: 37.4, b: 43.2, chip: '5 · READ CHANGES' },
    { id: 'why', a: 43.2, b: 47.6, chip: '6 · WHY IT MATTERS' },
    { id: 'pitfalls', a: 47.6, b: 50.0, chip: '7 · CHALLENGES' },
    { id: 'summary', a: 50.0, b: 99, chip: '' }
  ],
  events: { flip: 8.6, insert: 10.2, commit: 15.0, cdfRead: 17.4, pre: 23.0, post: 24.6, ins: 26.4, toggle: 35.0 },
  code: {
    enable: 'ALTER TABLE customers\nSET TBLPROPERTIES (\n  delta.enableChangeDataFeed = true\n);',
    sql: "SELECT * FROM\n  table_changes('customers', 0, 1);",
    spark: 'spark.read.format("delta")\n  .option("readChangeFeed", "true")\n  .option("startingVersion", 0)\n  .option("endingVersion", 1)\n  .table("customers")'
  },
  why: ['Incremental ETL: process only changes', 'Sync to Snowflake / BigQuery', 'Audit and data lineage', 'SCD Type 2 dimensions', 'Event streams to Kafka'],
  pitfalls: ['VACUUM can delete the history CDF needs', 'Checkpoint streams so no version is missed', 'Handle preimage + postimage and deletes'],
  captions: [ // story seconds
    { at: 0.3, end: 4.4, text: 'WHAT CHANGED? DON’T RESCAN IT ALL.', word: 'CHANGED', color: 'turn' },
    { at: 4.8, end: 8.2, text: 'This is version 0 of a Delta table.', word: 'version 0', color: 'main' },
    { at: 8.4, end: 12.4, text: 'One update and one insert make version 1.', word: 'version 1', color: 'good' },
    { at: 12.8, end: 16.8, text: 'Every commit is written to the transaction log.', word: 'transaction log', color: 'main' },
    { at: 17.0, end: 20.4, text: 'CDF reads that log, not the whole table.', word: 'CDF', color: 'turn' },
    { at: 20.8, end: 22.7, text: 'CDF returns only the changed rows.', word: 'changed rows', color: 'turn' },
    { at: 22.8, end: 26.2, text: 'An update gives two rows: before and after.', word: 'two rows', color: 'good' },
    { at: 26.3, end: 30.4, text: 'An insert gives one row. 3 rows, not 4.', word: 'one row', color: 'dest' },
    { at: 30.8, end: 37.2, text: 'Turn it on with one table property.', word: 'one table property', color: 'turn' },
    { at: 37.6, end: 43.0, text: 'Read changes by version, in SQL or Spark.', word: 'by version', color: 'turn' },
    { at: 43.4, end: 47.4, text: 'Process only what changed, not everything.', word: 'only what changed', color: 'good' },
    { at: 47.8, end: 49.8, text: 'Watch out: keep enough history.', word: 'history', color: 'bad' },
    { at: 50.2, end: 99, text: 'CDF: row-level changes from the Delta log.', word: 'row-level changes', color: 'turn' }
  ],
  shots: [ // at = story seconds or event anchor; dur in video seconds
    { at: 0, x: 540, y: 960, z: 1, why: 'the question and the topic' },
    { event: 'flip', near: 8.6, lead: 0.35, dur: 0.7, x: 545, y: 840, z: 1.4, why: 'watch one cell change' },
    { at: 10.9, dur: 0.7, x: 540, y: 960, z: 1, why: 'the whole v1 table, with the insert' },
    { event: 'commit', near: 15, lead: 0.35, dur: 0.7, x: 540, y: 1000, z: 1.3, why: 'the commit lands in the log' },
    { at: 17.2, dur: 0.7, x: 540, y: 960, z: 1, why: 'table, log and CDF together' },
    { event: 'pre', near: 23, lead: 0.35, dur: 0.7, x: 540, y: 1040, z: 1.25, why: 'rows land in the CDF output' },
    { at: 27.8, dur: 0.8, x: 540, y: 960, z: 1, why: 'v1 table vs 3-row output' },
    { at: 33.6, dur: 0.7, x: 540, y: 900, z: 1.15, why: 'the one property that matters' },
    { at: 37.0, dur: 0.7, x: 540, y: 960, z: 1, why: 'two ways to read changes' }
  ],
  slowmo: [
    { event: 'flip', near: 8.6, before: 0.1, after: 0.9, speed: 0.4, ramp: 0.15 },
    { event: 'pre',  near: 23,  before: 0.1, after: 0.9, speed: 0.4, ramp: 0.15 }
  ]
};

// =====================================================================
// Utilities
// =====================================================================
const C = config.colors, W = config.world;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const easeIO = k => { k = clamp(k, 0, 1); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',') + ')'; };
const rgba = (h, a) => { const A = hex(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; };
const col = name => C[name] || name;
function bsearchLE(arr, v) { let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= v) { r = m; lo = m + 1; } else hi = m - 1; } return r; }

// =====================================================================
// SCRIPTED RUN: every item's path and event times, precomputed
// =====================================================================
function buildRun() {
  const E = config.events, ev = [];
  for (const [type, s] of Object.entries(E)) ev.push({ type, s, x: 540 });
  for (const sc of config.scenes) if (sc.a > 0) ev.push({ type: 'scene', s: sc.a, x: 540 });
  const typeTicks = (s0, str, cps, x) => { for (let i = 0; i < str.length; i += 3) if (str[i] !== ' ' && str[i] !== '\n') ev.push({ type: 'key', s: s0 + i / cps, x }); };
  typeTicks(T.enableA, config.code.enable, CPS, 540); typeTicks(T.sqlA, config.code.sql, CPS, 540); typeTicks(T.sparkA, config.code.spark, CPS * 1.6, 540);
  config.why.forEach((_, i) => ev.push({ type: 'check', s: T.whyA + 1.4 + i * 0.6, x: 300 }));
  config.pitfalls.forEach((_, i) => ev.push({ type: 'warn', s: T.pitA + 0.3 + i * 0.6, x: 300 }));
  ev.sort((a, b) => a.s - b.s);
  const run = { ev, land: E.flip };
  run.find = (type, near) => { let best = null; for (const e of ev) if (e.type === type && (!best || Math.abs(e.s - near) < Math.abs(best.s - near))) best = e; return best; };
  return run;
}
const CPS = 26; // typing speed, chars per story second
const T = (() => { const S = Object.fromEntries(config.scenes.map(s => [s.id, s]));
  return { enableA: S.enable.a + 0.6, sqlA: S.read.a + 0.4, sparkA: S.read.a + 2.2, whyA: S.why.a, pitA: S.pitfalls.a, S }; })();
const RUN = buildRun();


// =====================================================================
// TIME REMAP: s = warp(t), 1 ms table built once
// =====================================================================
const SLOW = config.slowmo.map(w => { const e = RUN.find(w.event, w.near); return { ...w, a: e.s - w.before, b: e.s + w.after }; });
function speedAtStory(s) {
  let sp = 1;
  for (const w of SLOW) {
    let k = 0;
    if (s >= w.a && s <= w.b) k = 1;
    else if (s > w.a - w.ramp && s < w.a) k = smooth((s - (w.a - w.ramp)) / w.ramp);
    else if (s > w.b && s < w.b + w.ramp) k = 1 - smooth((s - w.b) / w.ramp);
    sp = Math.min(sp, lerp(1, w.speed, k));
  }
  return sp;
}
const DT = 0.001, NT = Math.round(config.duration / DT) + 1;
const WARP = new Float64Array(NT);
{ let s = 0; for (let i = 0; i < NT; i++) { WARP[i] = s; s += speedAtStory(s) * DT; } }
function warp(t) { const f = clamp(t, 0, config.duration) / DT, i = Math.min(NT - 2, Math.floor(f)); return lerp(WARP[i], WARP[i + 1], f - i); }
function vt(s) { // inverse: video time of story time s
  if (s <= 0) return s; let lo = 0, hi = NT - 1;
  if (s >= WARP[hi]) return config.duration + (s - WARP[hi]);
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (WARP[m] <= s) lo = m; else hi = m; }
  return (lo + (s - WARP[lo]) / (WARP[hi] - WARP[lo])) * DT;
}
const speedAt = t => speedAtStory(warp(t));
const STORY_END = warp(config.duration);
const countAt = (arr, s) => bsearchLE(arr, s) + 1;

// captions: resolve templates and video times
const CAPS = config.captions.map(c => {
  const sAt = c.at;
  const text = c.text;
  const focus = null;
  return { ...c, text, t0: vt(c.at), t1: Math.min(vt(c.end), config.duration - 0.05), focusItem: focus && focus.it, tag: c.focus && c.focus.tag };
});
// camera shots: resolve event anchors
const SHOTS = config.shots.map(sh => {
  let t0;
  const dur = sh.dur || 0;
  if (sh.event) { const e = RUN.find(sh.event, sh.near); sh.eventS = e.s; t0 = vt(e.s) - sh.lead - dur; }
  else t0 = vt(sh.at);
  return { ...sh, t0, t1: t0 + dur };
}).sort((a, b) => a.t0 - b.t0);
const clampCam = c => { const hw = W.w / 2 / c.z, hh = W.h / 2 / c.z;
  return { x: clamp(c.x, hw, W.w - hw), y: clamp(c.y, hh, W.h - hh), z: c.z }; };
function camAt(t) {
  let cur = clampCam(SHOTS[0]);
  for (let i = 1; i < SHOTS.length; i++) {
    const sh = SHOTS[i]; if (t < sh.t0) break;
    const to = clampCam(sh), k = sh.t1 > sh.t0 ? easeIO((t - sh.t0) / (sh.t1 - sh.t0)) : 1;
    cur = { x: lerp(cur.x, to.x, k), y: lerp(cur.y, to.y, k), z: Math.exp(lerp(Math.log(cur.z), Math.log(to.z), k)) };
  }
  return cur;
}

// =====================================================================
// ITEM STATE at story time s (pure)
// =====================================================================
// =====================================================================
// RENDERING
// =====================================================================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let CW = 360, CH = 640, DPR = 1;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUST = (() => { const r = mulberry32(99); return Array.from({ length: 70 }, () => ({ x: r() * W.w, y: r() * W.h, vx: (r() - .5) * 6, vy: -2 - r() * 6, s: 1 + r() * 2.2, a: .05 + r() * .12 })); })();
const LW = 3; // world line width (about 2 px at 720 wide)
const F_SANS = '"Space Grotesk", system-ui, sans-serif', F_MONO = '"JetBrains Mono", ui-monospace, monospace';
let VIEW = null; // current camera, for label visibility

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur * (CW / 720) * (VIEW ? VIEW.z : 1); }
function noGlow() { ctx.shadowBlur = 0; }
function strokeShape(path, color, fillA = 0.08, lw = LW, blur = 10) {
  ctx.beginPath(); path(); ctx.fillStyle = rgba(color.startsWith('#') ? color : '#ffffff', fillA);
  if (fillA > 0) ctx.fill();
  glow(color, blur); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); noGlow();
}
function monoText(txt, x, y, size, color, align = 'left', spacing = 0.18, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `600 ${size}px ${F_MONO}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  try { ctx.letterSpacing = (size * spacing).toFixed(1) + 'px'; } catch (e) {}
  ctx.fillText(txt, x, y); ctx.restore();
}
// labels are fully in frame or faded out
function labelAlpha(x0, y0, x1, y1) {
  const hw = W.w / 2 / VIEW.z, hh = W.h / 2 / VIEW.z;
  const vx0 = VIEW.x - hw, vx1 = VIEW.x + hw, vy0 = VIEW.y - hh, vy1 = VIEW.y + hh;
  const ix = Math.max(0, Math.min(x1, vx1) - Math.max(x0, vx0)), iy = Math.max(0, Math.min(y1, vy1) - Math.max(y0, vy0));
  const f = ix * iy / ((x1 - x0) * (y1 - y0));
  return f > 0.995 ? 1 : Math.pow(f, 40);
}
function compLabel(x, y, title, sub, color, align) {
  ctx.save(); ctx.font = `600 24px ${F_MONO}`;
  const w = 290, x0 = align === 'right' ? x - w : x, a = labelAlpha(x0, y - 26, x0 + w, y + 34);
  monoText(title, x, y, 24, color, align, 0.16, a);
  ctx.globalAlpha = a; ctx.font = `500 24px ${F_SANS}`; ctx.fillStyle = C.text2; ctx.textAlign = align; ctx.fillText(sub, x, y + 32);
  ctx.restore();
}

const sceneWin = (id, s, f = 0.35) => { const sc = T.S[id], first = sc.a <= 0, last = sc.b > 90;
  return Math.min(first ? 1 : smooth((s - sc.a) / f), last ? 1 : smooth((sc.b - s) / f)); };
const typed = (str, s, a, cps) => str.slice(0, clamp(Math.floor((s - a) * cps), 0, str.length));
const since = (s, a, d) => clamp((s - a) / d, 0, 1);
function sansText(txt, x, y, size, color, align = 'left', weight = 500) { ctx.font = `${weight} ${size}px ${F_SANS}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(txt, x, y); }
function panel(x, y, w, h, color, fill = 0.06, blur = 10, r = 16) { strokeShape(() => ctx.roundRect(x, y, w, h, r), color, fill, LW, blur); }
function arrow(x0, y0, x1, y1, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = LW; glow(color, 6);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const an = Math.atan2(y1 - y0, x1 - x0); ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - 16 * Math.cos(an - .45), y1 - 16 * Math.sin(an - .45)); ctx.lineTo(x1 - 16 * Math.cos(an + .45), y1 - 16 * Math.sin(an + .45)); ctx.closePath(); ctx.fill();
  noGlow(); ctx.restore();
}
function codeBlock(str, x, y, size, lh, color) {
  ctx.font = `500 ${size}px ${F_MONO}`; ctx.textAlign = 'left';
  str.split('\n').forEach((ln, i) => { // light syntax colour: keywords lavender, strings mint
    let cx = x; for (const tok of ln.split(/(\s+|[(),.;=])/)) { if (!tok) continue;
      ctx.fillStyle = /^(ALTER|TABLE|SET|TBLPROPERTIES|SELECT|FROM|true)$/.test(tok) ? C.turn : /^["'].*/.test(tok) ? C.dest : /^\d+$/.test(tok) ? C.main : color;
      ctx.fillText(tok, cx, y + i * lh); cx += ctx.measureText(tok).width; } });
}
// table row cells; widths from config
function rowCells(x0, y, widths, cells, colors, size = 30) {
  let x = x0; cells.forEach((c, i) => { sansText(String(c), x + 22, y, size, colors[i] || C.text, 'left', 500); x += widths[i]; });
}
function gridLines(x0, y0, widths, h, color, a) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = 1.5; let x = x0;
  for (let i = 0; i < widths.length - 1; i++) { x += widths[i]; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + h); ctx.stroke(); } ctx.restore();
}

function drawFrameWorld(t, s) {
  const E = config.events, TB = config.table, W3 = TB.widths, TW = W3.reduce((a, b) => a + b, 0);
  for (const d of DUST) {
    const dx = reduced ? 0 : d.vx * s, dy = reduced ? 0 : d.vy * s;
    const x = ((d.x + dx) % W.w + W.w) % W.w, y = ((d.y + dy) % W.h + W.h) % W.h;
    ctx.fillStyle = `rgba(200,210,230,${d.a})`; ctx.beginPath(); ctx.arc(x, y, d.s, 0, 7); ctx.fill();
  }
  // ---------- header ----------
  ctx.save(); ctx.globalAlpha = labelAlpha(140, 160, 940, 425); ctx.textAlign = 'center';
  monoText(config.handle.toUpperCase(), 540, 190, 22, C.text2, 'center', 0.25);
  ctx.font = `700 88px ${F_SANS}`; const parts = config.title, widths = parts.map(p => ctx.measureText(p.text).width);
  let tx = 540 - widths.reduce((a, b) => a + b, 0) / 2; ctx.textAlign = 'left';
  parts.forEach((p, i) => { ctx.fillStyle = col(p.color); if (p.color !== 'text') glow(col(p.color), 14); ctx.fillText(p.text, tx, 285); noGlow(); tx += widths[i]; });
  ctx.textAlign = 'center'; ctx.font = `500 34px ${F_SANS}`; ctx.fillStyle = C.text2; ctx.fillText(config.subtitle, 540, 340);
  ctx.font = `500 28px ${F_SANS}`; const pw = ctx.measureText(config.hook).width + 56;
  ctx.beginPath(); ctx.roundRect(540 - pw / 2, 368, pw, 52, 26); ctx.fillStyle = '#131A26'; ctx.fill(); ctx.strokeStyle = '#2A3242'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = C.text; ctx.fillText(config.hook, 540, 403);
  ctx.restore();
  // section chip
  for (const sc of config.scenes) { if (!sc.chip) continue; const a = sceneWin(sc.id, s); if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a * labelAlpha(380, 455, 700, 505); monoText(sc.chip, 540, 492, 22, C.turn, 'center', 0.22); ctx.restore(); }

  let a;
  // ---------- hook: v0 → ? → v1 ----------

  if (fa > 0) { monoText(config.footer[0], 540, 1750, 19, C.text, 'center', 0.14, fa); monoText(config.footer[1], 540, 1784, 15, C.text2, 'center', 0.12, fa * 0.9); }
  ctx.restore();
}

function renderAt(t) {
  t = clamp(t, 0, config.duration);
  const s = warp(t);
  VIEW = camAt(t);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, CW, CH);
  const k = CW / W.w * VIEW.z;
  ctx.save(); ctx.translate(CW / 2, CH / 2); ctx.scale(k, k); ctx.translate(-VIEW.x, -VIEW.y);
  drawFrameWorld(t, s);
  ctx.restore();
  drawOverlay(t);
}
// pure frame draw + loop dissolve into frame 0
let frame0 = null;
function drawFrame(t) {
  renderAt(t);
  const dz = config.duration - 0.5;
  if (t > dz) {
    if (!frame0) { const snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height;
      const keep = ctx.getImageData(0, 0, cv.width, cv.height); renderAt(0); snap.getContext('2d').drawImage(cv, 0, 0); ctx.putImageData(keep, 0, 0); frame0 = snap; }
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = smooth((t - dz) / 0.5); ctx.drawImage(frame0, 0, 0); ctx.restore();
  }
}
window.seek = t => { player.t = clamp(t, 0, config.duration); drawFrame(player.t); syncUI(); };

// =====================================================================
// AUDIO: one-shots rendered once, mixed at event times, pad, normalise
// =====================================================================
const SR = 44100;
const SFX = {
  thump:  (c, f, o) => tone(c, o, 'sine', 120 * f, 48 * f, 0.18 / f, 0.9),
  clack:  (c, f, o) => noise(c, o, 2600 * f, 8, 0.04 / f, 0.6),
  tick:   (c, f, o) => tone(c, o, 'square', 3200 * f, 3000 * f, 0.018 / f, 0.25),
  ratchet:(c, f, o) => { for (let i = 0; i < 3; i++) noise(c, o, 1800 * f, 10, 0.02 / f, 0.5, i * 0.035 / f); },
  chime:  (c, f, o) => { tone(c, o, 'sine', 1318 * f, 1318 * f, 0.6 / f, 0.5); tone(c, o, 'triangle', 1976 * f, 1976 * f, 0.45 / f, 0.25, 0.04 / f); },
  buzz:   (c, f, o) => tone(c, o, 'sawtooth', 110 * f, 100 * f, 0.26 / f, 0.35, 0, 900 * f),
  thunk:  (c, f, o) => { tone(c, o, 'sine', 170 * f, 70 * f, 0.2 / f, 0.9); noise(c, o, 400 * f, 1, 0.08 / f, 0.5); },
  pop:    (c, f, o) => tone(c, o, 'sine', 900 * f, 1400 * f, 0.05 / f, 0.5),
  whoosh: (c, f, o) => { const n = noiseSrc(c, 1.0); const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(300, 0); bp.frequency.exponentialRampToValueAtTime(2600, 0.6); bp.frequency.exponentialRampToValueAtTime(500, 0.95);
    const g = c.createGain(); g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(0.8, 0.55); g.gain.linearRampToValueAtTime(0, 0.98);
    n.connect(bp).connect(g).connect(o); n.start(0); },
  land:   (c, f, o) => { tone(c, o, 'sine', 75 * f, 45 * f, 0.6 / f, 1); noise(c, o, 300 * f, 0.7, 0.3 / f, 0.6); }
};
function noiseSrc(c, dur) { const b = c.createBuffer(1, Math.ceil(dur * c.sampleRate), c.sampleRate), d = b.getChannelData(0), r = mulberry32(5);
  for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; const s = c.createBufferSource(); s.buffer = b; return s; }
function tone(c, o, type, f0, f1, dur, vol, at = 0, lp) {
  const os = c.createOscillator(), g = c.createGain(); os.type = type; os.frequency.setValueAtTime(f0, at); os.frequency.exponentialRampToValueAtTime(Math.max(20, f1), at + dur);
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0008, at + dur);
  let n = os; if (lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; os.connect(f); n = f; }
  n.connect(g).connect(o); os.start(at); os.stop(at + dur + 0.05);
}
function noise(c, o, freq, q, dur, vol, at = 0) {
  const n = noiseSrc(c, dur + 0.05), bp = c.createBiquadFilter(), g = c.createGain(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0008, at + dur); n.connect(bp).connect(g).connect(o); n.start(at); n.stop(at + dur + 0.05);
}
async function renderShot(name, slow) {
  const f = slow ? 0.62 : 1, len = Math.ceil((name === 'whoosh' ? 1.1 : 1.0) / (slow ? 0.55 : 1) * SR);
  const c = new OfflineAudioContext(1, len, SR); SFX[name](c, f, c.destination);
  return (await c.startRendering()).getChannelData(0);
}
async function renderPad(dur) {
  const c = new OfflineAudioContext(2, Math.ceil(dur * SR), SR), lp = c.createBiquadFilter(), g = c.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 800; g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(1, 3); g.gain.setValueAtTime(1, dur - 2); g.gain.linearRampToValueAtTime(0.4, dur);
  lp.connect(g).connect(c.destination);
  const chords = [[130.81, 196.0, 246.94, 329.63], [110.0, 164.81, 220.0, 261.63]];
  for (let ci = 0; ci * 8 < dur; ci++) {
    const at = ci * 8, ch = chords[ci % 2];
    ch.forEach((fr, i) => { for (const det of [-3, 3]) {
      const o = c.createOscillator(), v = c.createGain(), p = c.createStereoPanner(); o.type = 'triangle'; o.frequency.value = fr; o.detune.value = det;
      p.pan.value = det > 0 ? 0.4 : -0.4; v.gain.setValueAtTime(0, at); v.gain.linearRampToValueAtTime(0.022, at + 2.5); v.gain.setValueAtTime(0.022, at + 6.5); v.gain.linearRampToValueAtTime(0, at + 9.5);
      o.connect(v).connect(p).connect(lp); o.start(at); o.stop(Math.min(dur, at + 9.6)); } });
  }
  return await c.startRendering();
}
function audioEvents() {
  const out = [], add = (name, s, x, vol) => out.push({ name, s, x, vol });
  for (const e of RUN.ev) {
    switch (e.type) {
      case 'scene': add('whoosh', e.s - 0.3, e.x, 0.25); break;
      case 'flip': add('tick', e.s, 740, 0.35); add('chime', e.s + 0.25, 740, 0.3); break;
      case 'insert': add('thump', e.s, 900, 0.35); add('chime', e.s + 0.3, 700, 0.25); break;
      case 'commit': add('clack', e.s, e.x, 0.4); add('ratchet', e.s + 0.05, e.x, 0.25); break;
      case 'cdfRead': add('chime', e.s, e.x, 0.35); break;
      case 'pre': case 'post': case 'ins': add('thunk', e.s, e.x, 0.35); add('pop', e.s, 900, 0.25); break;
      case 'toggle': add('tick', e.s, 845, 0.5); add('land', e.s, 845, 0.35); break;
      case 'key': add('tick', e.s, e.x, 0.08); break;
      case 'check': add('pop', e.s, e.x, 0.25); break;
      case 'warn': add('buzz', e.s, e.x, 0.15); break;
    }
  }
  return out;
}

async function buildAudio() {
  const D = config.duration, N = Math.ceil(D * SR), L = new Float32Array(N), R = new Float32Array(N);
  const shots = {};
  for (const n of Object.keys(SFX)) { shots[n + '0'] = await renderShot(n, 0); shots[n + '1'] = await renderShot(n, 1); }
  const pad = await renderPad(D), pl = pad.getChannelData(0), pr = pad.getChannelData(1);
  for (let i = 0; i < N; i++) { L[i] = pl[i]; R[i] = pr[i]; }
  for (const e of audioEvents()) {
    const t = vt(e.s); if (t < 0 || t >= D) continue;
    const slow = speedAt(t) < 0.9 ? 1 : 0, buf = shots[e.name + slow];
    const cam = camAt(t), sx = (e.x - cam.x) * cam.z / W.w; // -0.5..0.5 on screen
    const pan = clamp(sx * 1.4, -0.8, 0.8), gl = Math.cos((pan + 1) * Math.PI / 4) * e.vol, gr = Math.sin((pan + 1) * Math.PI / 4) * e.vol;
    const i0 = Math.round(t * SR);
    for (let i = 0; i < buf.length && i0 + i < N; i++) { L[i0 + i] += buf[i] * gl; R[i0 + i] += buf[i] * gr; }
  }
  // loudness: RMS target about -18 dBFS (approximates -18 LUFS for this material), then soft limiter
  let sum = 0; for (let i = 0; i < N; i++) sum += L[i] * L[i] + R[i] * R[i];
  const rms = Math.sqrt(sum / (2 * N)), gain = Math.pow(10, -18 / 20) / Math.max(rms, 1e-6);
  const lim = x => { x *= gain; const a = Math.abs(x); return a < 0.7 ? x : Math.sign(x) * (0.7 + 0.29 * Math.tanh((a - 0.7) / 0.29)); };
  for (let i = 0; i < N; i++) { L[i] = lim(L[i]); R[i] = lim(R[i]); }
  // short fades so the loop point is clean
  const fN = Math.round(0.3 * SR); for (let i = 0; i < fN; i++) { const k = i / fN; L[N - 1 - i] *= k; R[N - 1 - i] *= k; }
  return { L, R, N };
}

// =====================================================================
// PLAYER
// =====================================================================
const player = { t: 0, playing: false, sound: true, loop: true, started: false, wallStart: 0, actx: null, buf: null, src: null, ctxStart: 0, audioReady: null };
const $ = id => document.getElementById(id);
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
function syncUI() {
  $('play').textContent = player.playing ? '❚❚' : '▶';
  $('scrub').value = Math.round(player.t * 1000);
  $('time').textContent = `${fmt(player.t)} / ${fmt(config.duration).replace(/\.0$/, '')}`;
  $('snd').setAttribute('aria-pressed', player.sound); $('loop').setAttribute('aria-pressed', player.loop);
}
function stopSource() { if (player.src) { try { player.src.stop(); } catch (e) {} player.src.disconnect(); player.src = null; } }
function startSource() {
  stopSource();
  if (!player.sound || !player.buf || !player.playing) return;
  const s = player.actx.createBufferSource(); s.buffer = player.buf; s.connect(player.actx.destination);
  player.ctxStart = player.actx.currentTime - player.t; s.start(0, player.t); player.src = s;
}
function ensureAudio() {
  if (player.audioReady) return player.audioReady;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !window.OfflineAudioContext) { $('snd').disabled = true; player.sound = false; return (player.audioReady = Promise.resolve()); }
  player.actx = new AC();
  player.audioReady = buildAudio().then(({ L, R, N }) => {
    const b = player.actx.createBuffer(2, N, SR); b.copyToChannel(L, 0); b.copyToChannel(R, 1); player.buf = b;
    if (player.playing) { player.wallClockT = player.t; startSource(); }
  }).catch(err => { console.warn('audio disabled', err); $('snd').disabled = true; player.sound = false; });
  return player.audioReady;
}
function play() {
  if (player.t >= config.duration - 0.01) player.t = 0;
  player.playing = true; player.started = true; $('bigplay').style.display = 'none';
  player.wallStart = performance.now() / 1000 - player.t;
  if (player.actx && player.actx.state === 'suspended') player.actx.resume();
  ensureAudio(); startSource(); syncUI();
}
function pause() { player.playing = false; stopSource(); syncUI(); }
function toggle() { player.playing ? pause() : play(); }
function seekTo(t) { player.t = clamp(t, 0, config.duration); player.wallStart = performance.now() / 1000 - player.t; if (player.playing) startSource(); drawFrame(player.t); syncUI(); }
function tick() {
  if (player.playing) {
    // audio clock is master while sound plays
    if (player.src && player.sound) player.t = player.actx.currentTime - player.ctxStart;
    else player.t = performance.now() / 1000 - player.wallStart;
    if (player.t >= config.duration) {
      if (player.loop) { player.t = 0; player.wallStart = performance.now() / 1000; startSource(); }
      else { player.t = config.duration; pause(); }
    }
    drawFrame(player.t); syncUI();
  }
  requestAnimationFrame(tick);
}
$('bigplay').onclick = play; $('play').onclick = toggle;
$('scrub').oninput = e => seekTo(e.target.value / 1000);
$('snd').onclick = () => { player.sound = !player.sound; if (player.sound) { ensureAudio(); if (player.playing) startSource(); } else { stopSource(); player.wallStart = performance.now() / 1000 - player.t; } syncUI(); };
$('loop').onclick = () => { player.loop = !player.loop; syncUI(); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); seekTo(player.t + 2); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); seekTo(player.t - 2); }
});
function layout() {
  const barH = 52, availH = innerHeight - barH - 16, availW = Math.min(innerWidth - 16, 1080);
  let h = availH, w = h * 9 / 16; if (w > availW) { w = availW; h = w * 16 / 9; }
  w = Math.floor(w); h = Math.floor(w * 16 / 9);
  const st = $('stage'); st.style.width = w + 'px'; st.style.height = h + 'px'; $('bar').style.width = w + 'px';
  DPR = Math.min(2, window.devicePixelRatio || 1); CW = w; CH = h; cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  frame0 = null; drawFrame(player.t);
}
addEventListener('resize', layout);
window.__debug = { RUN, warp, vt, speedAt, camAt, CAPS, SHOTS, SLOW, countAt, STORY_END };
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layout(); syncUI(); requestAnimationFrame(tick); });
layout();
</script>
</body>
</html>
