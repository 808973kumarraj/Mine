<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:JetBrains Mono;src:url(../fonts/JetBrainsMono-Regular.ttf);font-weight:400}
@font-face{font-family:JetBrains Mono;src:url(../fonts/JetBrainsMono-Bold.ttf);font-weight:700}
@font-face{font-family:JetBrains Mono;src:url(../fonts/JetBrainsMono-ExtraBold.ttf);font-weight:800}
body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#ece6d6;font-family:JetBrains Mono;color:#2b2721}
.o{position:absolute}
.crumb{position:absolute;left:90px;right:90px;top:62px;font:700 26px JetBrains Mono;letter-spacing:.28em;color:#4a453b;padding-bottom:18px;border-bottom:3px solid #cfc6b0}
.crumb b{display:inline-block;width:14px;height:26px;background:#c8782f;margin-left:10px;position:relative;top:4px}
.kicker{position:absolute;left:94px;top:140px;font:700 24px JetBrains Mono;letter-spacing:.2em;color:#8a8270}
.title{position:absolute;left:92px;top:176px;font:800 64px JetBrains Mono;color:#2b2721}
.card{background:#f8f5ee;border:3px solid #2b2721;border-radius:12px;box-shadow:10px 12px 0 rgba(43,39,33,.13);padding:22px 28px}
.chip{display:inline-block;border:3px solid currentColor;border-radius:999px;padding:8px 22px;font:800 26px JetBrains Mono;background:#f8f5ee}
.mono{font:700 26px/1.55 JetBrains Mono}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes drop{0%{opacity:0;transform:translateY(-160px)}35%{opacity:1}70%{transform:translateY(8px)}85%{transform:translateY(-4px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:.18}}
@keyframes gone{from{opacity:1}to{opacity:0}}
@keyframes solid{from{opacity:.45}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
