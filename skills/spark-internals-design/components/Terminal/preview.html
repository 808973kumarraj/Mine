<!doctype html>
<html>
<head><meta charset="utf-8"><title>Terminal — preview</title><style>html,body{margin:0}</style></head>
<body>
<div id="root" class="si-paper si-sheet"></div>
<script>
  var S = window.SparkInternals, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'si-col', style: { width: '390px', maxWidth: '100%' } },
    h(S.Terminal, { command: 'df.groupBy("user_id").agg(count("*"))' }),
    h(S.Terminal, { command: 'spark.read.parquet("s3://events/")', typed: 0.6 })));
</script>
</body>
</html>
