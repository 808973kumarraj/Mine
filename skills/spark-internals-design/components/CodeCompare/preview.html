<head><meta charset="utf-8"><title>CodeCompare — preview</title><style>html,body{margin:0}</style></head>
<body>
<div id="root" class="si-paper si-sheet"></div>

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { width: '430px', maxWidth: '100%' } }, h(S.CodeCompare, {

</body>
