<!doctype html>
<html>
<head><meta charset="utf-8"><title>DataGrid — preview</title><style>html,body{margin:0}</style></head>
<body>
<div id="root" class="si-paper si-sheet"></div>
<script>
  var S = window.SparkInternals, h = React.createElement;
  var ctry = ['NL', 'DE', 'NL', 'US', 'FR', 'NL'];
  var rows = ctry.map(function (c, i) { var r = i + 1; return ['u' + (100 + r * 37), '12:0' + r, { v: c, tone: c === 'NL' ? 'green' : 'red' }, '€' + (10 + Math.floor(S.hash(r) * 90)), 'Mozilla']; });
  var cols = ['user_id', 'ts', 'country', 'amount', 'ua'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(S.DataGrid, { columns: cols, rows: rows, keepRows: [0, 2, 5], keepColumns: [0, 3] }),
    h(S.DataGrid, { columns: cols, rows: rows, keepRows: [0, 2, 5], keepColumns: [0, 3], filtered: true })));
</script>
</body>
</html>
