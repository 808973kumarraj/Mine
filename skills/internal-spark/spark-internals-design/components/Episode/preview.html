<!doctype html>
<html>
<head><meta charset="utf-8"><title>Episode — preview</title><style>html,body{margin:0}</style></head>
<body>
<div id="root" class="si-sheet is-stage"></div>
<script>
  var S = window.SparkInternals, h = React.createElement;
  var nodeX = function (i) { return 52 + i * 102; }, NW = 78, NH = 56, ND = 40, KEYS = ['key-1', 'key-2', 'key-3', 'key-4'];
  function node(K, i, y, t, o) { return K.box(nodeX(i), y, NW, NH, ND, Object.assign({ dividers: 1, vents: 5, leds: [K.C.green], label: 'EXEC ' + (i + 1), glow: 0.6 + 0.4 * Math.sin(t * 4 + i) }, o || {})); }
  function slabOn(K, q, ny) { var n = Math.floor(q / 4), s = q % 4, layer = Math.floor(s / 2), col = s % 2, p = K.boxGeo(nodeX(n), ny, NW, NH, ND).topPt(0.1 + col * 0.44, 0.3); return [p[0], p[1] - layer * 5]; }
  function keyOf(q) { return (q % 4 + Math.floor(q / 4)) % 4; }
  var segments = [
    { name: 'Parallel state', dur: 6.5, text: 'Reading is easy. Each executor grabs its own partitions and works alone. Pure parallelism. Nobody waits on anybody.',
      draw: function (K, t) {
        var E = K.ease, ny = 262; K.title(1, 'PARALLEL STATE', t);
        var left = 16 - Math.floor(K.clamp((t - 1.7) / 0.14 + 1, 0, 16));
        K.box(208, 108, 54, 12, 24, { color: K.C.platform, pattern: 'grey', shadowA: 0.1 });
        K.txt(String(left).padStart(2, '0'), 235, 96, K.F(800, 22), K.C.ink, 'center');
        K.txt('PARTITIONS', 235, 140, K.F(600, 8), K.C.muted, 'center');
        for (var i = 0; i < 4; i++) { var dl = 0.3 + i * 0.18, p = K.prog(t, dl, dl + 0.9); if (p > 0) node(K, i, ny - (1 - E.outBack(p)) * 170, t, { alpha: K.clamp(p * 4) }); }
        for (var q = 0; q < 16; q++) { var st = 1.7 + q * 0.14, sp = K.prog(t, st, st + 0.55); if (sp <= 0) continue; var tp = slabOn(K, q, ny); K.slab(K.lerp(222, tp[0], E.outCubic(sp)), K.lerp(118, tp[1], E.inCubic(sp)), K.C.slab); }
        if (t > 4.4) K.pill(235, 350, '4 EXECUTORS · ZERO COORDINATION', { bg: K.C.green, align: 'center', alpha: K.prog(t, 4.4, 4.8), dot: K.C['led-soft'] });
        K.terminal(40, 372, 390, 32, 'spark.read.parquet("s3://events/")', K.prog(t, 4.6, 5.9), t, K.prog(t, 4.5, 4.8));
      } },
    { beat: true, dur: 2.5, text: 'But every key has to meet its siblings.' },
    { name: 'Tagging', dur: 6.5, text: 'Grouping changes the rules. Every row is tagged with `hash(key) % N`, and the same key turns out to be scattered across every machine.',
      draw: function (K, t) {
        var ny = 262; K.title(2, 'TAGGING', t);
        for (var i = 0; i < 4; i++) node(K, i, ny, t);
        for (var q = 0; q < 16; q++) { var key = keyOf(q), st = 0.9 + q * 0.24, p = K.prog(t, st, st + 0.6), xy = slabOn(K, q, ny), z = p > 0 && p < 1 ? Math.sin(Math.PI * p) * 18 : 0, on = p > 0.45; K.slab(xy[0], xy[1] - z, on ? K.C[KEYS[key]] : K.C.slab, { topLabel: on ? 'k' + (key + 1) : '' }); }
        var la = K.prog(t, 4.9, 5.4);
        if (la > 0) { K.ctx.save(); K.ctx.globalAlpha *= la; var x = 40; for (var k = 0; k < 4; k++) x += K.pill(x, 346, 'k' + (k + 1), { bg: K.C[KEYS[k]], h: 16 }) + 6; K.txt('= hash(user_id) % 4', x + 4, 349, K.F(600, 9), K.C.muted); K.ctx.restore(); }
        K.terminal(40, 372, 390, 32, 'df.groupBy("user_id").count()', K.prog(t, 0.3, 1.6), t, K.prog(t, 0.1, 0.4));
        if (t > 5.5) K.pill(235, 114, 'KEY k1 LIVES ON ALL 4 EXECUTORS', { bg: K.C.red, align: 'center', alpha: K.prog(t, 5.5, 5.9) });
      } }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(S.Episode, { series: 'Spark Internals', episode: 7, segments: segments }));
</script>
</body>
</html>
