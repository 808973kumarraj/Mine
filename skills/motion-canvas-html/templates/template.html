<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Scene</title>
<style>
  :root{--bg:#f4f4f2;--fg:#1c1c1c;--muted:#666;--panel:#fff;--line:#ddd;--accent:#2f6fde}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#eee;--muted:#999;--panel:#1d1d1d;--line:#333;--accent:#6ea0ff}}
  :root[data-theme="dark"]{--bg:#121212;--fg:#eee;--muted:#999;--panel:#1d1d1d;--line:#333;--accent:#6ea0ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
  h1{font-size:16px;font-weight:600;margin:0;align-self:flex-start;max-width:1100px;width:100%;margin-inline:auto}
  .stage{width:100%;max-width:1100px;background:#000;border-radius:8px;overflow:hidden}
  canvas{display:block;width:100%;height:auto}
  .bar{width:100%;max-width:1100px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
  button{font:inherit;background:none;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;min-width:44px;min-height:36px}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
  .time{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<h1 id="title">Motion Scene</h1>
<div class="stage"><canvas id="c" width="1920" height="1080" aria-label="Animation"></canvas></div>
<div class="bar">
  <button id="play" aria-label="Play">▶</button>
  <button id="restart" aria-label="Restart">⟲</button>
  <input id="seek" type="range" min="0" value="0" step="1" aria-label="Seek">
  <span class="time" id="time">0.00 / 0.00s</span>
  <button id="rec" aria-label="Record WebM">● Rec</button>
</div>
<script>
/* ===== Motion runtime (generator-based, Motion Canvas–style). Do not edit. ===== */
const MC = (() => {
  const easing = {
    linear: t => t,
    easeInCubic: t => t * t * t,
    easeOutCubic: t => 1 - Math.pow(1 - t, 3),
    easeInOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    easeInOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    easeOutBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    easeOutElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1,
    easeOutBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; },
  };
  let FPS = 60;
  const hex = c => { let h = c.slice(1); if (h.length === 3) h = [...h].map(x => x + x).join(''); const n = parseInt(h.slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1]; };
  const isColor = s => /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(s);
  function lerp(a, b, t) {
    if (typeof a === 'number' && typeof b === 'number') return a + (b - a) * t;
    if (typeof a === 'string' && typeof b === 'string') {
      if (isColor(a) && isColor(b)) { const A = hex(a), B = hex(b); const m = A.map((x, i) => x + (B[i] - x) * t); return `rgba(${m[0] | 0},${m[1] | 0},${m[2] | 0},${m[3].toFixed(3)})`; }
      const n = Math.round(t * (a.length + b.length)); // typewriter: erase a, type b
      return n < a.length ? a.slice(0, a.length - n) : b.slice(0, n - a.length);
    }
    if (Array.isArray(a) && Array.isArray(b)) return b.map((x, i) => lerp(a[Math.min(i, a.length - 1)] ?? x, x, t));
    return t < 1 ? a : b;
  }
  function signal(init) {
    let v = init;
    const s = function (nv, dur, ease = easing.easeInOutCubic) {
      if (arguments.length === 0) return typeof v === 'function' ? v() : v;
      if (dur === undefined) { v = nv; return s; }
      return (function* () {
        const from = s(), target = typeof nv === 'function' ? nv() : nv, n = Math.max(1, Math.round(dur * FPS));
        for (let i = 1; i <= n; i++) { v = lerp(from, target, ease(i / n)); if (i < n) yield; }
        v = nv; yield;
      })();
    };
    return s;
  }
  function* waitFor(sec) { const n = Math.round(sec * FPS); for (let i = 0; i < n; i++) yield; }
  function* all(...ts) { let g = ts; while (true) { g = g.filter(x => !x.next().done); if (!g.length) return; yield; } }
  function* any(...ts) { while (true) { for (const x of ts) if (x.next().done) return; yield; } }
  function* chain(...ts) { for (const t of ts) yield* (typeof t === 'function' ? t() : t); }
  const delay = (sec, t) => chain(waitFor(sec), t);
  const sequence = (gap, ...ts) => all(...ts.map((t, i) => delay(i * gap, t)));
  function* loop(n, fn) { for (let i = 0; i < n; i++) yield* fn(i); }

  const BASE = { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1 };
  class Node {
    constructor(props = {}, defaults = {}) {
      this.children = [];
      const all = { ...BASE, ...defaults, ...props };
      for (const k in all) if (k !== 'children') this[k] = signal(all[k]);
      (props.children || []).forEach(c => this.add(c));
    }
    add(...c) { c.forEach(n => { n.parent = this; this.children.push(n); }); return this; }
    remove() { if (this.parent) this.parent.children = this.parent.children.filter(n => n !== this); }
    position(xy, d, e) { if (!arguments.length) return [this.x(), this.y()]; if (d === undefined) { this.x(xy[0]); this.y(xy[1]); return this; } return all(this.x(xy[0], d, e), this.y(xy[1], d, e)); }
    render(ctx) {
      if (this.opacity() <= 0) return;
      ctx.save(); ctx.translate(this.x(), this.y()); ctx.rotate(this.rotation() * Math.PI / 180);
      const s = this.scale(); Array.isArray(s) ? ctx.scale(s[0], s[1]) : ctx.scale(s, s);
      ctx.globalAlpha *= this.opacity();
      this.draw(ctx); this.children.forEach(c => c.render(ctx)); ctx.restore();
    }
    draw() {}
    paint(ctx) {
      const f = this.fill?.(), st = this.stroke?.(), lw = this.lineWidth?.() ?? 0;
      if (f) { ctx.fillStyle = f; ctx.fill(); }
      if (st && lw > 0) { ctx.strokeStyle = st; ctx.lineWidth = lw; ctx.stroke(); }
    }
  }
  class Group extends Node {}
  class Rect extends Node {
    constructor(p) { super(p, { width: 100, height: 100, fill: '#ffffff', stroke: null, lineWidth: 0, radius: 0 }); }
    draw(ctx) { const w = this.width(), h = this.height(); ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, Math.min(this.radius(), w / 2, h / 2)); this.paint(ctx); }
  }
  class Circle extends Node {
    constructor(p) { super(p, { size: 100, fill: '#ffffff', stroke: null, lineWidth: 0, start: 0, end: 1 }); }
    draw(ctx) {
      const r = this.size() / 2, a0 = this.start() * 2 * Math.PI - Math.PI / 2, a1 = this.end() * 2 * Math.PI - Math.PI / 2;
      ctx.beginPath(); if (this.end() - this.start() < 1) ctx.moveTo(0, 0); ctx.arc(0, 0, Math.max(0, r), a0, a1); if (this.end() - this.start() < 1) ctx.closePath(); this.paint(ctx);
    }
  }
  class Txt extends Node {
    constructor(p) { super(p, { text: '', fontSize: 64, fill: '#ffffff', fontFamily: 'system-ui, sans-serif', fontWeight: 600, align: 'center' }); }
    draw(ctx) {
      ctx.font = `${this.fontWeight()} ${this.fontSize()}px ${this.fontFamily()}`; ctx.textAlign = this.align(); ctx.textBaseline = 'middle'; ctx.fillStyle = this.fill();
      String(this.text()).split('\n').forEach((l, i, a) => ctx.fillText(l, 0, (i - (a.length - 1) / 2) * this.fontSize() * 1.2));
    }
  }
  class Line extends Node {
    constructor(p) { super(p, { points: [[0, 0], [100, 0]], stroke: '#ffffff', lineWidth: 8, start: 0, end: 1, arrow: false, closed: false, fill: null }); }
    draw(ctx) {
      const pts = this.points(); if (this.closed()) pts.push(pts[0]);
      const seg = []; let L = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
      const a = this.start() * L, b = this.end() * L; if (b <= a) return;
      const at = d => { let acc = 0; for (let i = 0; i < seg.length; i++) { if (acc + seg[i] >= d) { const t = seg[i] ? (d - acc) / seg[i] : 0; return [lerp(pts[i][0], pts[i + 1][0], t), lerp(pts[i][1], pts[i + 1][1], t), i]; } acc += seg[i]; } const p = pts[pts.length - 1]; return [p[0], p[1], seg.length - 1]; };
      const P = at(a), Q = at(b); ctx.beginPath(); ctx.moveTo(P[0], P[1]);
      for (let i = P[2] + 1; i <= Q[2]; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.lineTo(Q[0], Q[1]);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (this.fill() && this.end() >= 1 && this.start() <= 0) { ctx.fillStyle = this.fill(); ctx.fill(); }
      ctx.strokeStyle = this.stroke(); ctx.lineWidth = this.lineWidth(); ctx.stroke();
      if (this.arrow()) { const prev = at(Math.max(a, b - 1)), ang = Math.atan2(Q[1] - prev[1], Q[0] - prev[0]), s = this.lineWidth() * 3;
        ctx.beginPath(); ctx.moveTo(Q[0], Q[1]); ctx.lineTo(Q[0] - s * Math.cos(ang - .45), Q[1] - s * Math.sin(ang - .45)); ctx.lineTo(Q[0] - s * Math.cos(ang + .45), Q[1] - s * Math.sin(ang + .45)); ctx.closePath(); ctx.fillStyle = this.stroke(); ctx.fill(); }
    }
  }
  class View extends Node { constructor() { super({}, { fill: '#141414' }); } }

  function createPlayer({ scene, fps = 60, maxSeconds = 60, title }) {
    FPS = fps;
    const cv = document.getElementById('c'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    const $ = id => document.getElementById(id), seek = $('seek'), playB = $('play');
    if (title) { $('title').textContent = title; document.title = title; }
    let view, gen, frame, done;
    const reset = () => { view = new View(); gen = scene(view); frame = 0; done = false; step(); };
    const step = () => { if (!done && gen.next().done) done = true; };
    const draw = () => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = view.fill(); ctx.fillRect(0, 0, W, H); ctx.translate(W / 2, H / 2); view.render(ctx); };
    // measure duration
    reset(); let total = 0; while (!done && total < maxSeconds * fps) { step(); total++; }
    seek.max = total;
    const goto = f => { f = Math.max(0, Math.min(total, f)); if (f < frame) reset(); while (frame < f) { step(); frame++; } draw(); seek.value = frame; $('time').textContent = `${(frame / fps).toFixed(2)} / ${(total / fps).toFixed(2)}s`; };
    reset(); goto(0);
    let playing = false, t0 = 0, f0 = 0, onEnd = null;
    const tick = now => { if (!playing) return; const f = f0 + Math.floor((now - t0) / 1000 * fps); goto(f); if (f >= total) { setPlay(false); onEnd && onEnd(); } else requestAnimationFrame(tick); };
    const setPlay = p => { playing = p; playB.textContent = p ? '❚❚' : '▶'; playB.setAttribute('aria-label', p ? 'Pause' : 'Play'); if (p) { if (frame >= total) goto(0); t0 = performance.now(); f0 = frame; requestAnimationFrame(tick); } };
    playB.onclick = () => setPlay(!playing);
    $('restart').onclick = () => { goto(0); setPlay(true); };
    seek.oninput = () => { setPlay(false); goto(+seek.value); };
    document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); setPlay(!playing); } });
    $('rec').onclick = () => {
      if (!window.MediaRecorder || !cv.captureStream) { alert('Recording is not supported in this browser.'); return; }
      const rec = new MediaRecorder(cv.captureStream(fps), { mimeType: 'video/webm' }), chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = (title || 'scene') + '.webm'; a.click(); $('rec').textContent = '● Rec'; };
      $('rec').textContent = 'Recording…'; goto(0); rec.start(); onEnd = () => { onEnd = null; setTimeout(() => rec.stop(), 200); }; setPlay(true);
    };
    if (new URLSearchParams(location.search).has('autoplay')) setPlay(true);
    return { goto, total };
  }
  return { easing, signal, waitFor, all, any, chain, delay, sequence, loop, Node, Group, Rect, Circle, Txt, Line, createPlayer };
})();
/* ===== end runtime ===== */
</script>
<script>
/* ===== SCENE START — replace everything in this script ===== */
const { Rect, Circle, Txt, Line, Group, all, sequence, chain, waitFor, loop, easing, signal } = MC;

MC.createPlayer({
  title: 'Hello Motion',
  scene: function* (view) {
    view.fill('#141414');
    const box = new Rect({ width: 0, height: 240, radius: 24, fill: '#e6a700' });
    const dot = new Circle({ size: 0, fill: '#68abdf', x: -500 });
    const label = new Txt({ text: '', fontSize: 96, fill: '#ffffff', y: 300 });
    view.add(box, dot, label);

    yield* box.width(240, 0.8, easing.easeOutBack);
    yield* all(dot.size(160, 0.6), label.text('Motion in one file', 1.2, easing.linear));
    yield* sequence(0.15, box.rotation(180, 1), box.fill('#ff6470', 1), dot.x(500, 1));
    yield* loop(2, () => chain(dot.y(-200, 0.4), dot.y(0, 0.4, easing.easeOutBounce)));
    yield* waitFor(0.5);
    yield* all(box.opacity(0, 0.6), dot.scale(0, 0.6), label.opacity(0, 0.6));
  },
});
/* ===== SCENE END ===== */
</script>
</body>
</html>
