<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spark Performance 03 · Shuffling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans&family=Silkscreen&family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --ink:#201e12; --paper:#f0eee1; --mut:#8d8b7e; --mut2:#a9a799; --line:#26241a;
  --face:#f1eee2; --face2:#e6e2d3; --face3:#dcd8c8;
  --blue:#27418f; --green:#3c7a62; --green2:#2f6a52; --red:#a13e2e; --orange:#c68948;
  --term:#1f1d14; --page:#e4e1d6; --barfg:#2a281c; --barbg:#f3f1e7;
}
@media (prefers-color-scheme:dark){ :root{ --page:#12110d; --barfg:#e9e5d6; --barbg:#1d1b15; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
#wrap{position:absolute;left:0;top:0;overflow:hidden;border-radius:6px}
/* #stage is the visible frame (1080 x 1050); #world is the 1080 x 1920 drawing surface the scenes are laid out on,
   shifted up so the frame shows the header and the graphics area with no empty space around them */
#stage{position:absolute;left:0;top:0;width:1080px;height:1050px;overflow:hidden;background:var(--paper);transform-origin:0 0;color:var(--ink);user-select:none}
#world{position:absolute;left:0;top:-150px;width:1080px;height:1920px}
.dev #stage{height:1920px}.dev #world{top:0}
.paper{position:absolute;inset:0;background:
  radial-gradient(ellipse 1010px 1190px at 540px 700px, rgba(40,36,10,0) 0%, rgba(40,36,10,.045) 50%, rgba(40,36,10,.17) 100%),
  linear-gradient(rgba(50,46,20,.05) 1px, transparent 1px) 0 12px/24px 24px,
  linear-gradient(90deg, rgba(50,46,20,.05) 1px, transparent 1px) 12px 0/24px 24px,
  var(--paper)}
#scenes,.scene{position:absolute;inset:0}
.scene{visibility:hidden}
.abs{position:absolute}
.mono{font-family:'IBM Plex Mono',monospace}
.sm{font-family:'Space Mono',monospace;font-weight:700}

/* header */
#hdr{position:absolute;left:67px;top:196px;height:30px;font:400 25.5px/30px 'Silkscreen',monospace;letter-spacing:3.9px;color:#5d5b4e;white-space:pre}
#hdrcur{display:inline-block;width:10px;height:22px;background:var(--orange);vertical-align:-2px;margin-left:2px}
#rule{position:absolute;left:66px;top:234px;width:948px;height:2px;background:#c9c7ba}
#prog{position:absolute;left:0;top:-1.5px;height:4px;width:0;background:#34467f}

/* poster */
#poster{position:absolute;inset:0;border:0;padding:0;background:rgba(240,238,225,.55);cursor:pointer;display:flex;align-items:center;justify-content:center}
#poster span{width:190px;height:190px;border-radius:50%;background:var(--term);box-shadow:0 18px 40px rgba(30,26,10,.4);position:relative}
#poster span::after{content:'';position:absolute;left:74px;top:52px;border-left:66px solid #f0eee1;border-top:43px solid transparent;border-bottom:43px solid transparent}
.started #poster,.dev #poster{display:none}

/* player bar */
#bar{position:absolute;left:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--barfg);background:var(--barbg);
  font:500 13px 'IBM Plex Mono',monospace;border-radius:6px}
#bar button{appearance:none;border:1px solid color-mix(in srgb,var(--barfg) 35%,transparent);background:transparent;color:inherit;font:inherit;
  height:30px;min-width:34px;padding:0 9px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
#scrub{flex:1;min-width:40px;accent-color:#34467f}
#clock{font-variant-numeric:tabular-nums;white-space:nowrap}
.dev #bar{display:none}
.dev #wrap{border-radius:0}

/* shared pieces */
.pill{position:absolute;display:flex;align-items:center;justify-content:center;white-space:pre;border-radius:999px;font:500 25px/1 'IBM Plex Mono',monospace;letter-spacing:1px}
.pill.ok{border:2px solid #55806b;background:#e9ecdf;color:#3f6e58;box-shadow:0 3px 8px rgba(40,50,30,.18)}
.pill.bad{border:2px solid #a65a45;background:#f1e6dc;color:#96402e;box-shadow:0 3px 8px rgba(60,30,20,.18)}
.ttl{position:absolute;font:700 44px/1 'Space Mono',monospace;color:var(--ink);white-space:pre}
.ttl.big{font-size:47.5px}
.step{position:absolute;font:400 26px/1 'IBM Plex Mono',monospace;letter-spacing:3.6px;color:var(--mut2);white-space:pre}
.cap{position:absolute;font:400 24px/1 'IBM Plex Mono',monospace;letter-spacing:3.1px;color:var(--mut);white-space:pre;text-align:center}
.ctr{left:0;width:1080px;text-align:center}
svg{position:absolute;left:0;top:0;overflow:visible}

/* scene 1 */
#s1num{top:274px;font:700 128px/1 'Space Mono',monospace;letter-spacing:0}
#s1cap{top:413px}
#s1grid{left:0;top:0;width:1080px;height:1920px;clip-path:inset(0 65px 0 65px);filter:drop-shadow(13px 17px 9px rgba(52,46,24,.2))}
#s1grid polygon{stroke:#2a281c;stroke-width:1.25;stroke-linejoin:round}
#s1chip{left:192px;top:533px;width:696px;height:95px;background:var(--term);color:#ebe6d4;font:400 38px/95px 'IBM Plex Mono',monospace;padding-left:31px;white-space:pre;
  box-shadow:0 18px 26px rgba(20,18,8,.34);transform-origin:50% 50%}
#s1chip i{font-style:normal;color:#aeaae6}
#s1job{left:0;top:0;width:760px;height:287px;background:#eeebdd;border:2.5px solid var(--line);border-radius:9px;box-shadow:0 14px 26px rgba(30,26,10,.25)}
#s1job .k{left:42px;top:38px;font:400 21px/1 'IBM Plex Mono',monospace;letter-spacing:3px;color:var(--mut)}
#s1job .n{left:40px;top:98px;font:700 45px/1 'Space Mono',monospace}
#s1job .tm{right:40px;top:92px;font:700 52px/1 'Space Mono',monospace;color:#3f7a63}
#s1job .barw{left:40px;top:188px;width:680px;height:42px;border:2.5px solid var(--line);border-radius:4px;overflow:hidden;background:#e7e3d4}
#s1job .barf{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(-55deg,#3f7a63 0 13px,#4f8a73 13px 26px)}
#s1job .run{left:40px;top:250px;font:400 22px/1 'IBM Plex Mono',monospace;color:#4f7f6b}
#s1job .pct{right:40px;top:250px;font:400 22px/1 'IBM Plex Mono',monospace;color:var(--mut)}

.dot{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:currentColor;vertical-align:.12em;margin-right:.6em}
svg.chk{position:static;width:.82em;height:.82em;vertical-align:-.08em;margin-right:.4em}
/* scene 8 */
.rec{width:596px;height:197px;border:2.5px solid var(--line);border-radius:10px;background:#eeebdd;box-shadow:0 12px 22px rgba(30,26,10,.2);font:400 27px/1 'IBM Plex Mono',monospace}
.rec .k{position:absolute;left:26px;top:27px;font-size:21px;letter-spacing:3.4px;color:#a09e90;white-space:pre}
.rec .r{position:absolute;left:26px;white-space:pre}
.rec .r span{color:#8d8b7e}.rec .r b{position:absolute;left:150px;font-weight:400;color:var(--ink)}.rec .r b.in{color:#27418f;font-weight:600}
#s8cost{left:703px;top:257px;width:262px;height:228px;border:2.5px solid var(--line);border-radius:11px;background:#eeebdd;box-shadow:0 12px 22px rgba(30,26,10,.22)}
#s8cost .cb{left:19px;top:50px;width:223px;height:17px;border:2px solid var(--line);border-radius:3px;background:#e9e6d9;overflow:hidden}
#s8cost .cb i{position:absolute;left:0;top:0;bottom:0;width:0;background:#a5432e}
#s8cost .ci{left:19px;height:22px;font:400 20.5px/22px 'IBM Plex Mono',monospace;color:#cfccbe;white-space:pre}
#s8cost .ci u{position:absolute;left:0;top:0;width:22px;height:22px;border:2px solid #c9c6b8;border-radius:3px;text-decoration:none}
#s8cost .ci u::after{content:'';position:absolute;inset:0;background:#a8442f;opacity:var(--f,0)}
#s8cost .ci span{position:absolute;left:34px}
#s8cost .ci.on{color:var(--ink)}#s8cost .ci.on u{border-color:var(--line)}

#bplay i{display:block;width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.playing #bplay i{width:11px;height:13px;border:0;border-left:4px solid currentColor;border-right:4px solid currentColor;margin-left:0}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="world">
    <div class="paper"></div>
    <div id="scenes"></div>
    <div id="hdr"><span id="hdrtxt"></span><span id="hdrcur"></span></div>
    <div id="rule"><i id="prog"></i></div>
    </div>
    <button id="poster" aria-label="Play"><span></span></button>
  </div>
</div>
<div id="bar">
  <button id="bplay" aria-label="Play or pause"><i></i></button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
  <span id="clock">0:00 / 1:20</span>
  <button id="bspeed" aria-label="Playback speed">1x</button>
</div>
<script>
'use strict';
/* Everything on screen is a pure function of time `t` (seconds),
   so play, pause and scrubbing in either direction always show the same frame. */
const T = 80.4667;
const stage = document.getElementById('stage');
const STAGE_W = 1080, STAGE_H = 1050;          // visible frame; the scenes use 1080 x 1920 coordinates (see #world)
const scenesEl = document.getElementById('scenes');
const DEV = /[?&]dev\b/.test(location.search);
if (DEV) document.documentElement.classList.add('dev');

const drivers = [];                       // (t) => void, run after the timeline renders

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const E = {
  in2: p => p * p, out2: p => 1 - (1 - p) * (1 - p), io2: p => p < .5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p),
  in3: p => p * p * p, out3: p => 1 - Math.pow(1 - p, 3), io3: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  out4: p => 1 - Math.pow(1 - p, 4), out5: p => 1 - Math.pow(1 - p, 5),
  back: p => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
};
const fmtInt = n => Math.round(n).toLocaleString('en-US');

/* ---------- timeline ----------
   tl.to / tl.fromTo / tl.set register how an element's properties change at absolute times (seconds).
   Nothing here keeps running state: tl.time(t) works every property out from that list for time t and
   writes it to the element, so the same t always gives the same frame.
   Properties: x, y, scale, scaleX, scaleY, rotation, rotationX, rotationY (composed into `transform`),
   opacity, autoAlpha (opacity that also hides the element at 0), blur, zIndex, width, left,
   backgroundColor, borderColor and attr:{...} for SVG attributes. */
const EASE = {
  none: p => p,
  'power1.in': p => p * p, 'power1.out': p => 1 - (1 - p) * (1 - p), 'power1.inOut': p => p < .5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p),
  'power2.in': p => p * p * p, 'power2.out': p => 1 - Math.pow(1 - p, 3), 'power2.inOut': p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
};
function easeOf(name) {
  if (!name) return EASE['power1.out'];
  const m = /^back\.out\(([\d.]+)\)$/.exec(name);                 // overshoots, then settles
  if (m) { const s = +m[1]; return p => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); }
  return EASE[name];
}
const tl = (() => {
  const items = new Map();                                        // element -> { el, ch: { property: [segments] }, out: {} }
  const TRANSFORM = { x: 0, y: 0, scale: 1, scaleX: 1, scaleY: 1, rotation: 0, rotationX: 0, rotationY: 0 };
  const COLOR = { backgroundColor: 1, borderColor: 1 };
  let ready = false;
  const rgba = s => {                                             // '#rrggbb' or 'rgb(a)(r, g, b[, a])' -> [r, g, b, a]
    if (s[0] === '#') return [1, 3, 5].map(i => parseInt(s.substr(i, 2), 16)).concat(1);
    const v = s.match(/[\d.]+/g).map(Number); return [v[0], v[1], v[2], v.length > 3 ? v[3] : 1];
  };
  function add(el, from, to, at) {
    let it = items.get(el); if (!it) items.set(el, it = { el, ch: {}, out: {} });
    const dur = to.duration || 0, ease = easeOf(to.ease);
    const seg = (name, f, t, d) => (it.ch[name] || (it.ch[name] = [])).push({ t0: at, t1: at + d, from: f, to: t, ease });
    for (const k of new Set(Object.keys(from || {}).concat(Object.keys(to)))) {
      const f = from && k in from ? from[k] : undefined;
      if (k === 'duration' || k === 'ease') continue;
      if (k === 'transformOrigin') it.origin = to[k];
      else if (k === 'svgOrigin') it.origin = (f || to[k]).split(' ').map(v => v + 'px').join(' ');
      else if (k === 'transformPerspective') it.persp = to[k];
      else if (k === 'attr') for (const a in to.attr) seg('attr:' + a, undefined, to.attr[a], dur);
      else if (k in to) { if (k === 'autoAlpha') it.auto = true; seg(k === 'autoAlpha' ? 'opacity' : k, f, to[k], dur); }
      else { if (k === 'autoAlpha') it.auto = true; seg(k === 'autoAlpha' ? 'opacity' : k, f, f, 0); }   // given only as a start value: just set it
    }
    ready = false;
  }
  const at = (s, t) => t >= s.t1 ? s.to : mix(s.start, s.to, s.ease((t - s.t0) / (s.t1 - s.t0)));
  const mix = (a, b, p) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * p) : a + (b - a) * p;
  function value(list, t) {                                       // the last change that has started by time t decides the value
    let v = list.init;
    for (const s of list) { if (s.t0 > t) break; v = at(s, t); }
    return v;
  }
  function prepare() {                                            // once: sort, and give every change its starting value
    for (const it of items.values()) {
      const cs = getComputedStyle(it.el);
      if (it.origin) it.el.style.transformOrigin = it.origin;
      for (const name in it.ch) {
        const list = it.ch[name].sort((a, b) => a.t0 - b.t0), col = name in COLOR;
        if (col) for (const s of list) { s.to = rgba(s.to); if (s.from !== undefined) s.from = rgba(s.from); }
        list.init = list[0].from !== undefined ? list[0].from
          : name in TRANSFORM ? TRANSFORM[name]
          : name === 'blur' ? 0
          : name.startsWith('attr:') ? parseFloat(it.el.getAttribute(name.slice(5)))
          : col ? rgba(cs[name === 'borderColor' ? 'borderTopColor' : name])
          : parseFloat(cs[name]) || 0;                            // opacity, zIndex, width, left: whatever the stylesheet says
        list.forEach((s, i) => { s.start = s.from !== undefined ? s.from : value(Object.assign(list.slice(0, i), { init: list.init }), s.t0); });
      }
    }
    ready = true;
  }
  function time(t) {
    if (!ready) prepare();
    for (const it of items.values()) {
      const v = {}, st = it.el.style, out = it.out; let tf = false;
      for (const name in it.ch) { v[name] = value(it.ch[name], t); if (name in TRANSFORM) tf = true; }
      const put = (key, val, write) => { if (out[key] !== val) { out[key] = val; write(val); } };   // only touch the DOM when something changed
      if (tf) {
        const g = k => k in v ? v[k] : TRANSFORM[k], sx = g('scale') * g('scaleX'), sy = g('scale') * g('scaleY');
        const x = g('x'), y = g('y'), r = g('rotation'), ry = g('rotationY'), rx = g('rotationX');
        let s = '';
        if (x || y) s += ` translate(${x.toFixed(3)}px,${y.toFixed(3)}px)`;
        if (r) s += ` rotate(${r.toFixed(3)}deg)`;
        if (ry) s += ` rotateY(${ry.toFixed(3)}deg)`;
        if (rx) s += ` rotateX(${rx.toFixed(3)}deg)`;
        if (sx !== 1 || sy !== 1) s += ` scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
        if (s && it.persp && (rx || ry)) s = ` perspective(${it.persp}px)` + s;
        put('transform', s ? s.slice(1) : 'none', val => { st.transform = val; });
      }
      for (const name in v) {
        const x = v[name];
        if (name in TRANSFORM) continue;
        if (name === 'opacity') { put('opacity', +x.toFixed(4), s => { st.opacity = s; }); if (it.auto) put('vis', x === 0 ? 'hidden' : 'inherit', s => { st.visibility = s; }); }
        else if (name === 'blur') put('blur', x > 0.01 ? `blur(${x.toFixed(2)}px)` : 'none', s => { st.filter = s; });
        else if (name === 'zIndex') put('z', Math.round(x), s => { st.zIndex = s; });
        else if (name in COLOR) put(name, `rgba(${x.slice(0, 3).map(Math.round).join(',')},${+x[3].toFixed(3)})`, s => { st[name] = s; });
        else if (name.startsWith('attr:')) put(name, +x.toFixed(4), s => { it.el.setAttribute(name.slice(5), s); });
        else put(name, x.toFixed(2) + 'px', s => { st[name] = s; });
      }
    }
  }
  return {
    to: (el, vars, t) => add(el, null, vars, t),
    fromTo: (el, from, vars, t) => add(el, from, vars, t),
    set: (el, vars, t) => add(el, null, vars, t),               // an instant change at time t (no duration)
    time,
  };
})();

function h(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
/* A scene is a full-stage layer shown only between t0 and t1. */
function scene(id, t0, t1) {
  const el = h('div', 'scene', scenesEl); el.id = id;
  drivers.push(t => { el.style.visibility = (t >= t0 && t < t1) ? 'visible' : 'hidden'; });
  return el;
}
/* Typewriter: text revealed at `cps` chars per second from t0. */
function typed(el, text, t0, cps) {
  let last = -1;
  drivers.push(t => {
    const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
    if (n !== last) { el.textContent = text.slice(0, n); last = n; }
  });
}
/* show/hide helpers on the master timeline (opacity + small motion) */
function fadeIn(el, t, d = .3, from = {}) {
  tl.fromTo(el, Object.assign({ autoAlpha: 0 }, from), { autoAlpha: 1, x: 0, y: 0, scale: 1, rotation: 0, duration: d, ease: 'power2.out' }, t);
}
function fadeOut(el, t, d = .25, to = {}) {
  tl.to(el, Object.assign({ autoAlpha: 0, duration: d, ease: 'power1.in' }, to), t);
}
function pop(el, t, d = .35) {
  tl.fromTo(el, { autoAlpha: 0, scale: .6 }, { autoAlpha: 1, scale: 1, duration: d, ease: 'back.out(2)' }, t);
}

/* ---------- tiny 3D projector (for SVG-drawn solids) ----------
   Plane coords (u,v) with z up; rotate in-plane by rz, tilt back by rx, then perspective. */
function camera({ rx, rz, P, cx, cy, k = 1 }) {
  const cz = Math.cos(rz * Math.PI / 180), sz = Math.sin(rz * Math.PI / 180);
  const cxr = Math.cos(rx * Math.PI / 180), sxr = Math.sin(rx * Math.PI / 180);
  return (u, v, z = 0) => {
    const x1 = (u * cz - v * sz) * k, y1 = (u * sz + v * cz) * k, zz = z * k;
    const y2 = y1 * cxr - zz * sxr, z2 = y1 * sxr + zz * cxr;
    const f = P / (P - z2);
    return [cx + x1 * f, cy + y2 * f, z2];
  };
}
const pts = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

/* CSS matrix3d that maps a w x h box (origin 0 0) onto the quad p = [TL, TR, BR, BL] (stage px). */
function quadMatrix(w, hh, p) {
  const [x0, y0] = p[0], [x1, y1] = p[1], [x2, y2] = p[2], [x3, y3] = p[3];
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1, g = (dx3 * dy2 - dx2 * dy3) / den, k = (dx1 * dy3 - dx3 * dy1) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + k * x3, d = y1 - y0 + g * y1, e = y3 - y0 + k * y3;
  const f = v => +v.toFixed(7);
  return `matrix3d(${f(a / w)},${f(d / w)},0,${f(g / w)},${f(b / hh)},${f(e / hh)},0,${f(k / hh)},0,0,1,0,${f(x0)},${f(y0)},0,1)`;
}
/* Apply the homography H (from quadMatrix inputs) to a local point: where does (x,y) of the box land on stage? */
function quadPoint(w, hh, p, x, y) {
  const [x0, y0] = p[0], [x1, y1] = p[1], [x2, y2] = p[2], [x3, y3] = p[3];
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;

/* ---------- player: clock and controls ---------- */
(() => {
  const root = document.documentElement, wrap = document.getElementById('wrap'), bar = document.getElementById('bar');
  const bplay = document.getElementById('bplay'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
  const bspeed = document.getElementById('bspeed'), poster = document.getElementById('poster');
  const POSTER_T = 3.2;                    // frame shown under the play button before the first play
  let t = 0, playing = false, rate = 1, last = 0, scrubbing = false, posterMode = !DEV;
  const RATES = [1, 1.25, 1.5, 0.75];

  function render(time) {
    t = clamp(time, 0, T);
    tl.time(t);
    for (const d of drivers) d(t);
    const shown = posterMode ? 0 : t;
    if (!scrubbing) scrub.value = Math.round(shown / T * 1000);
    const m = x => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
    clock.textContent = m(shown) + ' / ' + m(T);
  }
  function setPlaying(p) { playing = p; root.classList.toggle('playing', p); }
  function seek(x) { posterMode = false; render(clamp(x, 0, T)); }
  function toggle() {
    root.classList.add('started');
    if (posterMode || (!playing && t >= T - 0.05)) seek(0);
    setPlaying(!playing);
  }
  function tick(ts) {
    if (playing) {
      const nt = t + Math.min(0.1, (ts - last) / 1000) * rate;
      if (nt >= T) { render(T); setPlaying(false); } else render(nt);
    }
    last = ts;
    requestAnimationFrame(tick);
  }

  /* layout: scale the stage to the window, bar underneath */
  function fit() {
    const SH = DEV ? 1920 : STAGE_H, barH = DEV ? 0 : 52, W = innerWidth, H = innerHeight;
    const k = DEV ? 1 : Math.min(W / STAGE_W, (H - barH) / SH);
    const w = STAGE_W * k, hh = SH * k, x = (W - w) / 2, y = DEV ? 0 : Math.max(0, (H - barH - hh) / 2);
    wrap.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${hh}px`;
    stage.style.transform = `scale(${k})`;
    const bw = Math.max(w, Math.min(W, 300));
    bar.style.cssText = `left:${(W - bw) / 2}px;top:${y + hh + 4}px;width:${bw}px`;
  }
  addEventListener('resize', fit); fit();

  bplay.onclick = toggle; poster.onclick = toggle;
  stage.addEventListener('click', e => { if (e.target !== poster && !poster.contains(e.target) && root.classList.contains('started')) toggle(); });
  scrub.addEventListener('input', () => { scrubbing = true; root.classList.add('started'); seek(scrub.value / 1000 * T); });
  scrub.addEventListener('change', () => { scrubbing = false; });
  bspeed.onclick = () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; bspeed.textContent = rate + 'x'; };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') seek(t + 2);
    else if (e.code === 'ArrowLeft') seek(t - 2);
  });

  window.__seek = x => { posterMode = false; render(x); return true; };
  window.__state = () => ({ t, playing, posterMode });
  /* start once the linked fonts are in (or after 2.5s without them: the page still works with fallback fonts) */
  const boot = () => { render(posterMode ? POSTER_T : 0); requestAnimationFrame(tick); };
  const FONTS = ["400 20px 'IBM Plex Mono'", "500 20px 'IBM Plex Mono'", "600 20px 'IBM Plex Mono'", "400 20px 'IBM Plex Sans'", "400 20px 'Silkscreen'", "700 20px 'Space Grotesk'", "700 20px 'Space Mono'"];
  const loaded = document.fonts && document.fonts.load ? Promise.all(FONTS.map(f => document.fonts.load(f, 'A₹'))).catch(() => {}) : Promise.resolve();
  Promise.race([loaded, new Promise(r => setTimeout(r, 2500))]).then(boot);
})();
