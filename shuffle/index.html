<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Shuffle</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400&family=Silkscreen&family=Space+Mono:wght@400;700&family=Archivo:wdth,wght@75,800;100,800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #E4E1D4; overflow: hidden }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
  .hdr { font-family: 'Silkscreen', monospace; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .space { font-family: 'Space Mono', monospace; font-weight: 700; }
  .sans { font-family: 'IBM Plex Sans', sans-serif; }
  .display { font-family: 'Archivo', sans-serif; font-weight: 800; font-stretch: 75%; }
</style>
</head>
<body>
<!--
  Motion2Code rebuild of "Spark Performance, Episode 3: Shuffling" (1080x1920, 80.47 s).
  Contract: window.anim = { tl, duration, seek(t), play(from), pause() }; ?t= freezes, ?external=1 does not autoplay;
  <html data-ready="1"> once fonts are loaded and frame 0 is drawn.
  The presenter webcam card of the source is left out: only the graphics are rebuilt.
  Everything visible is a pure function of t: render(t) resets each scene and draws the shots active at t.
-->
<svg id="stage" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame"><rect width="1080" height="1920"/></clipPath>
    <radialGradient id="bgGrad" cx="540" cy="700" r="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2EFE2"/><stop offset="0.55" stop-color="#E6E3D6"/><stop offset="1" stop-color="#CFCCBF"/>
    </radialGradient>
    <pattern id="gridPat" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12.5 0V24M0 12.5H24" stroke="#5A5440" stroke-opacity="0.075" stroke-width="1" fill="none"/>
    </pattern>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="16" height="16" fill="#3E7A68"/><rect width="7" height="16" fill="#5E9585"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="12" height="12" fill="#E2DED0"/><rect width="5" height="12" fill="#D2CDBD"/>
    </pattern>
    <linearGradient id="funnelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEEBE0"/><stop offset="0.5" stop-color="#E3DFD2"/><stop offset="1" stop-color="#CDC8B8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft24" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect id="bg" width="1080" height="1920" fill="url(#bgGrad)"/>
    <rect id="grid" width="1080" height="1920" fill="url(#gridPat)"/>
    <g id="scenes"></g>
    <g id="header"></g>
  </g>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
const DUR = 2414 / 30;               // 80.467 s, the source length
const NS = 'http://www.w3.org/2000/svg';
const C = {
  ink: '#1E1A14', inkSoft: '#3A342C', gray: '#6E685B', grayLight: '#9C9585', line: '#CBC7B8',
  paper: '#EFECE0', paperDark: '#E3DFD1', side: '#DCD8C9', sideDark: '#D2CDBC',
  green: '#3D7A62', greenDim: '#B9C4B2', red: '#A23B2C', redDim: '#E3B9AC',
  blue: '#24428A', blueLight: '#C9D4EA', orange: '#C98A4B', term: '#1F1B15', termText: '#E9E4D6'
};

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const EC = {}; const ease = n => EC[n] || (EC[n] = gsap.parseEase(n));
const prog = (t, a, b, e = 'none') => ease(e)(clamp((t - a) / (b - a)));
function kf(t, K) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t <= K[i][0]) {
    const [t0, v0] = K[i - 1], [t1, v1, e] = K[i];
    const p = ease(e || 'power1.inOut')((t - t0) / (t1 - t0));
    return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], p)) : lerp(v0, v1, p);
  }
  return K[K.length - 1][1];
}
const f1 = v => (Math.round(v * 10) / 10).toString();
const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(20240315);
function E(tag, attrs = {}, parent = null) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function T(parent, str, attrs) { const el = E('text', attrs, parent); el.textContent = str; return el; }
const S = (el, attrs) => { for (const k in attrs) el.setAttribute(k, attrs[k]); };
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
const op = (el, v) => { el.setAttribute('opacity', f1(clamp(v) * 100) / 100); show(el, v > 0.001); };
const pts = P => P.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const poly = (P) => 'M' + P.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z';
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mix = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p)];
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mixColor = (a, b, p) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((x, i) => Math.round(lerp(x, B[i], clamp(p)))).join(',') + ')'; };
const fmt = n => Math.round(n).toLocaleString('en-US');
// affine matrix that maps a local w x h rectangle onto a face given by its top-left, top-right and bottom-left corners
const faceMatrix = (TL, TR, BL, w, h) =>
  `matrix(${[(TR[0] - TL[0]) / w, (TR[1] - TL[1]) / w, (BL[0] - TL[0]) / h, (BL[1] - TL[1]) / h, TL[0], TL[1]].map(v => +v.toFixed(4)).join(' ')})`;

// plane homography from four correspondences (solved once, 8x8 Gauss-Jordan)
function homography(src, dst) {
  const A = [], b = [];
  src.forEach(([u, v], i) => {
    const [x, y] = dst[i];
    A.push([u, v, 1, 0, 0, 0, -x * u, -x * v]); b.push(x);
    A.push([0, 0, 0, u, v, 1, -y * u, -y * v]); b.push(y);
  });
  const n = 8, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  const h = M.map((r, i) => r[n] / r[i]);
  return (u, v) => { const w = h[6] * u + h[7] * v + 1; return [(h[0] * u + h[1] * v + h[2]) / w, (h[3] * u + h[4] * v + h[5]) / w]; };
}

// A hand-placed perspective box: front face is a w x h rectangle rotated by rot around its bottom centre,
// the top face is the front-top edge pushed back by (sx, -d), sx growing away from the vanishing x.
function boxGeom(g) {
  const r = (g.rot || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  const P = (x, y) => [g.cx + x * c - y * s, g.by + x * s + y * c];
  const FBL = P(-g.w / 2, 0), FBR = P(g.w / 2, 0), FTR = P(g.w / 2, -g.h), FTL = P(-g.w / 2, -g.h);
  const sx = -(g.k ?? 0.04) * (g.cx - (g.vx ?? 530));
  const BTL = add(FTL, [sx, -g.d]), BTR = add(FTR, [sx, -g.d]);
  return { FTL, FTR, FBR, FBL, BTL, BTR, sx, g };
}
const lerpGeom = (a, b, p) => { const o = {}; for (const k in a) o[k] = typeof a[k] === 'number' ? lerp(a[k], b[k] ?? a[k], p) : a[k]; return o; };

// ---------- layers ----------
const svg = document.getElementById('stage');
const L = { scenes: document.getElementById('scenes'), header: document.getElementById('header') };
const scenes = [];
function scene(id, build, draw) { const g = E('g', { id }, L.scenes); const s = { g, draw }; build(g, s); scenes.push(s); return s; }

// ---------- header: typed breadcrumb, blinking cursor, progress rule ----------
const HDR = '> BINARY HABIT / SPARK PERF / 03';
const header = {};
function buildHeader() {
  const g = L.header;
  header.rule = E('rect', { x: 66, y: 233.5, width: 948, height: 1.5, fill: '#C9C5B6' }, g);
  header.prog = E('rect', { x: 66, y: 232, width: 0, height: 4, fill: '#2E4A86' }, g);
  header.text = T(g, '', { class: 'hdr', x: 66, y: 220, 'font-size': 24.5, 'letter-spacing': 5.25, fill: '#4F493E' });
  header.cursor = E('rect', { x: 757, y: 196, width: 14, height: 26, fill: C.orange }, g);
  header.widths = [];
}
function measureHeader() {
  for (let n = 0; n <= HDR.length; n++) {
    header.text.textContent = HDR.slice(0, n);
    header.widths[n] = n ? header.text.getComputedTextLength() : 0;
  }
}
function drawHeader(t) {
  // types in over the first 0.7 s, rubs out in the return to the opening frame
  let n = Math.round(clamp(t * 46, 0, HDR.length));
  if (t > DUR - 0.75) n = Math.round(HDR.length * (1 - prog(t, DUR - 0.75, DUR - 0.3)));
  header.text.textContent = HDR.slice(0, n);
  const typing = (t < 0.72) || (t > DUR - 0.8);
  const blinkOn = t > 1.07 && t < 77.3 && ((t - 1.07) % 1.0625) < 0.533;
  show(header.cursor, typing || blinkOn);
  S(header.cursor, { x: f1(66 + header.widths[n] + (n ? 2 : -30 + 30)) });
  const w = t < DUR - 0.75 ? 948 * clamp(t / 80.2) : 948 * clamp(t / 80.2) * (1 - prog(t, DUR - 0.75, DUR - 0.3, 'power2.inOut'));
  S(header.prog, { width: f1(w) });
}

// =====================================================================================
// SCENE 1 (0 - 6.8 s): 100 executors land as an isometric grid, run green, groupBy turns them red,
// the job card takes over and its timer runs while progress stalls at 62 %.
// =====================================================================================
const GRID = homography([[0, 0], [9, 0], [0, 9], [9, 9]], [[566.9, 520.6], [1023.5, 764.5], [66.3, 728.2], [499.2, 1071.5]]);
const s1 = scene('s1-executors', (g, s) => {
  E('clipPath', { id: 'colClip' }, E('defs', {}, g)).appendChild(E('rect', { x: 66, y: 0, width: 948, height: 1920 }));
  s.world = E('g', { 'clip-path': 'url(#colClip)' }, g);
  s.ripple = E('ellipse', { cx: 545, cy: 850, fill: 'none', stroke: '#8E8878', 'stroke-width': 2 }, g);
  s.cubes = [];
  const cells = [];
  for (let i = 0; i < 10; i++) for (let j = 0; j < 10; j++) cells.push([i, j]);
  const a = 0.37;
  for (const [i, j] of cells) {
    const top = [[i - a, j - a], [i + a, j - a], [i + a, j + a], [i - a, j + a]].map(([u, v]) => GRID(u, v));
    const c = GRID(i, j);
    const px = Math.hypot(...[0, 1].map(k => GRID(i + 0.5, j)[k] - GRID(i - 0.5, j)[k]));
    const py = Math.hypot(...[0, 1].map(k => GRID(i, j + 0.5)[k] - GRID(i, j - 0.5)[k]));
    const h = 0.43 * Math.sqrt(px * py);
    const cg = E('g', {}, s.world);
    const sides = [];
    for (let e = 0; e < 4; e++) {
      const A = top[e], B = top[(e + 1) % 4], mid = mix(A, B, 0.5);
      if (mid[1] <= c[1]) continue;                      // only the two faces turned towards the viewer
      sides.push({ d: poly([A, B, add(B, [0, h]), add(A, [0, h])]), shade: mid[0] < c[0] ? C.paperDark : C.side });
    }
    for (const sd of sides) E('path', { d: sd.d, fill: sd.shade, stroke: C.inkSoft, 'stroke-width': 1.3, 'stroke-linejoin': 'round' }, cg);
    E('path', { d: poly(top), fill: C.paper, stroke: C.inkSoft, 'stroke-width': 1.3, 'stroke-linejoin': 'round' }, cg);
    const dotOuter = E('path', { d: poly([[i - 0.15, j - 0.15], [i + 0.15, j - 0.15], [i + 0.15, j + 0.15], [i - 0.15, j + 0.15]].map(([u, v]) => GRID(u, v))), opacity: 0.45 }, cg);
    const dot = E('path', { d: poly([[i - 0.1, j - 0.1], [i + 0.1, j - 0.1], [i + 0.1, j + 0.1], [i - 0.1, j + 0.1]].map(([u, v]) => GRID(u, v))) }, cg);
    s.cubes.push({ g: cg, dot, dotOuter, x: c[0], y: c[1], phase: rnd(), freq: 0.6 + rnd() * 0.9, tRed: 4.58 + rnd() * 0.42, jitter: rnd() });
  }
  // paint order: back to front
  s.cubes.slice().sort((p, q) => p.y - q.y).forEach(c => s.world.appendChild(c.g));
  // landing order: left to right with some noise; F(t) is the visible share measured on the source frames
  const order = s.cubes.slice().sort((p, q) => (p.x + p.jitter * 140) - (q.x + q.jitter * 140));
  const F = [[0.26, 0], [0.32, 0.03], [0.4, 0.13], [0.5, 0.35], [0.6, 0.6], [0.7, 0.8], [0.8, 0.92], [0.9, 0.97], [1.0, 1]];
  order.forEach((c, k) => {
    const q = (k + 0.5) / order.length;
    let t0 = 1;
    for (let m = 1; m < F.length; m++) if (q <= F[m][1]) { t0 = lerp(F[m - 1][0], F[m][0], (q - F[m - 1][1]) / (F[m][1] - F[m - 1][1])); break; }
    c.t0 = t0 - 0.12;
  });
  s.count = T(g, '0', { class: 'space', x: 540, y: 390, 'font-size': 130, 'text-anchor': 'middle', fill: C.ink });
  s.countLabel = T(g, 'SPARK EXECUTORS', { class: 'mono', x: 540, y: 437, 'font-size': 24, 'letter-spacing': 3.2, 'text-anchor': 'middle', fill: C.gray });
  // status pill
  s.pill = E('g', { transform: 'translate(540 1078)' }, g);
  s.pillBox = E('rect', { x: -121, y: -23, width: 242, height: 46, rx: 23, 'stroke-width': 2 }, s.pill);
  s.pillText = T(s.pill, '', { class: 'mono', x: 0, y: 7.5, 'font-size': 22, 'font-weight': 500, 'letter-spacing': 1.5, 'text-anchor': 'middle' });
  // job card
  s.card = E('g', {}, g);
  E('rect', { x: 174, y: 345, width: 746, height: 287, rx: 10, fill: '#2D281F', opacity: 0.18, filter: 'url(#soft)' }, s.card);
  E('rect', { x: 164, y: 333, width: 756, height: 287, rx: 9, fill: '#F1EEE3', stroke: C.inkSoft, 'stroke-width': 2 }, s.card);
  T(s.card, 'SPARK JOB · STAGE 2 OF 3', { class: 'mono', x: 203, y: 387, 'font-size': 19, 'letter-spacing': 3, fill: '#8A8476' });
  T(s.card, 'groupBy · count', { class: 'space', x: 203, y: 476, 'font-size': 45, fill: C.ink });
  s.timer = T(s.card, '00:00', { class: 'space', x: 878, y: 476, 'font-size': 54, 'text-anchor': 'end', fill: C.green });
  E('rect', { x: 202, y: 524, width: 676, height: 41, rx: 3, fill: '#F6F3EA', stroke: C.ink, 'stroke-width': 2.5 }, s.card);
  s.bar = E('rect', { x: 204, y: 526, width: 0, height: 37, fill: 'url(#stripes)' }, s.card);
  T(s.card, 'running…', { class: 'mono', x: 202, y: 604, 'font-size': 20, fill: C.green });
  s.pct = T(s.card, '0%', { class: 'mono', x: 879, y: 604, 'font-size': 20, 'text-anchor': 'end', fill: '#8A8476' });
  // code chip that drops in, then becomes the progress bar
  s.chip = E('g', {}, g);
  E('rect', { x: -342, y: -38, width: 704, height: 95, fill: '#000', opacity: 0.22, filter: 'url(#soft4)' }, s.chip);
  E('rect', { x: -352, y: -47.5, width: 704, height: 95, fill: C.term }, s.chip);
  const ct = T(s.chip, '', { class: 'mono', x: -320, y: 12, 'font-size': 37, fill: C.termText });
  ct.innerHTML = 'df.<tspan fill="#9AA6DA">groupBy</tspan>("country")';
}, (t, s) => {
  const on = t < 6.8;
  show(s.g, on); if (!on) return;
  const shift = 112 * prog(t, 5.05, 5.45, 'power2.inOut');
  S(s.world, { transform: `translate(0 ${f1(shift)})` });
  for (const c of s.cubes) {
    const p = prog(t, c.t0, c.t0 + 0.2, 'power2.out');
    op(c.g, p);
    if (p <= 0) continue;
    if (p < 1) S(c.g, { transform: `translate(0 ${f1(-70 * (1 - p))})` }); else c.g.removeAttribute('transform');
    // dot: dim, then flickering green, then red after groupBy
    const live = prog(t, 1.15 + c.jitter * 0.4, 1.6 + c.jitter * 0.4);
    const wave = 0.5 + 0.5 * Math.sin(2 * Math.PI * (c.freq * t + c.phase));
    let col;
    if (t < c.tRed) col = mixColor(C.greenDim, C.green, live * Math.pow(wave, 2.2));
    else { const r = prog(t, c.tRed, c.tRed + 0.18); col = mixColor(C.redDim, C.red, r * (0.35 + 0.65 * Math.pow(wave, 1.4))); }
    S(c.dot, { fill: col }); S(c.dotOuter, { fill: col });
  }
  // counter
  const n = Math.round(kf(t, [[0.15, 0], [0.2, 15], [0.3, 40], [0.4, 60], [0.5, 75], [0.6, 85], [0.7, 93], [0.8, 97], [0.9, 99], [1.0, 100]]));
  s.count.textContent = String(n);
  const head = (1 - prog(t, 5.0, 5.3)) * prog(t, 0.15, 0.25);
  op(s.count, head * (0.35 + 0.65 * prog(t, 0.2, 0.45)));
  op(s.countLabel, head * prog(t, 0.15, 0.4));
  // pill: ALL RUNNING pops, then SLOWING DOWN
  const pop = prog(t, 2.6, 2.82, 'back.out(2.2)');
  op(s.pill, pop);
  const slow = t >= 4.72;
  const pw = slow ? 286 : 242;
  S(s.pill, { transform: `translate(540 1078) scale(${f1(pop * 100) / 100})` });
  S(s.pillBox, { x: -pw / 2, width: pw, fill: slow ? '#F2E3DA' : '#E8EBDE', stroke: slow ? '#B0584A' : '#5D8F77' });
  S(s.pillText, { fill: slow ? '#A23B2C' : '#3D7A62' });
  s.pillText.textContent = slow ? '● SLOWING DOWN' : '● ALL RUNNING';
  // ripple when the work turns red
  const rp = prog(t, 4.88, 5.35);
  op(s.ripple, rp > 0 && rp < 1 ? 0.25 * (1 - rp) : 0);
  S(s.ripple, { rx: f1(lerp(330, 500, rp)), ry: f1(lerp(170, 250, rp)) });
  // code chip: falls from above the frame, settles, then shrinks into the job card's progress bar
  const fall = prog(t, 3.95, 4.6);
  const into = prog(t, 5.25, 5.45, 'power2.inOut');
  const cy = lerp(kf(t, [[3.85, -70], [4.0, 95, 'none'], [4.2, 202, 'none'], [4.45, 525, 'power1.in'], [4.62, 580, 'power2.out']]), 545, into);
  const cx = 540;
  const rot = lerp(-2, 0, prog(t, 4.2, 4.65, 'power2.out'));
  const sx = lerp(lerp(1.04, 1, fall), 676 / 704, into), sy = lerp(1, 41 / 95, into);
  op(s.chip, (t > 3.85 ? 1 : 0) * (1 - prog(t, 5.35, 5.47)));
  S(s.chip, { transform: `translate(${f1(cx)} ${f1(cy)}) rotate(${f1(rot)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})` });
  // job card
  const cardIn = prog(t, 5.08, 5.45);
  op(s.card, cardIn);
  S(s.card, { transform: `translate(540 476) scale(${(0.96 + 0.04 * cardIn).toFixed(3)}) translate(-540 -476)` });
  s.timer.textContent = '00:' + String(Math.max(0, Math.round((t - 5.17) * 33))).padStart(2, '0');
  const pct = kf(t, [[5.15, 0], [5.5, 36], [5.8, 54], [6.1, 61], [6.4, 62]]);
  s.pct.textContent = Math.round(pct) + '%';
  S(s.bar, { width: f1(672 * pct / 100) });
});

// =====================================================================================
// SCENE 2 (7.7 - 29.3 s): one billion orders, four executors fill up in parallel, groupBy("country") types in,
// every order gets a key, partitions appear and the keys travel: the shuffle.
// =====================================================================================

    const a = 77.72 + 0.16 * i, p = prog(t, a, a + 0.3, 'back.out(1.8)');
    op(c, prog(t, a, a + 0.15));
    S(c, { transform: `translate(${328 + 141.5 * i} ${f1(708 + 14 * (1 - p))})` });
  });
  op(s.brand, prog(t, 78.2, 78.6));
});

// =====================================================================================
// render: one pure function of t
// =====================================================================================
let built = false;            // compare.html may call seek() before the fonts are in
function render(t) {
  if (!built) return;
  for (const s of scenes) s.draw(t, s);
  drawHeader(t);
}

const clock = { t: 0 };
const tl = gsap.timeline({ paused: true, repeat: -1 });
tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: 'none', immediateRender: false, onUpdate: () => render(clock.t) });
window.anim = {
  tl, duration: DUR,
  seek(t) { t = clamp(t, 0, DUR); tl.pause(); tl.time(t, true); render(t); },
  play(from = 0) { tl.restart(); tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};

const qs = new URLSearchParams(location.search);
const fontsReady = Promise.race([
  Promise.all([
    document.fonts.load('700 100px "Space Mono"', '0123456789'), document.fonts.load('24px "Silkscreen"', 'BINARY'),
    document.fonts.load('400 24px "IBM Plex Mono"', 'SPARK'), document.fonts.load('500 24px "IBM Plex Mono"', 'ALL'),
    document.fonts.load('600 24px "IBM Plex Mono"', 'key'), document.fonts.load('400 24px "IBM Plex Sans"', 'Episode'),
    document.fonts.load('800 100px "Archivo"', 'SHUFFLE'), document.fonts.ready]),
  new Promise(r => setTimeout(r, 6000))
]);
fontsReady.then(() => {
  buildHeader(); measureHeader();
  built = true;
  anim.seek(0);
  if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
});
})();
</script>
