<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Shuffle Explained</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--stage:#d9d6c8;--paper:#eae7da}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#141412}}
:root[data-theme="dark"]{--stage:#141412}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
#stage{position:relative;width:min(100%,calc((100vh - 110px)*9/16));aspect-ratio:9/16;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);background:var(--paper)}
#g{position:absolute;inset:0;width:100%;height:100%;display:block}
#controls{display:flex;gap:10px;align-items:center;width:min(100%,560px)}
button{font:inherit;font-size:13px;background:#1d1d1b;color:#eae7da;border:0;border-radius:8px;min-height:40px;padding:0 14px;cursor:pointer}
input[type=range]{flex:1;accent-color:#284878}
#time{font-size:13px;color:#6f6c62;min-width:84px;text-align:right}
</style>
</head>
<body>
<div id="stage"><svg id="g" viewBox="0 0 540 960" role="img" aria-label="Animated explainer: why a Spark groupBy triggers an expensive shuffle"></svg></div>
<div id="controls">
  <button id="cc" aria-pressed="true">CC</button>
  <button id="play">Pause</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
  <span id="time">0:00</span>
</div>
<script>
const C={paper:'#eae7da',grid:'#dfdccf',card:'#f7f6f0',front:'#efede4',side:'#dcd9cc',edge:'#8f8b80',ink:'#1d1d1b',muted:'#7a776c',
  blue:'#284878',blueL:'#cfd8ea',red:'#9a4636',amber:'#c88848',green:'#2f7a5b',teal:'#3d8577'};
const KC={IN:C.blue,US:C.green,BR:C.amber,DE:C.red};
const CAPS=[[0.16,"Imagine 100 spark executors processing"],[2.34,"data perfectly fine until you"],[4.02,"add one groupBy and"],[5.38,"suddenly your spark job slows"],[6.66,"down but why let's say"],[7.78,"you have billions of orders"],[9.12,"distributed across 100 executors and"],[11.4,"everything is running in parallel"],[12.66,"no problem so far and"],[14.2,"now you run a df.groupBy"],[16.34,"country.count and now things get"],[18.62,"interesting now spark needs data"],[20.46,"for the same country to"],[21.64,"reach the same shuffle partition"],[23.2,"so intermediate data sitting on"],[24.6,"one executor may need to"],[25.6,"move to another and that's"],[26.9,"called shuffle can be very"],[28.3,"expensive operation by the way"],[30.0,"because spark may need to"],[31.2,"serialize the data write it"],[32.6,"to disk adding disk i/o"],[34.4,"overhead transfer it across the"],[36.1,"network adding network i/o cost"],[38.3,"and then this next stage"],[40.0,"fetch the reader reads and"],[41.6,"deserialize it and performs the"],[43.4,"required aggregation all of this"],[45.4,"adds to shuffle overhead and"],[47.2,"while this happens some tasks"],[48.7,"may spend more time waiting"],[50.0,"for the data than actually"],[51.4,"processing it but here is"],[53.0,"what most people miss when"],[54.4,"data movement is the bottleneck"],[56.0,"moving less data can help"],[57.6,"more than adding more executors"],[59.6,"so whenever possible filter unnecessary"],[61.6,"rows and columns before a"],[63.3,"shuffle and avoid unnecessary shuffles"],[65.6,"altogether and speaking of reducing"],[67.6,"data movement that's where a"],[69.3,"powerful optimization called broadcast join"],[72.0,"and let's cover that next"],[74.2,"and this was the episode"],[76.4,"3 of spark performance"]];
const DUR=80.5;

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const io=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const E=(t,a,b)=>io((t-a)/(b-a));
const bk=(t,a,d=.45)=>{const x=cl((t-a)/d),c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const W=(t,a,b,f=.3)=>cl(Math.min((t-a)/f,(b-t)/f));
const r1=n=>Math.round(n*10)/10;

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function T(x,y,s,o={}){return `<text x="${r1(x)}" y="${r1(y)}" font-size="${o.size||12}" font-weight="${o.w||400}" fill="${o.fill||C.ink}" text-anchor="${o.a||'start'}" letter-spacing="${o.ls||0}" opacity="${o.op??1}" font-family="JetBrains Mono, ui-monospace, monospace">${o.raw?s:esc(s)}</text>`}
function R(x,y,w,h,o={}){return `<rect x="${r1(x)}" y="${r1(y)}" width="${r1(Math.max(0,w))}" height="${r1(Math.max(0,h))}" rx="${o.rx??3}" fill="${o.fill||C.card}" stroke="${o.stroke||'none'}" stroke-width="${o.sw||1}" opacity="${o.op??1}"/>`}
function P(pts,fill,stroke=C.edge,sw=.8){return `<polygon points="${pts.map(p=>r1(p[0])+','+r1(p[1])).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`}
/* oblique box: front face (x,y,w,h), depth d receding up-right */
function box(x,y,w,h,d,o={}){const dx=d*.62,dy=-d*.42;
  let s=`<g opacity="${o.op??1}" transform="translate(0 ${r1(o.dy||0)})">`;
  s+=`<ellipse cx="${r1(x+w/2+dx/2)}" cy="${r1(y+h+6)}" rx="${r1(w*.6)}" ry="6" fill="#000" opacity=".06"/>`;
  s+=P([[x,y],[x+dx,y+dy],[x+w+dx,y+dy],[x+w,y]],o.top||C.card);
  s+=P([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],o.side||C.side);
  s+=P([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],o.front||C.front);
  if(o.label)s+=T(x+6,y+h-(o.bar!=null?13:7),o.label,{size:6.5,fill:C.muted,ls:.6});
  if(o.dot)s+=`<circle cx="${r1(x+w-7)}" cy="${r1(y+h/2-2)}" r="2" fill="${o.dot}"/>`;
  if(o.bar!=null){s+=R(x+6,y+h-9,w-12,4,{rx:1,fill:'none',stroke:C.edge,sw:.6});s+=R(x+6,y+h-9,(w-12)*o.bar,4,{rx:1,fill:C.green})}
  return s+'</g>'}
/* isometric cube, top centre (cx,cy) */
function cube(cx,cy,s,h,o={}){const a=s*.87,b=s*.5;let g=`<g opacity="${r1(o.op??1)}">`;
  g+=P([[cx-a,cy],[cx,cy+b],[cx,cy+b+h],[cx-a,cy+h]],C.front);
  g+=P([[cx,cy+b],[cx+a,cy],[cx+a,cy+h],[cx,cy+b+h]],C.side);
  g+=P([[cx,cy-b],[cx+a,cy],[cx,cy+b],[cx-a,cy]],o.top||C.card);
  if(o.dot)g+=`<ellipse cx="${r1(cx)}" cy="${r1(cy)}" rx="2.6" ry="1.6" fill="${o.dot}"/>`;
  return g+'</g>'}
function pill(cx,y,s,col,o={}){const sz=o.size||8,w=s.length*sz*.62+20;return `<g opacity="${r1(o.op??1)}">`+R(cx-w/2,y-11,w,18,{rx:9,fill:C.card,stroke:col,sw:1})+T(cx,y+2,s,{size:sz,fill:col,a:'middle',ls:.8})+'</g>'}
function chip(x,y,k,o={}){return `<g opacity="${r1(o.op??1)}">`+R(x-11,y-7,22,14,{rx:2,fill:KC[k]})+T(x,y+3,k,{size:7.5,w:700,fill:'#fff',a:'middle'})+'</g>'}
function term(x,y,w,s,o={}){return `<g opacity="${r1(o.op??1)}" transform="translate(0 ${r1(o.dy||0)})">`+R(x+3,y+4,w,44,{rx:3,fill:'#000',op:.18})+R(x,y,w,44,{rx:3,fill:'#1e1e1c'})+T(x+16,y+27,s,{size:13,fill:'#e9e6d8',raw:true})+'</g>'}
const code=s=>esc(s).replace('groupBy','<tspan fill="#8fb0ff">groupBy</tspan>').replace('"country"','<tspan fill="#e3ac55">"country"</tspan>').replace('count(','<tspan fill="#8fb0ff">count</tspan>(');
const cur=on=>on?`<tspan fill="${C.amber}">▌</tspan>`:'';
function shuffleIcon(cx,cy,s,col){return `<g transform="translate(${r1(cx)} ${r1(cy)}) scale(${s})" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 -8 H-6 C2 -8 4 8 12 8 H16"/><path d="M-16 8 H-6 C2 8 4 -8 12 -8 H16"/><path d="M11 -13 L16 -8 L11 -3"/><path d="M11 3 L16 8 L11 13"/></g>`}
const pipePath=(x,y,w,h)=>{const n=h*.36,m=x+w*.5,q=w*.17;return `M${x} ${y} H${m-q*1.6} C${m-q*.6} ${y} ${m-q*.6} ${y+n} ${m} ${y+n} C${m+q*.6} ${y+n} ${m+q*.6} ${y} ${m+q*1.6} ${y} H${x+w} V${y+h} H${m+q*1.6} C${m+q*.6} ${y+h} ${m+q*.6} ${y+h-n} ${m} ${y+h-n} C${m-q*.6} ${y+h-n} ${m-q*.6} ${y+h} ${m-q*1.6} ${y+h} H${x} Z`};

let BG=`<rect width="540" height="960" fill="${C.paper}"/><g stroke="${C.grid}" stroke-width=".6">`;
for(let x=0;x<=540;x+=24)BG+=`<line x1="${x}" y1="0" x2="${x}" y2="960"/>`;
for(let y=0;y<=960;y+=24)BG+=`<line x1="0" y1="${y}" x2="540" y2="${y}"/>`;
BG+='</g>';

const EXX=[48,152,256,360],EXY=318,EW=84,EH=46,ED=34,KEYS=['IN','US','BR','DE'];
const CHIPS=[];{const cnt={};for(let e=0;e<4;e++)for(let j=0;j<4;j++){const k=KEYS[(e*3+j*5+j*e)%4];cnt[k]=(cnt[k]||0)+1;CHIPS.push({e,j,k,slot:cnt[k]-1})}}

function frame(t){
  let s=BG;const blink=Math.floor(t*2.2)%2===0;
  const H='BINARY HABIT / SPARK PERF / 03',n=Math.ceil(H.length*cl(t/1.1));
  s+=T(36,104,'&gt; '+esc(H.slice(0,n))+cur(blink),{size:10.5,w:700,fill:C.muted,ls:1.8,raw:true});
  s+=`<line x1="36" y1="114" x2="${r1(36+340*E(t,0,1.4))}" y2="114" stroke="${C.blue}" stroke-width="1.5"/>`;

  /* S1 0–7.9: 100 executors */
  if(t<8.2){const o=W(t,-1,7.9);let g='';
    const card=E(t,4.9,5.3),slow=E(t,5.6,6.4),gy=card*50;
    g+=T(270,190,String(Math.round(100*E(t,0,.75))),{size:44,w:800,a:'middle',op:1-card});
    g+=T(270,210,'SPARK EXECUTORS',{size:7.5,fill:C.muted,a:'middle',ls:1.4,op:1-card});
    for(let j=0;j<10;j++)for(let i=0;i<10;i++){
      const d=(i+j)*.035,p=bk(t,.05+d,.5),cx=270+(i-j)*21,cy=268+(i+j)*12.2+gy-(1-p)*40;
      const red=slow>((i*37+j*11)%100)/100*.9+.05&&(i*7+j)%3;
      g+=cube(cx,cy,19,9,{op:cl((t-.05-d)/.25),dot:red?C.red:C.green})}
    g+=pill(270,520+gy*.4,slow>.4?'● SLOWING DOWN':'● ALL RUNNING',slow>.4?C.red:C.green,{op:E(t,2.3,2.6)});
    g+=term(150,228,240,code('df.groupBy("country")'),{op:E(t,3.9,4.15)*(1-E(t,4.9,5.1)),dy:-10*(1-bk(t,3.9))});
    if(t>4.9){const cy=166-14*(1-bk(t,4.9)),pc=Math.min(63,44*E(t,5,5.4)+12*E(t,5.4,5.9)+7*E(t,5.9,7.5));
      const clk=t<5.9?(t-4.9)*23:23+(t-5.9)*65,mm=String(Math.floor(clk/60)).padStart(2,'0')+':'+String(Math.floor(clk%60)).padStart(2,'0');
      g+=`<g opacity="${r1(card)}">`+R(84,cy+4,372,128,{rx:4,fill:'#000',op:.08})+R(80,cy,372,128,{rx:4,stroke:C.ink,sw:1.4})
        +T(98,cy+24,'SPARK JOB · STAGE 2 OF 3',{size:7,fill:C.muted,ls:1})
        +T(98,cy+58,'groupBy · count',{size:18,w:700})+T(434,cy+58,mm,{size:21,w:700,a:'end',fill:t>6.6?C.red:C.teal})
        +R(98,cy+76,336,16,{rx:2,fill:'none',stroke:C.ink,sw:1})
        +`<rect x="99" y="${r1(cy+77)}" width="${r1(334*pc/100)}" height="14" fill="url(#stripe)"/>`
        +T(98,cy+108,t>6.6?'tasks waiting on data…':'running…',{size:7.5,fill:C.muted})+T(434,cy+108,Math.round(pc)+'%',{size:7.5,fill:C.muted,a:'end'})+'</g>'}
    s+=`<g opacity="${r1(o)}">${g}</g>`}

  /* S2 7.9–14.2: a billion orders */
  if(t>7.7&&t<14.5){const o=W(t,7.9,14.3);let g='';
    g+=T(270,166,Math.round(1e9*E(t,8,8.8)).toLocaleString('en-US'),{size:30,w:800,a:'middle'});
    g+=T(270,184,'ORDERS',{size:7.5,fill:C.muted,a:'middle',ls:1.4});
    g+=T(492,262,'+ 96 more executors',{size:7.5,fill:C.muted,a:'end',op:E(t,10,10.4)});
    for(let e=0;e<4;e++){const a=e===0?8.7:9.6+e*.25,p=bk(t,a,.5);
      g+=box(EXX[e],EXY,EW,EH,ED,{op:cl((t-a)/.2),dy:-(1-p)*40,label:'EXECUTOR '+(e+1),bar:E(t,10.6,13.4),dot:C.green});
      for(let b=0;b<6;b++){const ba=10.5+e*.2+b*.12,bp=bk(t,ba,.4),bx=EXX[e]+6+(b%3)*25+Math.floor(b/3)*8,by=EXY-6-Math.floor(b/3)*11;
        g+=box(bx,by,18,5,8,{op:cl((t-ba)/.15),dy:-(1-bp)*18})}}
    g+=pill(270,500,'✓ PARALLEL · NO PROBLEM',C.green,{op:E(t,12.8,13.1)});
    s+=`<g opacity="${r1(o)}">${g}</g>`}

  /* S3 14.2–29.1: groupBy → shuffle */
  if(t>14&&t<29.4){const o=W(t,14.2,29.2);let g='';const L='df.groupBy("country").count()',k=Math.floor(L.length*E(t,14.25,17.4));
    g+=term(63,143,412,'&gt;&gt;&gt; '+code(L.slice(0,k))+cur(blink),{op:1-E(t,18.6,18.9)});
    const ey=EXY-E(t,18.7,19.3)*48,focusIN=t<24.8;
    g+=T(270,166,focusIN?'same key → same partition':'data moves between executors',{size:16,w:700,a:'middle',op:E(t,19,19.4)});
    for(let e=0;e<4;e++){g+=box(EXX[e],ey,EW,EH,ED,{label:'EXECUTOR '+(e+1),bar:1,dot:C.green});if(t<19.4)for(let b=0;b<6;b++)g+=box(EXX[e]+6+(b%3)*25+Math.floor(b/3)*8,ey-6-Math.floor(b/3)*11,18,5,8,{op:1-E(t,19,19.4)})}
    for(let p=0;p<4;p++){const a=p?20.8+p*.18:19.2,pp=bk(t,a,.5),hl=p===0&&t>21&&t<26;
      g+=box(EXX[p],430,EW,20,ED,{op:cl((t-a)/.2),dy:(1-pp)*20,front:hl?C.blueL:C.front,top:hl?'#dfe5f2':C.card});
      g+=T(EXX[p]+6,445+(1-pp)*20,'PARTITION · '+KEYS[p],{size:6.5,fill:C.muted,ls:.5,op:cl((t-a)/.2)})}
    let arcs='',chips='';
    CHIPS.forEach((c,i)=>{const sx=EXX[c.e]+18+(c.j%2)*30+Math.floor(c.j/2)*10,sy=ey-6-Math.floor(c.j/2)*9;
      const ki=KEYS.indexOf(c.k),tx=EXX[ki]+18+(c.slot%3)*24,ty=437-Math.floor(c.slot/3)*12;
      const st=c.k==='IN'?21+i*.08:25+ki*.5+(i%4)*.12,pp=E(t,st,st+1.2),mx=(sx+tx)/2,my=Math.min(sy,ty)-90;
      const x=(1-pp)**2*sx+2*(1-pp)*pp*mx+pp*pp*tx,y=(1-pp)**2*sy+2*(1-pp)*pp*my+pp*pp*ty;
      if(t>st-.3&&t<st+3)arcs+=`<path d="M${r1(sx)} ${r1(sy)} Q${r1(mx)} ${r1(my)} ${r1(tx)} ${r1(ty)}" fill="none" stroke="${C.blue}" stroke-width="1" stroke-dasharray="3 3" opacity="${r1(.7*W(t,st-.3,st+3,.4))}"/>`;
      chips+=chip(x,y,c.k,{op:E(t,19.4+i*.03,19.7+i*.03)})});
    g+=arcs+chips+pill(270,520,'SHUFFLE',C.red,{op:E(t,27.8,28.1),size:10});
    s+=`<g opacity="${r1(o)}">${g}</g>`}

  /* S4 29.1–47: shuffle cost */
  if(t>28.9&&t<47.3){const o=W(t,29.1,47.1);let g='';
    const ST=[[29.4,'serialize'],[33.6,'write to disk'],[35.8,'send over network'],[40.2,'fetch'],[42.8,'deserialize'],[45.2,'aggregate']];
    let st=0;ST.forEach((x,i)=>{if(t>=x[0])st=i});
    g+=T(63,142,`STEP ${st+1} / 6`,{size:7,fill:C.muted,ls:1});
    g+=T(63,170,ST[st][1],{size:19,w:700,op:cl((t-ST[st][0])/.3)});
    const items=['serialize','disk I/O','network I/O','deserialize','aggregate'],done=[29.6,34,36.2,43,45.4];
    g+=R(354,124,126,118,{rx:3,stroke:C.edge,sw:.8})+T(364,140,'SHUFFLE COST',{size:6,fill:C.muted,ls:1});
    g+=R(364,147,106,6,{rx:1,fill:'none',stroke:C.edge,sw:.6})+R(364,147,106*done.filter(d=>t>=d).length/5,6,{rx:1,fill:C.red});
    items.forEach((it,i)=>{const on=t>=done[i];g+=R(364,162+i*15,7,7,{rx:1,fill:on?C.red:'none',stroke:on?C.red:C.edge,sw:.7})+T(377,169+i*15,it,{size:7.5,fill:on?C.ink:C.muted})});
    g+=box(48,370,104,56,40,{label:'EXECUTOR 4',dot:C.green});
    g+=box(356,350,104,56,40,{label:t>40?'STAGE 2 · EXEC 2':'EXECUTOR 2',dot:C.green});
    const dk=bk(t,33.6,.5),dop=cl((t-33.6)/.2);
    g+=`<g opacity="${r1(dop)}" transform="translate(270 ${r1(470+(1-dk)*20)})"><ellipse cx="0" cy="10" rx="54" ry="18" fill="${C.side}" stroke="${C.edge}" stroke-width=".8"/><rect x="-54" y="0" width="108" height="10" fill="${C.side}"/><ellipse cx="0" cy="0" rx="54" ry="18" fill="${C.card}" stroke="${C.edge}" stroke-width=".8"/><ellipse cx="0" cy="0" rx="9" ry="3.4" fill="${C.ink}"/>${t>=34&&t<35.8?`<ellipse cx="0" cy="0" rx="58" ry="21" fill="none" stroke="${C.red}" stroke-width="1" opacity="${r1(.5+.5*Math.sin(t*6))}"/>`:''}</g>`;
    g+=T(270,512,'DISK',{size:7,fill:C.muted,a:'middle',ls:1.2,op:dop});
    const nop=E(t,35.8,36.2);
    g+=`<path d="M112 360 Q270 230 420 340" fill="none" stroke="${C.ink}" stroke-width="1.2" stroke-dasharray="4 4" opacity="${r1(nop)}"/>`;
    g+=T(270,262,'NETWORK',{size:7,fill:C.muted,a:'middle',ls:1.2,op:nop})+pill(270,282,'+ network I/O',C.red,{op:E(t,36.6,36.9)});
    if(t>=34)g+=pill(270,540,'+ disk I/O',C.red,{op:E(t,34.2,34.5)});
    let rx=60,ry=300;const bits='01001001 01001110 00110100 00111000';
    if(t>=33.6&&t<35.8){const p=E(t,33.6,34.8);rx=60+154*p;ry=300+108*p}
    if(t>=35.8&&t<40.2){const p=E(t,36.4,39.8),x0=214,y0=408,x1=380,y1=282;rx=(1-p)**2*x0+2*(1-p)*p*270+p*p*x1;ry=(1-p)**2*y0+2*(1-p)*p*200+p*p*y1}
    if(t>=40.2){rx=372;ry=282}
    if(t>=30.6&&t<42.8){const sh=t<32?bits.slice(0,Math.ceil(bits.length*E(t,30.6,31.8))):bits;g+=R(rx,ry,170,22,{rx:2,fill:'#1e1e1c'})+T(rx+8,ry+15,sh,{size:7.5,fill:'#e9e6d8'})}
    else{const agg=t>=45.2;g+=`<g transform="translate(${r1(rx)} ${r1(ry)}) scale(${r1(agg?1+.05*Math.sin(cl((t-45.2)/.5)*Math.PI):1)})">`+R(0,0,142,agg?84:68,{rx:3,stroke:C.edge,sw:.8})
      +T(10,16,'ORDER RECORD',{size:7.5,w:700})+T(10,30,'order_id 48213907',{size:7.5})+T(10,43,'country IN',{size:7.5})+T(10,56,'amount €1,240',{size:7.5})
      +(agg?T(10,74,'→ sum(IN)  ✓',{size:7.5,w:700,fill:C.green}):'')+'</g>'}
    s+=`<g opacity="${r1(o)}">${g}</g>`}

  /* S5 47–54.5: waiting */
  if(t>46.8&&t<54.8){const o=W(t,47,54.5);let g='';
    g+=T(270,166,'shuffle <tspan fill="'+C.red+'">overhead</tspan>',{size:15,w:700,a:'middle',raw:true});
    for(let i=0;i<6;i++){const a=47.2+i*.15,mid=i>0&&i<5;g+=box(120+i*48,200,40,22,18,{op:cl((t-a)/.2),dy:-(1-bk(t,a))*14,front:mid?'#c98f84':C.front,top:mid?'#d9a59a':C.card})}
    g+=T(120,252,'STAGE 1',{size:7,fill:C.muted,ls:1,op:E(t,47.5,47.8)});
    g+=T(270,280,'stage 2 waits for all of this',{size:9,fill:C.red,a:'middle',op:E(t,48.2,48.5)});
    for(let i=0;i<4;i++){const a=49.8+i*.25,dx=(1-bk(t,a))*30,y=310+i*44;
      g+=`<g opacity="${r1(cl((t-a)/.2))}" transform="translate(${r1(dx)} 0)">`+R(62,y+3,416,32,{rx:3,fill:'#000',op:.06})+R(60,y,416,32,{rx:3,stroke:C.edge,sw:.8})
        +T(74,y+20,'STAGE 2 · TASK '+(i+1),{size:9})+T(462,y+20,'waiting for data'+'...'.slice(0,1+(Math.floor(t*3)+i)%3),{size:9,fill:C.amber,a:'end'})+'</g>'}
    s+=`<g opacity="${r1(o)}">${g}</g>`}

  /* S6 54.5–63: bottleneck */
  if(t>54.3&&t<63.3){const o=W(t,54.5,63.1);let g='';
    const y1=276-E(t,58.8,59.4)*80;
    g+=`<path d="${pipePath(60,y1,420,92)}" fill="${C.card}" stroke="${C.ink}" stroke-width="1.2"/>`;
    if(t<58.8){for(let i=0;i<40;i++){const a=54.8+i*.04,x=66+(i%8)*16+cl(t-55,0,3)*(i%8>5?6:1.5),y=y1+10+Math.floor(i/8)*15;
        g+=R(Math.min(x,186+(i%3)),y,13,9,{rx:1.5,fill:i%3?C.blue:C.card,stroke:C.blue,sw:.6,op:cl((t-a)/.2)})}
      g+=`<rect x="250" y="${r1(y1+40)}" width="40" height="12" rx="6" fill="${C.red}" opacity="${r1((.2+.3*Math.abs(Math.sin(t*4)))*E(t,55.6,56))}"/>`;
      g+=pill(270,y1-14,'bottleneck',C.red,{op:E(t,55.6,56)})}
    else{for(let i=0;i<6;i++){const p=((t-58.8)*.17+i*.17)%1,x=66+p*400,neck=Math.abs(p-.5)<.12;g+=R(x,neck?y1+40:y1+14+(i%3)*22,13,9,{rx:1.5,fill:C.blue})}
      g+=T(66,y1-12,'− less data',{size:11,w:700,fill:C.green})+pill(440,y1-14,'✓ flows',C.green,{op:E(t,60.4,60.7)});
      const y2=420;g+=`<g opacity="${r1(E(t,60.8,61.2))}">`+T(66,y2-12,'+ more executors',{size:11,w:700,fill:C.red})+`<path d="${pipePath(60,y2,420,92)}" fill="${C.card}" stroke="${C.ink}" stroke-width="1.2"/>`;
      for(let i=0;i<56;i++)g+=R(66+(i%8)*16+(i%8>5?20:0),y2+8+Math.floor(i/8)*11,13,8,{rx:1.5,fill:i%3?C.blue:C.card,stroke:C.blue,sw:.6});
      g+=pill(440,y2-14,'✗ still stuck',C.red,{op:E(t,61.8,62.1)})+'</g>'}
    s+=`<g opacity="${r1(o)}">${g}</g>`}

  /* S7 63–70: filter + avoid */
  if(t>62.8&&t<70.7){const o=W(t,63,70.5);let g='';const second=t>=66.4;
    g+=T(63,142,second?'AND':'BEFORE THE SHUFFLE',{size:7,fill:C.muted,ls:1});
    if(!second){g+=T(63,170,`<tspan opacity="${r1(E(t,64.6,64.9))}">filter</tspan><tspan opacity="${r1(E(t,64.3,64.6))}"> <tspan fill="${C.green}">rows</tspan></tspan><tspan opacity="${r1(E(t,65,65.3))}"> + <tspan fill="${C.green}">columns</tspan></tspan>`,{size:19,w:700,raw:true});
      const cols=['order_id','country','amount','user_id','notes','meta'],sh=1-.35*E(t,65.4,66);
      g+=`<g transform="translate(200 360) scale(${r1(sh*100)/100}) translate(-270 -360)" opacity="${r1(1-E(t,66,66.4))}">`;
      for(let r=0;r<7;r++)for(let c=0;c<6;c++){let op=1;if(r>0&&r%2===0)op-=.9*E(t,64.4,64.9);if(c>2)op=Math.min(op,1-.9*E(t,65.1,65.6));
        const cx=110+c*50+r*16,cy=300+r*26-c*11;
        g+=`<g opacity="${r1(op)}">`+P([[cx,cy],[cx+46,cy-12],[cx+60,cy-5],[cx+14,cy+7]],r===0?'#dfe5f2':C.card,C.edge,.6)+P([[cx,cy],[cx+14,cy+7],[cx+14,cy+11],[cx,cy+4]],C.side,C.edge,.5)+P([[cx+14,cy+7],[cx+60,cy-5],[cx+60,cy-1],[cx+14,cy+11]],C.front,C.edge,.5)+(r===0?T(cx+16,cy-1,cols[c],{size:6,fill:C.blue}):'')+'</g>'}
      g+='</g>';
      const sp=bk(t,65.6,.5);g+=`<g opacity="${r1(cl((t-65.6)/.2)*(1-E(t,66.1,66.4)))}" transform="translate(0 ${r1((1-sp)*-20)})">`+box(390,296,80,72,22,{})+shuffleIcon(430,326,1,C.ink)+T(430,360,'SHUFFLE',{size:5.5,fill:C.muted,a:'middle',ls:.8})+'</g>'}
    else{g+=T(63,170,'avoid unnecessary shuffles',{size:19,w:700,fill:C.red,op:E(t,66.4,66.7)});
      const fl=E(t,69,69.8),cy=216+fl*90,h=176*(1-fl*.75);
      g+=`<g opacity="${r1(E(t,66.6,66.9))}">`+R(140,cy+5,264,h,{rx:4,fill:'#000',op:.1})+R(136,cy,264,h,{rx:4,stroke:C.ink,sw:1.3});
      g+=`<g transform="translate(268 ${r1(cy+h*.42)}) scale(1 ${r1(1-fl*.75)})">`+shuffleIcon(0,0,1.5,C.ink)+T(0,44,'extra shuffle',{size:13,w:700,a:'middle'})+'</g>';
      g+=`<line x1="150" y1="${r1(cy+h-12)}" x2="386" y2="${r1(cy+12)}" stroke="${C.red}" stroke-width="2.4" stroke-dasharray="300" stroke-dashoffset="${r1(300*(1-E(t,67.3,68.1)))}"/></g>`;
      g+=pill(270,cy+h+40,'✓ less data moved · faster job',C.green,{op:E(t,69.7,70)})}
    s+=`<g opacity="${r1(o)}">${g}</g>`}

  /* S8 70–77.5: next trick */
  if(t>70.2&&t<77.7){const o=W(t,70.4,77.5);let g='';const next=t>=74.6;
    g+=T(63,142,next?'NEXT EPISODE':'LESS DATA MOVEMENT',{size:7,fill:C.muted,ls:1});
    g+=T(63,170,next?'broadcast join':'a powerful trick…',{size:19,w:700});
    const B=[[44,360],[292,282],[130,446],[384,350]];
    B.forEach((b,i)=>{const a=70.5+i*.2;g+=box(b[0],b[1],82,52,48,{op:cl((t-a)/.2),dy:-(1-bk(t,a))*24,label:'EXEC '+(i+1),dot:C.green})});
    if(t<73.4)g+=box(226,370,58,10,26,{op:cl((t-71.4)/.2),dy:-(1-bk(t,71.4,.5))*60,front:C.blueL,top:'#dfe5f2'});
    B.forEach((b,i)=>{const a=73.2+i*.18,p=E(t,a,a+.8);if(t>a)g+=box(226+(b[0]+12-226)*p,370+(b[1]-14-370)*p,46,8,20,{front:C.blueL,top:'#dfe5f2'})});
    s+=`<g opacity="${r1(o)}">${g}</g>`}

  /* S9 77.5–: end card */
  if(t>77.3){let g='';
    g+=T(270,300,'DATA / 03',{size:8,fill:C.muted,a:'middle',ls:2});
    g+=T(270,342-8*(1-E(t,77.5,78.1)),'Spark Performance',{size:26,w:800,a:'middle'});
    g+=T(270,366,'Episode 3 · Shuffling',{size:9,fill:C.muted,a:'middle'});
    KEYS.forEach((k,i)=>{const x=172+i*52;g+=`<g opacity="${r1(E(t,77.8+i*.12,78.1+i*.12))}">`+R(x,394,40,20,{rx:4,fill:i?C.paper:C.blue,stroke:C.blue,sw:1.2})+T(x+20,408,k,{size:8,w:700,fill:i?C.blue:'#fff',a:'middle'})+'</g>'});
    g+=T(270,470,'BinaryHabit<tspan fill="'+C.red+'">.</tspan>',{size:17,w:800,a:'middle',raw:true,op:E(t,78.4,78.8)});
    s+=`<g opacity="${r1(E(t,77.5,77.9))}">${g}</g>`}

  if(CC){let ci=-1;CAPS.forEach((c,i)=>{if(t>=c[0])ci=i});
    if(ci>=0&&t<79.5){const c=CAPS[ci][1],w=c.length*8.6+24;s+=`<g opacity="${r1(cl((t-CAPS[ci][0])/.12))}">`+R(270-w/2,858,w,32,{rx:6,fill:C.ink})+`<text x="270" y="879" font-size="14" font-weight="600" fill="${C.paper}" text-anchor="middle" font-family="Inter, system-ui, sans-serif">${esc(c)}</text></g>`}}
  return s}

const DEFS=`<defs><pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="${C.teal}"/><rect width="3" height="8" fill="#5aa293"/></pattern></defs>`;
const svg=document.getElementById('g'),$=id=>document.getElementById(id);
let VT=0,PLAY=true,CC=true,LAST=performance.now();
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function loop(now){const dt=Math.min(.1,(now-LAST)/1000);LAST=now;if(PLAY){VT+=dt;if(VT>=DUR)VT=0}
  svg.innerHTML=DEFS+frame(VT);$('seek').value=VT/DUR*1000;$('time').textContent=`${fmt(VT)} / ${fmt(DUR)}`;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
$('play').onclick=()=>{PLAY=!PLAY;$('play').textContent=PLAY?'Pause':'Play'};
$('cc').onclick=()=>{CC=!CC;$('cc').setAttribute('aria-pressed',CC);$('cc').style.opacity=CC?1:.55};
$('seek').oninput=e=>{VT=e.target.value/1000*DUR};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click()}});
</script>
</body>
